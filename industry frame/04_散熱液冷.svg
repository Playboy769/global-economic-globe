<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>散熱／液冷框架邏輯圖（詳細版）</title>
<desc>散熱與液冷誤用框架與正確框架的三層推論鏈</desc>

<style>
text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;font-weight:400}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#444441}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D}
.c-red .th{fill:#501313}
.c-red .ts{fill:#791F1F}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11}
.c-green .th{fill:#173404}
.c-green .ts{fill:#27500A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>

<rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray">
<rect x="220" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="38" text-anchor="middle" dominant-baseline="central">散熱／液冷</text>
<text class="ts" x="340.0" y="56" text-anchor="middle" dominant-baseline="central">伺服器台數其實沒變</text>
</g>
<path d="M340 76 L340 108 L190 108 L190 140" class="arr" marker-end="url(#arrow)"/>
<path d="M340 76 L340 108 L490 108 L490 140" class="arr" marker-end="url(#arrow)"/>
<g class="c-red">
<rect x="60" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190.0" y="158" text-anchor="middle" dominant-baseline="central">誤用框架</text>
<text class="ts" x="190.0" y="176" text-anchor="middle" dominant-baseline="central">拿出貨量建立模型</text>
</g>
<line x1="190" y1="196" x2="190" y2="230" class="arr" marker-end="url(#arrow)"/>
<g class="c-red">
<rect x="60" y="230" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190.0" y="248" text-anchor="middle" dominant-baseline="central">誤判邏輯</text>
<text class="ts" x="190.0" y="266" text-anchor="middle" dominant-baseline="central">沒注意單機規格已改變</text>
</g>
<line x1="190" y1="286" x2="190" y2="320" class="arr" marker-end="url(#arrow)"/>
<g class="c-red">
<rect x="60" y="320" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190.0" y="338" text-anchor="middle" dominant-baseline="central">後果</text>
<text class="ts" x="190.0" y="356" text-anchor="middle" dominant-baseline="central">看不懂量沒變為何漲</text>
</g>
<g class="c-green">
<rect x="360" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490.0" y="158" text-anchor="middle" dominant-baseline="central">正確框架</text>
<text class="ts" x="490.0" y="176" text-anchor="middle" dominant-baseline="central">看單機價值量、卡規格</text>
</g>
<line x1="490" y1="196" x2="490" y2="230" class="arr" marker-end="url(#arrow)"/>
<g class="c-green">
<rect x="360" y="230" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490.0" y="248" text-anchor="middle" dominant-baseline="central">關鍵機制</text>
<text class="ts" x="490.0" y="266" text-anchor="middle" dominant-baseline="central">spec-in卡進料表鎖長約</text>
</g>
<line x1="490" y1="286" x2="490" y2="320" class="arr" marker-end="url(#arrow)"/>
<g class="c-green">
<rect x="360" y="320" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490.0" y="338" text-anchor="middle" dominant-baseline="central">再拆一層</text>
<text class="ts" x="490.0" y="356" text-anchor="middle" dominant-baseline="central">各段門檻與格局不同</text>
</g>
</svg>