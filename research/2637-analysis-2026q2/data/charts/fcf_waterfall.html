  <div style="font-size:12px;color:#666;text-align:center;margin-top:6px;">營運現金流NT$5,357.1M為近年高點；扣造船/購船資本支出NT$441.6M、加處分舊船價款NT$543.9M後FCF達NT$5,459.4M。股利分配NT$1,669.2M（對2025年度盈餘，每股NT$3.5元）後，淨借款變動（含租賃清償）為正NT$448.2M。⚠️ 此簡化橋接聚焦營運現金生成與資本配置主軸，未納入CFI項下其他金融資產（定存/受限資金等）異動，故末項不等於實際現金總變動（H1實際現金減少NT$516.4M，主因短期理財性資產調整與匯率換算，非核心營運現金流所致）。來源：2026Q2合併現金流量表YTD數字。</div>
