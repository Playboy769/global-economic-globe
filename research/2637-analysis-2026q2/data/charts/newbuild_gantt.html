  <div style="font-size:12px;color:#666;text-align:center;margin-top:6px;">來源：2026Q2合併財報附註九「重大或有負債及未認列之合約承諾」。合約總價US$234,753,200，已付US$55,811,500，餘款分別於安放龍骨／下水／交船時支付，預計2027Q3前付清；尚未辦妥融資。⚠️ 法說會第三方摘要另提及「2026年交付8艘」，與此處財報揭露之「截至6/30尚未交船7艘」口徑不同（前者含揭露時點前已交船者），本圖以財報附註九為準。</div>
