<div id="sankeyEmbed_taiyen6274" style="width:100%;height:520px;background:#fff;border:1px solid #eee;border-radius:6px;position:relative;"></div>
<script>
(function(){
  var DATA = {"nodes":[{"id":"cu","label":"電解銅箔供應商群（南亞/長春/台灣銅箔等，產業推估37.5%成本）","color":"#94a3b8"},{"id":"gf","label":"玻璃纖維布供應商群（台玻/富喬等，產業推估26%成本）","color":"#94a3b8"},{"id":"resin","label":"樹脂供應商（未具名，產業推估24%成本）","color":"#94a3b8"},{"id":"tuc","label":"台燿科技(6274)　2026Q2營收143.0億","color":"#15181a"},{"id":"m78","label":"M7/M8 極低損耗（39%，2026Q2）","color":"#2563eb"},{"id":"m46","label":"M4/M6 低/極低損耗（31%，2026Q2）","color":"#2563eb"},{"id":"others","label":"Others 利基型（14%，2026Q2）","color":"#2563eb"},{"id":"nll","label":"Non-low loss 一般材料（16%，2026Q2）","color":"#2563eb"},{"id":"ai","label":"AI伺服器/800G高速交換器（策略重心，推估對應）","color":"#c2600a"},{"id":"comm","label":"5G/B5G通訊設備（推估對應）","color":"#c2600a"},{"id":"sat","label":"低軌衛星通訊（推估對應）","color":"#c2600a"},{"id":"auto","label":"車用電子（推估對應）","color":"#c2600a"},{"id":"cons","label":"消費性電子（推估對應）","color":"#c2600a"}],"links":[{"source":"cu","target":"tuc","value":3769},{"source":"gf","target":"tuc","value":2613},{"source":"resin","target":"tuc","value":2412},{"source":"tuc","target":"m78","value":5577},{"source":"tuc","target":"m46","value":4433},{"source":"tuc","target":"others","value":2002},{"source":"tuc","target":"nll","value":2288},{"source":"m78","target":"ai","value":5577},{"source":"m46","target":"ai","value":2660},{"source":"m46","target":"comm","value":1773},{"source":"others","target":"sat","value":1001},{"source":"others","target":"auto","value":1001},{"source":"nll","target":"cons","value":2288}]};
  function render(){
    var container = document.getElementById("sankeyEmbed_taiyen6274");
    if (!container) return;
    var svg = d3.select(container).append("svg").attr("width","100%").attr("height","100%").style("display","block");
    var gMain = svg.append("g");
    var tooltip = document.createElement("div");
    tooltip.style.cssText = "position:absolute;pointer-events:none;background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px 10px;font:12px 'Noto Serif TC',serif;color:#0a0a0a;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;z-index:10;white-space:pre-line;";
    container.appendChild(tooltip);
    function showTooltip(event, text){
      var rect = container.getBoundingClientRect();
      tooltip.textContent = text;
      tooltip.style.display = "block";
      tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (event.clientY - rect.top + 12) + 'px';
    }
    function hideTooltip(){ tooltip.style.display = "none"; }
    function draw(){
      var rect = container.getBoundingClientRect();
      var w = rect.width, h = rect.height;
      if (w < 50 || h < 50) return;
      svg.attr("viewBox", [0,0,w,h]).attr("preserveAspectRatio","xMidYMid meet");
      gMain.selectAll("*").remove();
      if (!DATA.nodes.length) return;
      try {
        var nodePadding = 16;
        function makeGen(extentH){
          return d3.sankey().nodeId(function(d){return d.id;}).nodeWidth(14).nodePadding(nodePadding).iterations(64).nodeAlign(d3.sankeyJustify).extent([[10,10],[w-10,extentH-10]]);
        }
        var nodesCopy1 = DATA.nodes.map(function(n){ return {id:n.id,label:n.label,color:n.color}; });
        var linksCopy1 = DATA.links.map(function(l){ return {source:l.source,target:l.target,value:l.value}; });
        var graph1 = makeGen(h)({nodes:nodesCopy1, links:linksCopy1});
        var colCounts = {};
        graph1.nodes.forEach(function(n){ var cx = Math.round(n.x0); colCounts[cx] = (colCounts[cx]||0)+1; });
        var maxPerColumn = 0;
        for (var ck in colCounts) { if (colCounts[ck] > maxPerColumn) maxPerColumn = colCounts[ck]; }
        var virtualH = Math.max(h, maxPerColumn*26);
        var graph;
        if (virtualH > h) {
          var nodesCopy2 = DATA.nodes.map(function(n){ return {id:n.id,label:n.label,color:n.color}; });
          var linksCopy2 = DATA.links.map(function(l){ return {source:l.source,target:l.target,value:l.value}; });
          graph = makeGen(virtualH)({nodes:nodesCopy2, links:linksCopy2});
        } else {
          graph = graph1;
          virtualH = h;
        }
        svg.attr("viewBox", [0,0,w,virtualH]).attr("preserveAspectRatio","xMidYMid meet");
        var k = Math.min(1, h / virtualH);
        var fontSize = Math.min(10.5/k, 10.5/0.45);
        var minSep = fontSize + 3;
        var dodgeGroups = {};
        graph.nodes.forEach(function(d){
          var anchorLeft = d.x0 < w/2;
          var gx = Math.round(anchorLeft ? d.x1 : d.x0);
          var gkey = (anchorLeft ? "L" : "R") + "_" + gx;
          (dodgeGroups[gkey] = dodgeGroups[gkey] || []).push(d);
        });
        Object.keys(dodgeGroups).forEach(function(gkey){
          var arr = dodgeGroups[gkey];
          arr.sort(function(a,b){ return (a.y0+a.y1)/2 - (b.y0+b.y1)/2; });
          var prevY = null;
          arr.forEach(function(d){
            var y = (d.y0+d.y1)/2;
            if (prevY !== null && y - prevY < minSep) y = prevY + minSep;
            d._labelY = y;
            prevY = y;
          });
        });
        var linkSel = gMain.append("g").attr("fill","none").selectAll("path").data(graph.links).enter().append("path")
          .attr("d", d3.sankeyLinkHorizontal())
          .attr("stroke", function(d){ return d.source.color; })
          .attr("stroke-width", function(d){ return Math.max(1, d.width); })
          .attr("stroke-opacity", 0.38);
        var nodeSel = gMain.append("g").selectAll("g").data(graph.nodes).enter().append("g");
        nodeSel.append("rect")
          .attr("x", function(d){ return d.x0; })
          .attr("y", function(d){ return d.y0; })
          .attr("width", function(d){ return d.x1-d.x0; })
          .attr("height", function(d){ return Math.max(1, d.y1-d.y0); })
          .attr("fill", function(d){ return d.color; })
          .attr("rx", 1);
        nodeSel.append("text")
          .attr("x", function(d){ return d.x0 < w/2 ? d.x1+6 : d.x0-6; })
          .attr("y", function(d){ return d._labelY; })
          .attr("text-anchor", function(d){ return d.x0 < w/2 ? "start" : "end"; })
          .attr("dominant-baseline", "middle")
          .style("font", "500 " + fontSize + "px 'Noto Serif TC', serif")
          .style("paint-order", "stroke")
          .style("stroke", "#fff")
          .style("stroke-width", "3px")
          .style("stroke-linejoin", "round")
          .attr("fill", "#333")
          .text(function(d){ return d.label; });
        var connectedMap = {};
        graph.links.forEach(function(l){
          (connectedMap[l.source.id] = connectedMap[l.source.id] || {})[l.target.id] = true;
          (connectedMap[l.target.id] = connectedMap[l.target.id] || {})[l.source.id] = true;
        });
        nodeSel.on("mousemove", function(event, d){
          showTooltip(event, d.label + "\n流量 " + d.value.toLocaleString());
          var connected = connectedMap[d.id] || {};
          linkSel.attr("stroke-opacity", function(l){ return (l.source.id===d.id || l.target.id===d.id) ? 0.65 : 0.08; });
          nodeSel.select("rect").attr("opacity", function(n){ return (n.id===d.id || connected[n.id]) ? 1 : 0.35; });
          nodeSel.select("text").attr("opacity", function(n){ return (n.id===d.id || connected[n.id]) ? 1 : 0.25; });
        }).on("mouseleave", function(){
          hideTooltip();
          linkSel.attr("stroke-opacity", 0.38);
          nodeSel.select("rect").attr("opacity", 1);
          nodeSel.select("text").attr("opacity", 1);
        });
        linkSel.on("mousemove", function(event, d){
          showTooltip(event, d.source.label + " → " + d.target.label + "\n" + d.value.toLocaleString());
          linkSel.attr("stroke-opacity", function(l){ return l===d ? 0.7 : 0.08; });
        }).on("mouseleave", function(){
          hideTooltip();
          linkSel.attr("stroke-opacity", 0.38);
        });
      } catch (err) { /* layout error: leave blank rather than crash the host page */ }
    }
    draw();
    if (window.ResizeObserver) {
      var t;
      new ResizeObserver(function(){ clearTimeout(t); t = setTimeout(draw, 150); }).observe(container);
    }
    if (window.IntersectionObserver) {
      new IntersectionObserver(function(entries){
        if (entries[0].isIntersecting) draw();
      }).observe(container);
    }
    var pollTries = 0;
    var pollId = setInterval(function(){
      pollTries++;
      if (container.querySelector('rect') || pollTries > 1800) { clearInterval(pollId); return; }
      var pr = container.getBoundingClientRect();
      if (pr.width >= 50 && pr.height >= 50) draw();
    }, 400);
    container.addEventListener('mouseenter', function(){ if (!container.querySelector('rect')) draw(); });
  }
  if (window.d3 && d3.sankey) { render(); return; }
  if (!window.__sankeyD3Load) {
    window.__sankeyD3Load = new Promise(function(resolve){
      var s1 = document.createElement("script");
      s1.src = "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js";
      s1.onload = function(){
        var s2 = document.createElement("script");
        s2.src = "https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js";
        s2.onload = resolve;
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    });
  }
  window.__sankeyD3Load.then(render);
})();
</script>
