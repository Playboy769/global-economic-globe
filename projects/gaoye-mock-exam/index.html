           '<div class="sc ' + (pass ? 'pass' : 'fail') + '">' + r.score + '</div>' +
           '<div class="vd">答對 ' + r.right + '／' + r.tot + '　未作答 ' + r.blank +
           '<span class="badge ' + (pass ? 'ok' : 'ng') + '">' +
           (pass ? '單科達標' : '單科未達標') + '</span></div></div>';
  }).join('');

  const overall = !anySubj ? '' :
    '<div class="card"><b>整份成績</b>　三科總分 ' + total +
    (allGraded
      ? ('　<span class="badge ' + ((allPass && total > 210) ? 'ok' : 'ng') + '">' +
         ((allPass && total > 210) ? '及格' : '不及格') + '</span>')
      : '　（尚有科目未交卷，暫無法判定整體及格）') +
    '<div style="margin-top:6px;font-size:13px;color:#666">' +
    '及格標準：各科不低於 50 分，且三科總分高於 210 分。</div></div>';

  const tags = Object.keys((res && res.byTag) || {}).map(function (t) { return res.byTag[t]; })
    .sort(function (a, b) {
      return (a.right / a.tot) - (b.right / b.tot) || b.tot - a.tot;
    });

  const tagRows = tags.map(function (v) {
    const pct = Math.round(v.right / v.tot * 100);
    return '<tr><td' + (pct < 60 ? ' class="wk"' : '') + '>' + esc(v.name) + '</td>' +
           '<td class="n">' + v.right + '/' + v.tot + '</td>' +
           '<td class="n' + (pct < 60 ? ' wk' : '') + '">' + pct + '%</td></tr>';
  }).join('');

  const k = key(S.paper, S.subj);
  const qs = qsOf(S.paper, S.subj);
  const ord = S.order[k];
  const review = ord.map(function (qi, pos) {
    const q = qs[qi];
    const a = S.ans[k][qi];
    const cls = !a ? 'blank' : (a === q.ans ? 'right' : 'wrong');
    const badge = !a ? '<span class="badge">未作答</span>'
      : (a === q.ans ? '<span class="badge ok">答對</span>'
                     : '<span class="badge ng">答錯</span>');
    const opts = q.opts.map(function (o) {
      let c = 'opt';
      if (o[0] === q.ans) { c += ' ans'; } else if (o[0] === a) { c += ' you'; }
      return '<div class="' + c + '"><span class="L">(' + o[0] + ')</span>' + esc(o[1]) + '</div>';
    }).join('');
    // 解析只在答錯或未作答時出現 —— 答對就不佔版面。
    const ex = (cls !== 'right' && q.ex)
      ? '<div class="ex"><b>解析</b>' + esc(q.ex) + '</div>' : '';
    return '<div class="q ' + cls + '">' +
           '<div class="qh"><span class="qn">' + (pos + 1) + '.</span>' +
           '<span class="qt">' + esc(q.head) + badge +
           '<div class="tagline">' + esc(q.tag) + '</div></span></div>' + opts +
           '<div class="src">正解 (' + q.ans + ')　｜　' + esc(q.srcTxt) + '</div>' +
           ex + '</div>';
  }).join('');

  box.innerHTML = '<div class="res-row">' + cards + '</div>' + overall +
    '<div class="card"><b>' + esc(S.subj) + '</b> 各觀念得分（正確率低於 60% 以紅字標示）' +
    '<table style="margin-top:12px"><thead><tr><th>觀念</th>' +
    '<th class="n">答對/題數</th><th class="n">正確率</th></tr></thead><tbody>' +
    tagRows + '</tbody></table>' +
    '<div style="margin-top:12px;font-size:13px;color:#666">' +
    '切換上方科目分頁可看另外兩科的作答狀態；已交卷的科目會顯示分數與逐題檢討。</div></div>' +
    '<h2 style="font-size:19px;margin:26px 0 14px">' + esc(S.subj) + ' 逐題檢討</h2>' + review;

  document.getElementById('prog').textContent = '本科已交卷';
  document.getElementById('btnSubmit').disabled = true;
}

// ---------- 錯題本 ----------
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

function lineChart(rows) {
  // 進步曲線：零依賴的內嵌 SVG。x = 第幾次交卷，y = 分數 0-100，三科各一條線。
  if (!rows.length) { return '<div class="empty">還沒有任何交卷紀錄。</div>'; }
  const byTs = {};
  rows.forEach(function (r) { (byTs[r.ts] = byTs[r.ts] || {})[r.subject] = r; });
  const stamps = Object.keys(byTs).sort();
  const W = Math.max(560, 90 + stamps.length * 66), H = 260;
  const L = 46, R = 16, T = 16, B = 46;
  const x = function (i) {
    return L + (stamps.length < 2 ? 0 : i * (W - L - R) / (stamps.length - 1));
  };
  const y = function (v) { return T + (100 - v) * (H - T - B) / 100; };
  const colors = {'投資學': 'var(--chart-1)', '財務分析': 'var(--chart-2)', '法規': 'var(--chart-3)'};
  let g = '';
  for (let v = 0; v <= 100; v += 25) {
    g += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v) +
         '" stroke="' + (v === 50 ? 'var(--fail)' : 'var(--chart-grid)') + '"' +
         (v === 50 ? ' stroke-dasharray="4 3"' : '') + '/>' +
         '<text x="' + (L - 8) + '" y="' + (y(v) + 4) +
         '" font-size="11" fill="var(--chart-axis)" text-anchor="end">' + v + '</text>';
  }
  DATA.subjects.forEach(function (s) {
    const pts = [];
    stamps.forEach(function (t, i) {
      const r = byTs[t][s];
      if (r) { pts.push([x(i), y(r.score)]); }
    });
    if (!pts.length) { return; }
    g += '<polyline fill="none" stroke="' + colors[s] + '" stroke-width="2" points="' +
         pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>';
    g += pts.map(function (q) {
      return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) +
             '" r="3.2" fill="' + colors[s] + '"/>';
    }).join('');
  });
  stamps.forEach(function (t, i) {
    const d = new Date(t);
    g += '<text x="' + x(i) + '" y="' + (H - B + 18) +
         '" font-size="10" fill="var(--chart-axis)" text-anchor="middle">' +
         (d.getMonth() + 1) + '/' + d.getDate() + '</text>';
  });
  const legend = DATA.subjects.map(function (s) {
    return '<span style="margin-right:16px;font-size:13px">' +
           '<span style="display:inline-block;width:11px;height:3px;background:' + colors[s] +
           ';vertical-align:middle;margin-right:5px"></span>' + esc(s) + '</span>';
  }).join('') + '<span style="font-size:13px;color:#b91c1c">— — 50 分（單科最低門檻，另需三科合計逾 210 分）</span>';
  return '<div class="chart"><svg width="' + W + '" height="' + H + '" role="img">' + g +
         '</svg></div><div style="margin-top:6px">' + legend + '</div>';
}

function renderReview() {
  const box = document.getElementById('review');
  box.innerHTML = '<div class="empty">載入紀錄中…</div>';
  const get = function (u) {
    return fetch(u).then(function (r) { return r.json(); })
                   .catch(function () { return {items: []}; });
  };
  Promise.all([get('api/history'), get('api/stats'), get('api/wrong?limit=200')])
    .then(function (out) {
      const hist = out[0].items || [], stats = out[1].items || [], wrong = out[2].items || [];
      const pend = loadQueue().length;

      const statRows = stats.map(function (v) {
        const p = pct(v.nright, v.nanswered);
        return '<tr><td>' + esc(v.subject) + '</td><td' + (p < 60 ? ' class="wk"' : '') + '>' +
               esc(v.tag) + '</td><td class="n">' + v.nright + '/' + v.nanswered +
               '</td><td class="n' + (p < 60 ? ' wk' : '') + '">' + p + '%</td></tr>';
      }).join('');

      const wrongCards = wrong.map(function (w) {
        const q = findQuestion(w.qid);
        const picks = (w.wrongPicks || '').split(',').map(function (s) { return s.trim(); });
        const opts = (q && q.opts) ? q.opts.map(function (o) {
          let c = 'opt';
          if (o[0] === q.ans) { c += ' ans'; } else if (picks.indexOf(o[0]) !== -1) { c += ' you'; }
          return '<div class="' + c + '"><span class="L">(' + o[0] + ')</span>' + esc(o[1]) + '</div>';
        }).join('') : '';
        const ex = (q && q.ex)
          ? '<div class="ex"><b>解析</b>' + esc(q.ex) + '</div>' : '';
        return '<div class="wq"><div class="wh">' + esc(w.head) + '</div>' +
               '<div class="wm"><span class="pill">錯 ' + w.nwrong + ' 次</span>' +
               esc(w.subject) + '｜' + esc(w.tag) + '｜作答 ' + w.nseen + ' 次' +
               (w.wrongPicks ? '｜錯選 ' + esc(w.wrongPicks) : '') + '</div>' +
               opts + ex + '</div>';
      }).join('');

      box.innerHTML =
        (pend ? '<div class="note">尚有 <b>' + pend +
                '</b> 份離線紀錄待補傳，連上線後會自動送出。</div>' : '') +
        '<h2>進步曲線</h2>' + lineChart(hist) +
        '<h2>觀念弱點（正確率低於 60% 標紅）</h2>' +
        (stats.length
          ? '<div class="card"><table><thead><tr><th>科目</th><th>觀念</th>' +
            '<th class="n">答對/作答</th><th class="n">正確率</th></tr></thead><tbody>' +
            statRows + '</tbody></table></div>'
          : '<div class="empty">還沒有作答紀錄。</div>') +
        '<h2>錯題清單（' + wrong.length + ' 題）' +
        (wrong.length
          ? ' <button class="btn" id="btnRetry" type="button" ' +
            'style="font-size:14px;padding:6px 14px;margin-left:8px">用這些題組一份重練卷</button>'
          : '') +
        '</h2>' + (wrong.length ? wrongCards : '<div class="empty">目前沒有錯題。</div>');

      const rb = document.getElementById('btnRetry');
      if (rb) { rb.onclick = function () { buildRetry(wrong); }; }
    });
}

// 用錯題組重練卷：題目本來就內嵌在本頁，依 qid 撈回來即可，不必再跟伺服器要題目。
function buildRetry(wrong) {
  const want = {};
  wrong.forEach(function (w) { want[w.qid] = true; });
  const seen = {}, subjects = {};
  DATA.papers.forEach(function (p) {
    if (p.id === 'retry') { return; }
    DATA.subjects.forEach(function (s) {
      (p.subjects[s] || []).forEach(function (q) {
        if (want[q.id] && !seen[q.id]) {
          seen[q.id] = true;
          (subjects[s] = subjects[s] || []).push(q);
        }
      });
    });
  });
  DATA.subjects.forEach(function (s) { subjects[s] = subjects[s] || []; });
  const n = DATA.subjects.reduce(function (a, s) { return a + subjects[s].length; }, 0);
  if (!n) { alert('這些錯題不在目前這兩份卷裡，無法組卷。'); return; }

  const paper = {id: 'retry', name: '錯題重練卷', subjects: subjects,
                 note: '由歷次答錯的題目組成，共 ' + n + ' 題。每次重組都會依最新錯題名單產生。'};
  const at = DATA.papers.findIndex(function (p) { return p.id === 'retry'; });
  if (at >= 0) { DATA.papers.splice(at, 1, paper); } else { DATA.papers.push(paper); }

  DATA.subjects.forEach(function (s) {
    const k = key('retry', s);
    S.ans[k] = {};
    S.left[k] = secBudget('retry', s);
    S.started[k] = false;
    delete S.done[k];
    shuffleSubject('retry', s);
  });
  S.view = 'exam';
  S.paper = 'retry';
  S.subj = DATA.subjects.find(function (s) { return subjects[s].length; }) || DATA.subjects[0];
  document.getElementById('btnSubmit').disabled = false;
  renderTabs(); renderQuiz(); updateProg();
}

flushQueue();
initTheme();
initState();
renderTabs();
renderQuiz();
updateProg();
</script>
