D", "0.6"]], "ans": "B", "tag": "股東權益、股票股利與庫藏股", "srcTxt": "114年第2次 財務分析筆記　第3題", "ex": "本益比（P/E ratio）＝普通股每股市價 ÷ 普通股每股盈餘（EPS），須先求出歸屬普通股股東之盈餘與EPS。\n\n第一步，計算特別股股利（不可轉換特別股股利需自淨利中先行扣除，才能得出歸屬普通股之盈餘）： 特別股股利 = 8% × 每股面額$10 × 50,000股 = $40,000\n\n第二步，計算歸屬普通股股東之可分配盈餘： 普通股可分配盈餘 = 稅後淨利 − 特別股股利 = $100,000 − $40,000 = $60,000\n\n第三步，計算普通股每股盈餘（EPS）： EPS = 普通股可分配盈餘 ÷ 流通在外普通股股數 = $60,000 ÷ 100,000股 = $0.6\n\n第四步，計算本益比： 本益比 = 每股市價 ÷ EPS = $60 ÷ $0.6 = 100"}, {"id": "14a2e25f05af", "head": "奈川公司111年度申報所得稅時有營業虧損$30,000，若該公司以前年度皆無虧損且預估112年度課稅所得將大於$30,000，則於111年底可認列何種項目？", "opts": [["A", "不能認列任何資產"], ["B", "預付111年度所得稅"], ["C", "遞延所得稅資產"], ["D", "應收退稅款"]], "ans": "C", "tag": "所得稅與遞延所得稅", "srcTxt": "114年第2次 財務分析筆記　第4題", "ex": "本題涉及虧損扣抵（税務虧損遞轉後期）之會計處理，重點在於：該虧損能否用以扣抵「未來」課稅所得，以及是否符合資產認列之可實現性條件。\n\n奈川公司111年度發生營業虧損$30,000，且以前年度均無虧損可供扣抵，代表此虧損無法「遞轉以前年度」申請退稅（沒有前期課稅所得可扣抵），因此不會產生應收退稅款，(D)不成立；同時，公司當年度並無多繳稅款，也未有預先繳納下一年度稅款之事實，故(B)「預付111年度所得稅」亦不成立，屬於無中生有的項目。\n\n由於公司預估112年度課稅所得將大於$30,000，代表這筆虧損可遞轉以後年度，用以扣抵未來應納稅所得額，進而減少未來應付所得稅。依據所得稅之會計處理原則，當企業有「可減除未來課稅所得之租稅虧損」，且有充分證據（如預估未來有足夠課稅所得）證明該虧損很有可能於未來實現扣抵效益時，應於發生虧損之當年度認列「遞延所得稅資產」，金額為虧損金額乘以適用稅率（例如稅率20%時，$30,000×20%=$6,000）。\n\n因此，(A)「不能認列任何資產」不正確，因虧損可遞轉後期扣抵，符合資產認列條件。"}, {"id": "27ea3708cdaa", "head": "某企業今年度的銷貨收入為300萬元，變動成本為180萬元，固定成本為90萬元，預估明年度固定成本為120萬元，邊際貢獻率不變，但企業希望明年度的淨利能達50萬元，請問其目標銷貨收入成長率應為多少？", "opts": [["A", "33.3%"], ["B", "41.7%"], ["C", "0%"], ["D", "16.7%"]], "ans": "B", "tag": "成本習性、損益兩平與營運槓桿", "srcTxt": "114年第2次 財務分析筆記　第5題", "ex": "本題屬本量利分析（CVP分析）之應用，須先由今年度資料求出邊際貢獻率，再據此推算明年度達成目標淨利所需之銷貨收入水準，最後換算為成長率。\n\n第一步，計算今年度邊際貢獻率： 邊際貢獻率 = (銷貨收入 − 變動成本) ÷ 銷貨收入 = (300 − 180) ÷ 300 = 120 ÷ 300 = 40%\n\n由於題目明示「邊際貢獻率不變」，明年度仍適用此40%比率。\n\n第二步，設明年度目標銷貨收入為 S（萬元），依淨利公式： 淨利 = 銷貨收入 × 邊際貢獻率 − 固定成本 50 = S × 40% − 120 50 = 0.4S − 120 0.4S = 170 S = 425（萬元）\n\n第三步，計算目標銷貨收入成長率： 成長率 = (明年目標銷貨收入 − 今年銷貨收入) ÷ 今年銷貨收入 = (425 − 300) ÷ 300 = 125 ÷ 300 ≈ 41.7%"}, {"id": "bab0e54df710", "head": "在企業面臨清算時，財產求償較優先者為何？", "opts": [["A", "普通股股東"], ["B", "債權人"], ["C", "特別股股東"], ["D", "存託憑證（DR）持有人"]], "ans": "B", "tag": "其他", "srcTxt": "114年第2次 財務分析筆記　第6題", "ex": "本題涉及企業清算時，各類請求權人對剩餘財產之受償順位問題。清算清償順位之核心原則為：「債權性質」之請求權優先於「股權性質」之請求權，且股權性質中亦有內部順位之分。\n\n清算時之一般求償順位為：\n\n第一順位：債權人（含有擔保債權人、無擔保債權人等，各類債權人間再依擔保與否細分先後）。債權人對企業之請求權屬契約性質之固定債權，法律上明定其求償優先於任何股東權益，須先清償完畢，公司剩餘財產才輪到股東分配。\n\n第二順位：特別股股東。特別股雖屬股權性質，但其求償順位依約定通常優於普通股（此為特別股「優先性」之體現），惟仍次於全體債權人之後。\n\n第三順位：普通股股東。普通股股東為剩餘財產請求權人（residual claimants），須待債權人與特別股股東之請求權皆獲滿足後，方能就剩餘財產進行分配，故求償順位最後。\n\n至於(D)存託憑證（DR）持有人，DR本質上是代表持有人對其所連結之標的股票（通常為普通股）享有權益之憑證，其股東權益性質與普通股相當，清算時之求償順位亦與普通股股東相同，同屬排序最後之股權性質請求權，並不優先於特別股股東或債權人。\n\n綜合比較四個選項，債權人之求償順位在企業清算時最為優先。"}, {"id": "6c3e963e3fdc", "head": "辨別一項負債是否為流動負債的時間長短，是以一年或一個營業週期：", "opts": [["A", "取長者為判斷"], ["B", "取一年或一個營業週期兩者之平均"], ["C", "無法判斷"], ["D", "取短者為判斷"]], "ans": "A", "tag": "週轉率與活動比率", "srcTxt": "114年第2次 財務分析筆記　第7題", "ex": "本題屬會計準則中「流動負債」定義判斷基準之界定型論證。依一般公認會計原則，流動負債係指預期於企業正常營業週期內，或於資產負債表日後一年內（兩者取其較長者）到期清償之負債。\n\n之所以採「取長者」而非「取短者」或「平均」，理由在於：企業之正常營業週期長短因產業特性而異，例如營建業、造船業、釀酒業等，其存貨自投入生產至變現回收之週期往往超過一年。若僅以固定的一年作為判斷基準（即採較短者），將可能把實際上仍屬企業正常營運所需、應歸類為流動負債之項目，誤判為非流動負債，導致財務報表無法真實反映企業短期償債能力與營運週期特性。因此準則明定以「一年」與「一個正常營業週期」兩者中較長者，作為劃分流動與非流動負債之標準，確保涵蓋週期較長產業於其營業週期內須清償之負債仍能被正確歸類為流動負債。\n\n其餘選項不成立之理由： (B) 取平均——現行會計準則並無此種折衷規定，缺乏依據。 (C) 無法判斷——準則對此已有明確、可操作之判斷標準，並非無法判斷。 (D) 取短者為判斷——會使跨越較長營業週期之負債被錯誤歸類為非流動負債，扭曲流動負債之揭露意義。"}, {"id": "cca288cd7ba8", "head": "大安公司X1年8月1日有存貨60件，每件成本價$60，當月進貨90件，銷售105件，採定期盤存制及加權平均成本公式。若X1年8月31日存貨成本為$2,538，請問：當月進貨單位成本為多少？", "opts": [["A", "$55"], ["B", "$54"], ["C", "$56.4"], ["D", "$60\n\n答案為 (B) $54。"]], "ans": "B", "tag": "其他", "srcTxt": "114年第3次 財務分析筆記　第1題", "ex": "這題考的是定期盤存制（Periodic Inventory System）下的加權平均成本法（Weighted Average Cost Method），關鍵在於理解：定期盤存制下，加權平均單位成本要等到月底才一次計算，而且期末存貨與已售商品用的是同一個加權平均單位成本（不像永續盤存制那樣每次進貨都要重新計算移動平均成本）。\n\n第一步：算出期末存貨數量 期末存貨數量 ＝ 期初存貨 ＋ 本月進貨 － 本月銷售 ＝ 60 ＋ 90 － 105 ＝ 45件\n\n第二步：反推期末存貨的加權平均單位成本 因為定期盤存制下，期末存貨與銷貨成本是用同一個加權平均單位成本去分攤，題目已告知期末存貨總成本為$2,538，所以： 單位成本 ＝ $2,538 ÷ 45件 ＝ $56.4／件\n\n第三步：用加權平均公式反推當月進貨單位成本 加權平均單位成本的公式是： 加權平均單位成本 ＝（期初存貨成本 ＋ 本月進貨成本）÷（期初數量 ＋ 本月進貨數量）\n\n設當月進貨單位成本為 x，代入數字： $56.4 ＝（60×$60 ＋ 90×x）÷（60 ＋ 90） $56.4 ＝（$3,600 ＋ 90x）÷ 150\n\n兩邊同乘150： $8,460 ＝ $3,600 ＋ 90x 90x ＝ $4,860 x ＝ $4,860 ÷ 90 ＝ $54\n\n所以當月進貨單位成本為 $54，答案為(B)。這題容易讓人誤把「期末單位成本$56.4」直接當成答案選(C)，但題目問的是「當月進貨的單位成本」，而不是「期末存貨的加權平均單位成本」，兩者是不同的數字—$56.4是期初與當月進貨混合平均後的結果，必須再透過加權平均公式反推回去，才能求出當月進貨本身真正的單位成本是$54，這正是本題設計的關鍵陷阱。"}, {"id": "3239fcf26880", "head": "累積特別股5%面額$100（核准發行1,000股），帳面上特別股折價為$3,000、積欠股利$7,000，普通股每股面額$40，核准發行10,000股，已發行8,000股，普通股溢價為$68,000，累積盈餘為$30,000，特別股收回價格為$110，則普通股每股帳面金額為？", "opts": [["A", "$63.25"], ["B", "$49.75"], ["C", "$49.5"], ["D", "$50.125\n\n答案為 (B) $49.75。"]], "ans": "B", "tag": "其他", "srcTxt": "114年第3次 財務分析筆記　第2題", "ex": "這題考的是「每股帳面金額（Book Value per Share）」的計算，重點在於處理累積特別股這個變數——當公司同時發行特別股和普通股時，計算普通股每股帳面金額前，必須先把「屬於特別股股東」的權益總額從全體股東權益中扣除，剩下的才是「屬於普通股股東」的權益，再除以普通股流通股數。而特別股股東的權益主張，應以收回價格（清算或贖回時特別股股東實際能拿到的金額）、而非單純的面額來計算，這是本題最容易算錯的地方。\n\n第一步：計算股東權益總額\n\n- 特別股股本（面額）＝ $100 × 1,000股 ＝ $100,000\n- 減：特別股折價 $3,000（折價屬權益減項，因為公司當初是折價發行，實際收到的資金比面額少）\n- 特別股淨額 ＝ $100,000 － $3,000 ＝ $97,000\n- 普通股股本 ＝ $40 × 8,000股（已發行股數）＝ $320,000\n- 普通股溢價 ＝ $68,000\n- 累積盈餘 ＝ $30,000\n\n股東權益總額 ＝ $97,000 ＋ $320,000 ＋ $68,000 ＋ $30,000 ＝ $515,000\n\n第二步：計算特別股股東應得之權益（以收回價格計算） 因為特別股是「累積特別股」且題目給定「收回價格$110」，計算特別股股東應優先分配到的權益金額時，應以收回價格 × 股數，再加上積欠股利（累積特別股尚未發放的股利，優先於普通股分配）：\n\n特別股權益 ＝（$110 × 1,000股）＋ $7,000（積欠股利） ＝ $110,000 ＋ $7,000 ＝ $117,000\n\n（注意：這裡計算特別股股東的權益主張時，用的是「收回價格」這個實質贖回條件，而不是先前計算股東權益總額時用的「折價後淨額$97,000」——折價只影響公司帳上記錄的資金流入金額，不影響特別股股東實際依約定收回價格可主張的權益。）\n\n第三步：計算普通股股東可分配之權益 普通股權益總額 ＝ 股東權益總額 － 特別股權益 ＝ $515,000 － $117,000 ＝ $398,000\n\n第四步：計算普通股每股帳面金額 普通股每股帳面金額 ＝ 普通股權益總額 ÷ 已發行股數 ＝ $398,000 ÷ 8,000股 ＝ $49.75\n\n所以正確答案是(B) $49.75。這題的解題關鍵在於：算「股東權益總額」時用折價後的淨額，但算「特別股股東應得的權益主張」時要改用收回價格（而非面額或折價後淨額），兩個階段用的基礎不同，很容易搞混而算錯，這也是圖片中你附的解析一開始算出$38、後來才修正回$49.75的原因所在。"}, {"id": "d6a93ee20e57", "head": "下列幾項屬投資性不動產？甲、目前尚未決定未來用途所持有之土地；乙、供員工使用之建築物；丙、以融資租賃出租予另一企業之廠房；丁、以營業租賃出租予另一企業之建築物，且對租用該建築物之承租人提供清潔服務，該服務相較租賃合約不具重大性", "opts": [["A", "四項"], ["B", "一項"], ["C", "三項"], ["D", "二項\n\n答案為 (D) 二項，屬於投資性不動產的是甲、丁。"]], "ans": "D", "tag": "租賃會計", "srcTxt": "115年第1次 財務分析筆記　第1題", "ex": "這題考的是國際會計準則第40號（IAS 40）「投資性不動產」的認列範圍，核心判斷標準在於：這項不動產的持有目的，究竟是為了賺取租金或資本增值（投資性不動產），還是為了自用於生產、提供勞務、行政管理，或以正常營業過程中出售（一般不動產、廠房及設備，或存貨）。逐項檢視：\n\n甲、目前尚未決定未來用途所持有之土地——屬於投資性不動產。 依IAS 40規定，企業若持有土地但尚未決定要作自用（例如蓋廠房自用）或短期內於正常營業過程中出售，此時因為缺乏明確的自用意圖，該土地會被視為是為了資本增值目的而持有，故應分類為投資性不動產。這是實務上很容易忽略的一點——「不確定用途」本身在準則下反而被推定為投資性質，而非默認為自用。\n\n乙、供員工使用之建築物——不屬於投資性不動產。 這類建築物是供企業自身員工使用（例如員工宿舍、辦公場所），本質上是為了支援企業自身的營運與生產活動，屬於「自用不動產」，應依IAS 16「不動產、廠房及設備」認列，而非投資性不動產，因為它不是為了賺取租金或資本增值而持有。\n\n丙、以融資租賃出租予另一企業之廠房——不屬於投資性不動產。 這是本題最容易誤判的選項。「融資租賃（finance lease）」在會計實質上被視為等同於「出售」該資產——因為融資租賃已將資產所有權之下幾乎所有風險與報酬移轉給承租人，所以出租人（企業本身）在會計處理上必須將該廠房除列（終止認列），改認列一筆應收租賃款（類似應收帳款／應收票據性質的金融資產），廠房本身已經不再留在出租人的資產負債表上，自然也就無從被分類為投資性不動產。\n\n丁、以營業租賃出租予另一企業之建築物，且提供之清潔服務相較租賃合約不具重大性——屬於投資性不動產。 這正是投資性不動產最典型的樣態：企業把建築物用「營業租賃（operating lease）」的方式出租給別人賺取租金，資產本身仍留在出租人帳上。雖然出租人有附帶提供清潔服務，但IAS 40明確規定，只要這類附屬服務相較於整體租賃安排不具重大性（也就是承租人享有的主要利益仍然是「使用該不動產」本身，而非「接受出租人提供的服務」），該不動產仍應分類為投資性不動產；反之，如果服務占比重大（例如提供旅館式的全套服務），則應改分類為自用不動產（視為企業自行提供服務的一環）。\n\n所以甲、丁共2項符合投資性不動產的定義，答案為(D)。"}, {"id": "8b20ea61796b", "head": "在 IFRS 9 實施之後，公司的資產負債表中不會出現：", "opts": [["A", "以成本衡量之金融資產"], ["B", "透過其他綜合損益按公允價值衡量之金融資產"], ["C", "透過損益按公允價值衡量之金融資產"], ["D", "按攤銷後成本衡量之金融資產\n\n答案為 (A) 以成本衡量之金融資產。"]], "ans": "A", "tag": "會計原則、IFRS 與財報品質", "srcTxt": "115年第1次 財務分析筆記　第2題", "ex": "這題考的是 IFRS 9「金融工具」取代舊準則 IAS 39 之後，金融資產分類方式的重大變革。IFRS 9 將金融資產的衡量分類簡化為三大類：\n\n1. 按攤銷後成本衡量（Amortized Cost）：適用於「以收取合約現金流量為目的」且合約現金流\n2. 量僅為本金與利息（SPPI測試）的債務工具，例如企業持有至到期的公司債。\n3. 透過其他綜合損益按公允價值衡量（FVOCI）：適用於「兼具收取合約現金流量及出售」雙重目的之債務工具，或企業選擇性指定的權益工具（例如不打算短期交易的策略性投資股票）。\n4. 透過損益按公允價值衡量（FVTPL）：其餘不符合上述兩類條件的金融資產，一律歸入此類，公允價值變動直接計入當期損益。\n\n舊準則 IAS 39 底下原本還有一個「成本衡量」的例外分類——主要用於「沒有活絡市場報價、公允價值無法可靠衡量的權益工具」（例如未上市公司股票），這類資產在IAS 39下允許以成本衡量並揭露減損。但 IFRS 9 全面取消了這項「以成本衡量」的分類，改為要求所有權益工具都必須按公允價值衡量（歸入FVTPL，或若企業選擇不可撤銷指定，則歸入FVOCI），即使是未上市股票也必須設法估計公允價值（例如透過評價模型），不再允許直接以歷史成本作為資產負債表上的衡量基礎。這項修改的用意在於提升財務報表的攸關性，避免權益工具因為沒有活絡市場報價就長期以成本掛帳、不反映其真實經濟價值的變動。\n\n所以(B)(C)(D)都是IFRS 9下實際存在的三大衡量分類，會出現在資產負債表上；只有(A)「以成本衡量之金融資產」是IAS 39時代已被廢除的舊分類方式，在IFRS 9實施之後不會再出現，答案為(A)。"}, {"id": "4deb64790274", "head": "下列敘述何者為正確？", "opts": [["A", "內部報酬率法在分析時並未考慮貨幣的時間價值"], ["B", "對淨現值法而言，分析並確定各期的現金流量是很重要的"], ["C", "內部報酬率法和淨現值法一樣著重於淨利而非現金流量"], ["D", "淨現值法著重於淨利而非現金流量\n\n答案為 (B) 對淨現值法而言，分析並確定各期的現金流量是很重要的。"]], "ans": "B", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "115年第1次 財務分析筆記　第3題", "ex": "這題考的是資本預算（Capital Budgeting）中兩大核心評估方法——淨現值法（NPV）與內部報酬率法（IRR）——的基本性質，考生常見的誤解都集中在這兩個方法「是否考慮貨幣時間價值」與「衡量基礎是現金流量還是會計淨利」這兩個關鍵點上：\n\n(B) 正確。淨現值法的計算邏輯，就是把投資案未來每一期預期產生的現金流量，按照資金成本（折現率）折算成現值後加總，再減去期初投入成本。因此整個NPV分析的準確性，完全取決於能否正確估計並確定各期的現金流量——如果現金流量估計錯誤或不完整，折現算得再精確，得出的NPV結果也會失真。這正是為什麼財務分析師在做投資評估時，花費最多心力的往往不是折現率的選取，而是逐期現金流量（營運現金流入、資本支出、營運資金變動等）的合理預估。\n\n(A) 錯誤。內部報酬率法本質上和淨現值法一樣，都屬於「折現現金流量法（DCF）」的一種，IRR的定義就是「使淨現值等於零的折現率」，計算過程中同樣要對各期現金流量進行折現，因此IRR當然有考慮貨幣的時間價值，這跟「還本期間法（Payback Period）」這種不考慮時間價值的傳統方法是不同的，考生容易把兩者搞混。\n\n(C)(D) 都錯誤。無論是IRR或NPV，衡量的基礎都是現金流量，而不是會計上的淨利（淨收益）。這是因為淨利會受到應計基礎會計處理（例如折舊、應收應付款項認列時點）的影響，並不能真實反映企業實際收到或付出的現金時點與金額，而資本預算決策關心的是這筆投資「真正能為企業帶來多少現金」，所以無論NPV或IRR，分析的對象都是現金流量而非淨利，(C)(D)兩項描述都與事實相反"}, {"id": "9aa9e8de2308", "head": "甲公司於 X8年9月30日以$300,000購入乙公司普通股作為透過其他綜合損益按公允價值衡量之股票投資，X8年底該投資之公允價值為$360,000。X9年10月1日甲公司以$200,000出售半數的乙公司普通股，X9年末未出售之乙公司普通股之公允價值為$230,000，則該股票投資對甲公司X9年度稅前其他綜合利益之影響為：", "opts": [["A", "增加$20,000"], ["B", "增加$50,000"], ["C", "減少$130,000"], ["D", "增加$70,000\n\n答案為 (D) 增加$70,000。"]], "ans": "D", "tag": "外幣換算與金融工具", "srcTxt": "115年第1次 財務分析筆記　第4題", "ex": "這題考的是 IFRS 9 下「指定透過其他綜合損益按公允價值衡量之權益工具（FVOCI equity investment，不可回收選擇權）」的會計處理，核心觀念是：這類投資的公允價值變動全部認列在其他綜合損益（OCI），即使處分時也不會將累積利益／損失回轉（recycle）到損益表，只會在權益項目間轉列（例如轉入保留盈餘），完全不影響損益，但仍然會影響「其他綜合利益」這個項目本身的變動。\n\n計算步驟拆解如下：\n\n第一步：X9年初持股帳面金額 承接X8年底公允價值 $360,000（100%持股，此為X8年度已認列之OCI基礎，不影響X9年度）。\n\n第二步：出售前先按公允價值重新衡量（X9/10/1當天） 甲公司以 $200,000 賣出「半數」股份，代表當天每股（或該半數部位）的公允價值就是 $200,000，換算回全部持股的公允價值應為 $200,000 × 2 = $400,000。 因此在處分交易發生之前，必須先將全部持股帳面金額從 $360,000 重新衡量至 $400,000： 　公允價值變動 ＝ $400,000 － $360,000 ＝ 增加 $40,000（計入X9年度OCI）\n\n第三步：處分半數股份 處分時帳面金額已等於公允價值（$400,000的一半＝$200,000＝實際出售價格），故處分沒有任何損益（也不會有損益表上的處分利得或損失），僅將對應部分之累積OCI餘額轉出至保留盈餘（此轉列不影響「當年度」OCI增減金額的計算，只影響OCI累積餘額的歸屬項目）。\n\n第四步：X9年底剩餘半數股份再次按公允價值衡量 處分後剩餘半數的帳面金額為 $400,000 ÷ 2 ＝ $200,000，年底公允價值為 $230,000： 　公允價值變動 ＝ $230,000 － $200,000 ＝ 增加 $30,000（計入X9年度OCI）\n\n加總X9年度稅前其他綜合利益影響： $40,000（出售前重評價）＋ $30,000（年底剩餘部位重評價）＝ 增加 $70,000\n\n因此正確答案為(D)。這題的解題關鍵在於：處分時要先「按公允價值重新衡量全部持股」再認列處分，而且FVOCI權益工具的處分完全不影響損益，只會反映在OCI的變動金額上，這也是選項(C)「減少$130,000」這類干擾選項容易讓人誤算成「出售價格與原始成本或期初公允價值的差額當作損失」的常見錯誤。"}, {"id": "af412826405e", "head": "存出保證金之性質為：", "opts": [["A", "費用"], ["B", "資產"], ["C", "負債"], ["D", "收入\n\n答案為 (B) 資產。"]], "ans": "B", "tag": "其他", "srcTxt": "115年第1次 財務分析筆記　第5題", "ex": "「存出保證金」是企業支付給外部第三方的一筆押金或擔保金，常見情境包括租屋押金、租賃保證金、履約保證金、水電瓦斯押金等。從企業的角度來看，這筆錢雖然暫時交付出去、無法自由運用，但它並非真正的花費（費用），而是企業對外享有的一項未來可以收回的請求權——只要契約到期、合約條件達成，或雙方終止租賃關係，這筆保證金就能拿回來。\n\n依照資產的定義（企業因過去交易事項而控制、預期未來能為企業帶來經濟效益的資源），存出保證金完全符合這個條件：企業因為簽約而「控制」了向對方請求返還這筆款項的權利，未來能收回現金，屬於企業的一項經濟資源，因此在會計上應列為資產（通常視提領時點遠近，分類為流動資產或其他資產／非流動資產）。\n\n其他選項的判斷邏輯：\n\n(A) 費用——錯誤。費用指的是企業因日常營運活動而發生、且不會再收回的資源流出（例如租金支出、水電費），重點在於「用了就沒了」。但存出保證金的特性恰恰相反——它是「先付出去，之後還能拿回來」的款項，並非真正消耗掉的成本，所以不能列為費用。\n\n(C) 負債——錯誤。負債指的是企業對外所負擔、未來必須履行清償義務的款項（例如應付帳款、存入保證金〔注意是「存入」不是「存出」〕）。「存出保證金」是企業「付出去」的錢，享有的是「將來可以要回來」的權利，性質上剛好與「負債」相反；容易讓人混淆的是，如果站在收取保證金的另一方（例如出租人收到房客的押金），對他們而言那才是「存入保證金」，屬於負債，因為他們未來有義務把這筆錢還給房客。\n\n(D) 收入——錯誤。收入指的是企業因銷售商品或提供勞務而賺取、會增加企業權益的經濟效益流入，存出保證金既不是企業的營業所得，也不會讓企業的權益因此增加，純粹只是資金型態的轉換（現金換成一項應收回的權利），所以不屬於收入。"}, {"id": "40e08126b10b", "head": "某公司帳上期初存貨$150,000，期末盤點時剩下$100,000，已知本期淨進貨共$100,000，進貨折扣共$1,000，進貨運費共$2,000，銷貨運費共$3,000，銷貨收入共$300,000，請問該公司本期的銷貨成本應為多少？", "opts": [["A", "$210,000"], ["B", "$120,000"], ["C", "$151,000"], ["D", "$90,000\n\n答案為 (C) $151,000。"]], "ans": "C", "tag": "損益表項目與收入認列", "srcTxt": "115年第1次 財務分析筆記　第6題", "ex": "這題考的是銷貨成本（Cost of Goods Sold )的基本計算公式，關鍵在於分辨哪些項目屬於「存貨成本的一部分」，哪些項目只是「銷售費用」或「損益表上的收入項目」、根本不該計入銷貨成本的計算。\n\n第一步：計算進貨成本（本期進貨的實際成本） 進貨成本的計算邏輯是：淨進貨金額，加上為了把商品運進來所發生的運費（進貨運費，屬於使存貨達到可供出售狀態所必要的成本，依會計原則應計入存貨成本），再減去因進貨而取得的折扣（進貨折扣屬於成本的減項，因為它降低了公司實際取得存貨的代價）：\n\n進貨成本 ＝ 淨進貨 $100,000 － 進貨折扣 $1,000 ＋ 進貨運費 $2,000 ＝ $101,000\n\n第二步：計算銷貨成本 銷貨成本的公式是「期初存貨＋本期進貨成本－期末存貨」，也就是「本期可供銷售商品總成本」扣掉「還沒賣掉、留在倉庫裡的期末存貨」，剩下的就是「這一期真正賣出去的商品所耗用的成本」：\n\n銷貨成本 ＝ 期初存貨 $150,000 ＋ 進貨成本 $101,000 － 期末存貨 $100,000 ＝ $151,000\n\n關鍵陷阱：銷貨運費與銷貨收入都不計入銷貨成本 題目故意放入「銷貨運費$3,000」和「銷貨收入$300,000」這兩個數字來誘導計算錯誤：\n\n- 銷貨運費是公司把商品「賣出去、送到客戶手上」所發生的費用，性質上屬於銷售費用（營業費用），是為了完成銷售這個動作而發生的成本，而不是「取得或製造存貨」本身的成本，所以不應計入銷貨成本，而是單獨列在損益表的營業費用項下。\n- 銷貨收入則完全是損益表上「賺了多少錢」的概念，跟「這些賣出去的商品成本是多少」是兩件完全不同的事，銷貨收入減掉銷貨成本才會得出毛利，但銷貨收入本身不會直接參與銷貨成本的計算公式。\n\n所以若考生誤把進貨折扣或進貨運費的加減方向搞反，或誤把銷貨運費、銷貨收入也算進銷貨成本公式，就容易得出(A)(B)(D)這些錯誤答案，"}, {"id": "8f1c9ac4c5a1", "head": "根據 IFRS 3，廉價購買利益應如何處理？", "opts": [["A", "計入其他綜合損益"], ["B", "計入資本公積"], ["C", "認列為當期損益"], ["D", "作為商譽的一部分\n\n答案為 (C) 認列為當期損益。"]], "ans": "C", "tag": "無形資產與減損", "srcTxt": "115年第1次 財務分析筆記　第7題", "ex": "這題考的是 IFRS 3「企業合併」中關於「廉價購買利益（Bargain Purchase Gain）」的會計處理。廉價購買發生在企業併購時，買方取得被併購方可辨認淨資產公允價值，反而高於買方所支付的收購對價（即「超額」的情況，跟一般常見「商譽」正好相反——商譽是收購對價大於可辨認淨資產公允價值的部分）。\n\n依照 IFRS 3 規定，一旦企業合併確認出現這種「負商譽」的情況，收購方必須先重新檢視、覆核整個評價過程，包括：可辨認資產及負債的辨認是否完整、公允價值衡量是否正確、收購對價的衡量是否正確等，確保這個廉價購買的結果不是因為評價疏漏或錯誤所導致的假象。經過覆核確認這個利益確實存在之後，應立即將該廉價購買利益全數認列為收購當期的損益（利得），直接反映在損益表上，不能像商譽一樣資本化掛在資產負債表上、也不能遞延分期認列。\n\n之所以要求「立即認列為當期損益」而非其他處理方式，原因在於：\n\n(A) 計入其他綜合損益——錯誤。其他綜合損益（OCI）通常用於處理某些特定性質、暫時不宜計入損益表的價值變動（例如某些金融資產的公允價值變動、確定福利計畫的精算損益等），但廉價購買利益屬於企業合併這項「已完成交易」所產生的確定性利得，性質上就是一筆已實現的合併利得，應直接反映在當期損益，而非遞延或隔離在OCI。\n\n(B) 計入資本公積——錯誤。資本公積通常用於處理與股東股權交易有關的溢價項目（例如股票發行溢價），廉價購買利益是企業合併交易產生的經濟利得，與股東出資行為無關，不應計入資本公積這種權益項目。\n\n(D) 作為商譽的一部分——錯誤。這是最容易讓人直覺誤選的選項，因為一般人會把「商譽」和「企業合併的價差」聯想在一起。但商譽的定義本身就是「收購對價超過可辨認淨資產公允價值」的部分；廉價購買剛好是相反的情況（收購對價低於可辨認淨資產公允價值），根本不會產生商譽這項資產，兩者在會計邏輯上是互斥的概念，不能把廉價購買利益反過來當作商譽處理。"}, {"id": "fc2d35de2b47", "head": "乙公司將其製造的寄銷商品運至經銷商店甲公司，因而付出的運費，理論上應列為：", "opts": [["A", "乙公司的費用"], ["B", "甲公司的費用"], ["C", "乙公司存貨成本"], ["D", "甲公司存貨成本"]], "ans": "C", "tag": "其他", "srcTxt": "115年第1次 財務分析筆記　第8題", "ex": "本題屬於「寄銷（Consignment）」交易下存貨成本歸屬之定義型論證，關鍵在於掌握寄銷商品之所有權歸屬，以及運費此類「使存貨達到可銷售狀態所必要之支出」應如何資本化認列。\n\n寄銷交易之本質，係委託人（乙公司，即寄銷商品之製造商）將商品運交受託人（甲公司，即經銷商店）代為銷售，惟在該商品實際出售予最終消費者之前，該商品之所有權（法律上之控制權與風險）仍歸屬於委託人乙公司，甲公司僅立於代銷之地位，並未取得商品之所有權，故該商品於甲公司處，理論上仍屬乙公司之存貨，而非甲公司之存貨。\n\n依存貨成本認列原則，凡使存貨達到「目前之地點及狀態」所發生之必要支出（例如購入成本、加工成本，以及將存貨運送至可銷售地點所生之運費），均應資本化計入存貨成本，而非於發生當期直接列為費用。本題中，乙公司將寄銷商品運至甲公司店面之運費，其目的正是使該批商品到達可供銷售之地點狀態，且該商品所有權始終歸屬乙公司，故此項運費應由乙公司負擔，並資本化列入乙公司之「寄銷商品（存貨）成本」，而非於當期直接認列為乙公司之費用，亦與甲公司完全無關。\n\n其餘選項之辨析： (A) 乙公司的費用：此敘述錯誤。該運費係為使寄銷商品達到可銷售狀態所發生之必要支出，依存貨成本認列原則應予資本化計入存貨成本，而非於發生當期直接列為費用，此與一般管銷費用（如廣告費、業務人員薪資等與存貨無直接歸屬關係之支出）之處理方式不同。 (B) 甲公司的費用：此敘述錯誤。甲公司僅為代銷角色，並未取得寄銷商品之所有權，該筆運費之支付與甲公司之損益無關，不應由甲公司認列為費用。 (D) 甲公司存貨成本：此敘述錯誤。由於寄銷商品之所有權在出售予最終消費者前，仍屬乙公司所有，該商品根本不構成甲公司資產負債表上之存貨項目，故此運費自無列入甲公司存貨成本之理。"}, {"id": "061dbec387d3", "head": "「公允價值層級」中的第三等級是指利用何者？", "opts": [["A", "市場報價的價格"], ["B", "市場參考價格的調整值"], ["C", "無法觀察到的輸入值"], ["D", "最近成交的市場價值"]], "ans": "C", "tag": "外幣換算與金融工具", "srcTxt": "115年第1次 財務分析筆記　第9題", "ex": "依國際財務報導準則第13號「公允價值衡量」之規定，公允價值層級（Fair Value Hierarchy）將衡量公允價值所使用之「輸入值（inputs）」，依其可觀察程度區分為三個等級，等級愈高表示輸入值愈缺乏可觀察性、愈依賴企業自身之判斷與估計：\n\n第1等級（Level 1）：係指相同資產或負債，在衡量日於「活絡市場」中之「未經調整報價」，此類輸入值直接來自市場交易，可觀察性最高，最為客觀可靠，例如上市股票之收盤價。\n\n第2等級（Level 2）：係指除第1等級所包含之市場報價外，對於資產或負債可直接或間接觀察到之其他輸入值，例如類似資產於活絡市場之報價、相同或類似資產於非活絡市場之報價，或依可觀察市場資料調整而得之市場參考價格等，此類輸入值雖非直接的市場報價，但仍具備一定程度之可觀察性，通常須經一定調整方能適用於待衡量之標的。\n\n第3等級（Level 3）：係指「無法觀察到之輸入值」，亦即市場上並無可直接取得、可供參考之客觀交易資料，企業必須依自身所擁有之最佳資訊，運用假設、估計或評價模型（如現金流量折現模型）自行推估該等輸入值，以決定資產或負債之公允價值。由於此類輸入值缺乏外部市場之客觀佐證，可觀察性最低，故其公允價值衡量結果之不確定性亦最高。\n\n其餘選項之辨析： (A) 市場報價的價格：屬於第1等級之定義，係直接來自活絡市場之可觀察報價，而非第3等級所指之無法觀察輸入值。 (B) 市場參考價格的調整值：通常歸屬於第2等級之定義，雖非直接之市場報價，惟仍是基於可觀察之市場資料調整而得，具備間接可觀察性，與第3等級「完全無法觀察」之性質不同。 (D) 最近成交的市場價值：此類資訊若來自活絡市場之實際成交，性質上仍屬於可直接觀察之市場資料，較接近第1等級（或視情況為第2等級）之範疇，而非第3等級所強調之「無法觀察」特性。"}, {"id": "9f8d69a09f9f", "head": "甲公司發行每股面額$10之普通股100,000股取得乙公司全部股份，乙公司的可辨認淨資產公允價值為$1,165,000，發行新股所發生的成本為$11,000，甲公司普通股每股之公允價值為$13.6。應如何計算合併交易中的商譽？", "opts": [["A", "$195,000"], ["B", "$210,000"], ["C", "$200,000"], ["D", "$220,000"]], "ans": "A", "tag": "無形資產與減損", "srcTxt": "115年第1次 財務分析筆記　第10題", "ex": "本題涉及企業合併（Business Combination）中商譽（Goodwill）之計算，其核心公式為：\n\n商譽 ＝ 移轉對價（購買價格） － 可辨認淨資產之公允價值\n\n計算移轉對價之關鍵，在於正確判斷「以發行股份作為對價」時，應以「發行股份之公允價值」衡量，而非以股票之面額衡量；同時，須特別注意「發行股份所發生之相關成本」（如印刷費、律師費等股票發行成本）並不屬於合併取得成本之一部分，依會計原則應作為權益（股本溢價／資本公積）之減項處理，而不應計入商譽之計算。\n\n第一步，計算發行股份之公允價值（即移轉對價）： 發行股份公允價值 ＝ 發行股數 × 每股公允價值 　　　　　　　　＝ 100,000股 × $13.6 　　　　　　　　＝ $1,360,000\n\n第二步，計算商譽： 商譽 ＝ 移轉對價 － 可辨認淨資產公允價值 　　＝ $1,360,000 － $1,165,000 　　＝ $195,000\n\n需特別留意，題目所給之發行新股成本$11,000，屬於股票發行之相關成本，應直接沖抵股本溢價（作為權益減項），並不計入合併交易之取得成本，亦不影響商譽之計算，此為本題主要之判斷陷阱所在。\n\n其餘選項之常見誤算： (B) $210,000：可能誤將股票發行成本$11,000錯誤地併入合併取得成本計算商譽，混淆了「合併交易成本」與「股票發行成本」兩者應有之不同會計處理方式。 (C) $200,000：可能係計算過程中數字誤用或運算誤差所致之錯誤結果。 (D) $220,000：屬於計算過程中之錯誤結果，可能源於每股公允價值、股數或可辨認淨資產金額代入錯誤。"}, {"id": "3526adb3c2ae", "head": "乙公司的借款利率為7.5%，總資產報酬率為6.5%，所得稅率為20%。若乙公司以此條件舉債投資新計畫，將使得權益報酬率如何變動？", "opts": [["A", "不一定"], ["B", "降低"], ["C", "不變"], ["D", "增加"]], "ans": "D", "tag": "獲利能力比率（毛利率／ROA／ROE）", "srcTxt": "115年第1次 財務分析筆記　第11題", "ex": "本題涉及財務槓桿（Financial Leverage）對權益報酬率（ROE）之影響判斷，關鍵在於比較「總資產報酬率（ROA）」與「稅後借款利率」兩者之高低，以決定舉債融資究竟對股東報酬產生正向或負向的槓桿效果。其判斷邏輯源自：\n\nROE ＝ ROA ＋ (ROA － 稅後借款利率) × (D／E)\n\n由此可知，當ROA大於稅後借款利率時，舉債所賺取之資產報酬，扣除支付予債權人之稅後利息成本後仍有剩餘，此剩餘部分將進一步放大並歸屬於股東，使ROE隨負債比率提高而增加；反之，若ROA小於稅後借款利率，舉債反而會侵蝕股東報酬，使ROE降低。\n\n第一步，計算稅後借款利率（因利息費用具有節稅效果，企業實際負擔之借款成本應以稅後基礎衡量）： 稅後借款利率 ＝ 借款利率 × (1 － 所得稅率) 　　　　　　＝ 7.5% × (1 － 20%) 　　　　　　＝ 7.5% × 80% 　　　　　　＝ 6.0%\n\n第二步，比較總資產報酬率與稅後借款利率： 總資產報酬率（ROA）＝ 6.5% 稅後借款利率 ＝ 6.0%\n\n由於ROA（6.5%）大於稅後借款利率（6.0%），表示乙公司運用該筆借款投資新計畫所賺取之稅前資產報酬，扣除實際稅後利息成本後仍有正差額（6.5% － 6.0% ＝ 0.5%），此項正向差額將透過財務槓桿放大歸屬於股東，使權益報酬率隨舉債而提高。\n\n其餘選項之辨析： (A) 不一定：此敘述不正確。題目已明確給定借款利率、總資產報酬率及所得稅率三項數據，可據以確定比較結果（ROA大於稅後借款利率），並非無法判斷之情形。 (B) 降低：此結論僅在ROA小於稅後借款利率時才會成立，與本題ROA（6.5%）大於稅後借款利率（6.0%）之條件相反，故不適用。 (C) 不變：此結論僅在ROA恰好等於稅後借款利率時才會成立，本題兩者並不相等，故不適用。"}, {"id": "a9105d94d7f6", "head": "根據國際財務報導準則(IFRS)，下列何者屬於「不可辨認無形資產」？", "opts": [["A", "客戶關係"], ["B", "軟體"], ["C", "專利權"], ["D", "商譽"]], "ans": "D", "tag": "無形資產與減損", "srcTxt": "115年第1次 財務分析筆記　第12題", "ex": "依IFRS對無形資產之規範（IAS 38「無形資產」），無形資產須先判斷是否符合「可辨認性（Identifiability）」之要件，才能決定其應歸類為「可辨認無形資產」或「不可辨認無形資產」。所謂「可辨認」，須符合下列其中一項條件： 一、可分離性：該項資產能與企業分離，並可個別或連同相關合約、資產、負債出售、移轉、授權、租賃或交換；或 二、源自合約或其他法定權利：不論該等權利是否可與企業或其他權利義務分離、移轉或個別出售。\n\n商譽（Goodwill）之本質，係企業合併時所支付之對價，超過所取得可辨認淨資產公允價值之部分，其代表的是企業整體綜效（如既有客戶基礎的綜合價值、員工團隊之綜效、規模經濟等難以個別衡量的價值），無法單獨與企業分離出售，亦非源自可單獨辨認之合約或法律權利，故商譽不符合「可辨認性」之要件，依IFRS規定屬於「不可辨認無形資產」，其會計處理亦與一般可辨認無形資產不同（商譽不予攤銷，僅須定期進行減損測試）。\n\n其餘選項之辨析： (B) 軟體：企業取得或自行發展之軟體，通常可單獨辨認並可個別出售、授權或移轉，符合可分離性要件，屬於可辨認無形資產。 (C) 專利權：專利權係源自法律賦予之專屬權利，具有明確之法律權利基礎，可單獨辨認、亦可個別移轉或授權他人使用，屬於可辨認無形資產。 (A) 客戶關係：客戶關係雖非實體資產，惟其通常可依附於合約基礎（如既有服務合約、訂閱關係），或依可觀察之市場資料估計其個別價值，並可與其他資產分離認定（例如於企業合併中，可單獨評估客戶關係之公允價值），故亦符合可辨認性要件，屬於可辨認無形資產，而非不可辨認無形資產。"}], "法規": [{"id": "123033bc6fab", "head": "有關集保結算所提供基金市場相關服務，下列何者為非：", "opts": [["A", "境內及境外基金之無實體登錄"], ["B", "基金交易平台"], ["C", "境外基金與期信基金申報公告服務"], ["D", "基金受益人會議電子投票服務"]], "ans": "A", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "112年第3次 法規筆記　第1題", "ex": "集保結算所（台灣集中保管結算所）目前實際辦理之基金無實體登錄及帳簿劃撥業務，僅限於「境內基金」（即國內證券投資信託事業所發行之基金受益憑證），使投資人得以無實體方式持有、買賣及交割境內基金受益憑證；至於「境外基金」，其發行、保管及過戶事宜係由境外基金機構或其在台之總代理、保管機構辦理，並非透過集保結算所之無實體登錄機制處理。因此「境內『及』境外基金之無實體登錄」此一敘述，將境外基金也涵蓋在集保結算所辦理無實體登錄之範圍內，與實際業務範圍不符，為錯誤敘述，即本題所求之「非」。\n\n至於其餘選項，均屬集保結算所實際承辦之基金相關服務： (B) 集保結算所與相關單位合作建置基金銷售資訊及交易平台（如基富通等機制之後台支援），屬其辦理之基金市場服務之一。 (C) 境外基金及期貨信託基金之申報、公告事宜（如透過基智網平台），屬集保結算所實際辦理之業務。 (D) 基金受益人會議電子投票服務，亦為集保結算所提供之服務項目。"}, {"id": "dc453ea15c89", "head": "曾因證券交易違背契約未結案，或因偽造上市有價證券案件經法院諭知有罪判決確定，須滿幾年始得再行開戶買賣上市證券？", "opts": [["A", "二年"], ["B", "三年"], ["C", "五年"], ["D", "七年"]], "ans": "C", "tag": "證券商業務行為規範與自律規範", "srcTxt": "112年第3次 法規筆記　第2題", "ex": "依證券交易所受託契約準則及證券商受託買賣有價證券內部作業程序等相關規定，投資人如曾因證券交易違背契約（如違約交割）尚未了結，或因偽造、變造上市有價證券案件經法院諭知有罪判決確定者，屬於證券商應拒絕或限制其開戶之消極資格事由，須自事實了結或判決確定之日起滿五年後，始得重新辦理開戶並買賣上市證券，以維護證券市場交易秩序與信用。\n\n逐項檢視： (A) 二年：期間過短，未達法定限制年限，錯誤。 (B) 三年：同樣未達法定五年之限制期間，錯誤。 (C) 五年：與規定之限制期間相符，正確。 (D) 七年：超過法定所需之五年期間，非正確答案。"}, {"id": "fc4b9b9d3659", "head": "股票已在證券交易所上市或在證券商營業處所買賣之公司自辦股務事務者或代辦股務機構，多久時間接受集保結算所之股務單位股務作業評鑑？", "opts": [["A", "每年"], ["B", "每兩年"], ["C", "每三年"], ["D", "每六個月"]], "ans": "C", "tag": "交割結算、違約處理與集中保管", "srcTxt": "112年第3次 法規筆記　第3題", "ex": "依股務單位內部控制制度標準規範及集保結算所相關評鑑作業規定，股票已在證券交易所上市或於證券商營業處所買賣之公司，其自辦股務事務者或委託之代辦股務機構，應每三年接受集保結算所（台灣集中保管結算所）辦理之股務單位股務作業評鑑一次，藉以定期檢核股務作業品質、內部控制及法令遵循情形，以保障股東權益及股務作業之正確性。\n\n逐項檢視： (A) 每年：評鑑週期過短，與規定之三年一次不符，錯誤。 (B) 每兩年：同樣未達規定之三年週期，錯誤。 (C) 每三年：與規定之評鑑週期相符，正確。 (D) 每六個月：週期過於頻繁，與實際規定不符，錯誤。"}, {"id": "72c57f02766a", "head": "上櫃公司買回公司股票達多少數量或金額以上，應將買回之日期、數量、種類及價格公告？", "opts": [["A", "累積達公司已發行股份總數百分之二"], ["B", "每次金額達新臺幣一億元以上"], ["C", "每次金額達新臺幣五億元以上"], ["D", "累積達公司在外流通股數達百分之三"]], "ans": "A", "tag": "公司法：股份、資本與公司債", "srcTxt": "112年第3次 法規筆記　第4題", "ex": "依證券交易法第28條之2及財團法人中華民國證券櫃檯買賣中心相關作業辦法規定，上市（櫃）公司買回本公司股份，其累積買回股數達公司已發行股份總數百分之二，或買回金額達新臺幣五億元以上者，應於事實發生之即日起算二日內，將買回股份之日期、數量、種類及價格予以公告，以即時揭露重大買回資訊，保障投資人知的權利並維護市場交易之公平與透明。\n\n逐項檢視： (A) 「累積達公司已發行股份總數百分之二」為法定公告門檻之一，敘述正確。 (B) 金額門檻應為新臺幣「五億元」而非「一億元」，與規定不符，錯誤。 (C) 金額門檻雖為「五億元」，但此選項僅單獨列出金額標準，未如(A)完整對應題目所詢及圖示標註之正確項目；本題所標示之正確答案聚焦於股數比例門檻。 (D) 比例基準應為「已發行股份總數」而非「在外流通股數」，且百分比亦非「百分之三」，與規定不符，錯誤。"}, {"id": "6995a2d05341", "head": "控制公司使從屬公司以不合營業常規之方式經營，致從屬公司遭受損害，從屬公司之債權人應如何請求控制公司賠償從屬公司之損失？", "opts": [["A", "請求對自己負損害賠償"], ["B", "以自己之名義請求"], ["C", "向檢察官提出告訴"], ["D", "選項(A)(B)(C)皆可"]], "ans": "B", "tag": "財報不實與民刑事責任、罰則", "srcTxt": "112年第3次 法規筆記　第5題", "ex": "依公司法第369條之4及第369條之5規定，控制公司直接或間接使從屬公司為不合營業常規或其他不利益之經營，且未於會計年度終了時為適當補償，致從屬公司受有損害者，控制公司應負賠償責任。若從屬公司未於會計年度終了後一定期間內向控制公司請求賠償或未提起訴訟時，從屬公司之債權人，或繼續一年以上持有從屬公司已發行股份總數或資本總額百分之一以上之股東，得以「自己之名義」，請求控制公司對從屬公司為給付，而非以從屬公司之名義或代位方式為之。此設計是為了在控制公司怠於行使權利時，賦予從屬公司之債權人及少數股東獨立之訴訟實施權，以保障從屬公司及其債權人之權益。\n\n逐項檢視： (A) 「請求對自己負損害賠償」混淆了賠償對象，法律規定之給付對象應為從屬公司，而非債權人自己受償，錯誤。 (B) 「以自己之名義請求」，與公司法第369條之4、第369條之5所賦予債權人之獨立請求權性質相符，正確。 (C) 此屬控制公司對從屬公司之民事損害賠償責任事項，並非刑事案件，無須向檢察官提出告訴，錯誤。 (D) 因(A)(C)均與法律規定不符，故本選項亦不成立，錯誤。"}, {"id": "71406ca97e51", "head": "申請上櫃時屬母子公司關係者，母公司及所有子公司，及其董事、監察人、代表人暨持股逾10%股東，與其關係人總計持有申請公司之股份不得超過發行總額之多少百分比？", "opts": [["A", "10%"], ["B", "30%"], ["C", "70%"], ["D", "80%"]], "ans": "C", "tag": "證交所與櫃買中心、上市上櫃審查", "srcTxt": "112年第3次 法規筆記　第6題", "ex": "依財團法人中華民國證券櫃檯買賣中心「證券商營業處所買賣有價證券審查準則」相關規定，申請上櫃公司如與母公司、子公司間屬母子公司關係者，為避免集團內部人持股過度集中、影響股權分散程度及市場流通性，特別規範：母公司及其所有子公司，暨其董事、監察人、代表人及持股超過10%之股東，連同其關係人合計持有申請上櫃公司之股份總數，不得超過該公司已發行股份總額之70%，以確保申請公司具備一定比例之股權分散於集團外部股東，維持上櫃後股票之流通性與市場交易之健全。\n\n逐項檢視： (A) 10%：門檻過低，與實際規定之70%相差甚遠，錯誤。 (B) 30%：仍低於法定門檻，不符規定，錯誤。 (C) 70%：與規定之持股上限相符，正確。 (D) 80%：超過法定上限，非正確答案。"}, {"id": "8172bf96e871", "head": "共同基金持有股票，係由何人行使投票表決權？", "opts": [["A", "證券投資信託公司"], ["B", "受益憑證持有人"], ["C", "保管機構"], ["D", "發行公司"]], "ans": "A", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "112年第3次 法規筆記　第7題", "ex": "共同基金（證券投資信託基金）所持有之股票，其表決權之行使，係由該基金之「證券投資信託公司」（即投信公司）代表基金行使。因證券投資信託契約架構下，投信公司為基金之經理機構，負責基金資產之運用與投資決策，包括對所持有股票所屬公司股東會議案之表決判斷；而基金保管機構雖負責基金資產之保管及款項收付，惟其本身並不負責行使基金持股之表決權，受益憑證持有人亦僅享有基金之受益權，並不直接對基金所投資之個別股票行使表決權。\n\n逐項檢視： (A) 「證券投資信託公司」為基金之經理機構，依法代表基金行使所持股票之表決權，與規定相符，正確。 (B) 「受益憑證持有人」僅為基金之受益人，並非直接對基金所投資股票行使表決權之主體，錯誤。 (C) 「保管機構」僅負責基金資產之保管及款項收付等事宜，並非行使表決權之機關，錯誤。 (D) 「發行公司」係指基金所投資標的公司本身，與行使該股票表決權之主體無關，錯誤。"}, {"id": "9d38b41aedc8", "head": "證券投資信託契約終止後，原則上應於多少時間內辦理清算證券投資信託基金？", "opts": [["A", "1個月內"], ["B", "3個月內"], ["C", "半年內"], ["D", "1年"]], "ans": "B", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "112年第3次 法規筆記　第8題", "ex": "依證券投資信託基金管理辦法相關規定，證券投資信託契約終止後，證券投資信託事業或清算人原則上應自證券投資信託契約終止之日起3個月內，完成證券投資信託基金之清算程序，並將清算後之餘額依受益人受益權比例分派予各受益人，以避免基金資產長期處於未結清狀態，影響受益人權益及基金財產之處理效率。若有正當理由未能於3個月內完成清算，得申報主管機關核准展延清算期限。\n\n逐項檢視： (A) 1個月內：期間過短，與規定之3個月不符，錯誤。 (B) 3個月內：與規定之原則清算期限相符，正確。 (C) 半年內：期間過長，超過法定原則期限，錯誤。 (D) 1年：同樣超過法定原則清算期限，錯誤。"}, {"id": "2d3f68d1d1df", "head": "依據證券交易法規定，證券承銷方式不包含下列哪一種型態？", "opts": [["A", "全額包銷"], ["B", "代銷"], ["C", "居間銷售"], ["D", "餘額包銷"]], "ans": "C", "tag": "募集發行與公開說明書", "srcTxt": "112年第3次 法規筆記　第9題", "ex": "依證券交易法第71條及相關承銷制度規範，證券承銷商辦理有價證券之承銷，其方式主要包括「包銷」與「代銷」兩大類型。其中「包銷」又可分為「全額包銷」（承銷商就約定承銷之有價證券，於承銷契約所訂期間屆滿後，對於未能全數銷售者，應自行認購剩餘數額）及「餘額包銷」（承銷商僅就發行公司經公開銷售後餘額之有價證券負包銷責任）；「代銷」則指承銷商僅代理發行人銷售有價證券，於承銷契約所訂期間屆滿後，對於未能銷售之餘額，得退還發行人，承銷商本身不負包銷責任。這些均屬於法定證券承銷之型態。\n\n「居間銷售」並非證券交易法所規範之承銷方式，其性質上為居間人媒合買賣雙方成立契約並收取報酬之法律關係（民法居間之概念），與證券承銷商依承銷契約對發行人負擔包銷或代銷義務之型態不同，故不屬於證券交易法所定之承銷方式。\n\n逐項檢視： (A) 「全額包銷」為法定承銷方式之一，敘述正確（非本題答案）。 (B) 「代銷」為法定承銷方式之一，敘述正確（非本題答案）。 (C) 「居間銷售」並非證券交易法規定之承銷方式類型，為本題所求之答案。 (D) 「餘額包銷」為法定承銷方式之一，敘述正確（非本題答案）。"}, {"id": "971cca968f52", "head": "以電子方式行使表決權而未親自出席股東會的股東，在表決以下何者議案時會被計為棄權？", "opts": [["A", "臨時動議"], ["B", "原議案之修正"], ["C", "對各項議案內容沒有表示贊成或反對時"], ["D", "選項(A)(B)(C)皆是"]], "ans": "D", "tag": "公司法：股東會與董事會", "srcTxt": "112年第3次 法規筆記　第10題", "ex": "依公司法第177條之1及第177條之2規定，股東以書面或電子方式行使表決權者，其意思表示應於股東會開會五日前送達公司，並以該次股東會有效之議決權出席股數計算，惟其行使範圍限於該次股東會議事程序中已列於議程之議案（含主管機關規定應以書面或電子方式行使表決權之議案類型）。針對以下情形，法律明定應將該股東之表決權計為「棄權」：其一，若股東會有臨時動議或原議案有臨時提出之修正動議時，因該等事項並非股東於行使電子表決權當下所能預見及表達意見之範圍，故以電子方式行使表決權之股東，就該等臨時動議或原議案修正部分，視為棄權；其二，股東就電子表決權行使系統上各項議案，如未明確表示贊成或反對之意見者，亦視為棄權，以避免其意思表示不明而產生爭議。\n\n逐項檢視： (A) 「臨時動議」係法定應被計為棄權之情形之一，敘述正確。 (B) 「原議案之修正」同屬法定應被計為棄權之情形，敘述正確。 (C) 「對各項議案內容沒有表示贊成或反對時」，亦屬法定應計為棄權之情形，敘述正確。 (D) 因(A)(B)(C)三者均為法律明定應計為棄權之情形，故三者皆是之敘述為正確答案。"}, {"id": "4bfcce14ff2b", "head": "境外基金公開說明書之更新或修正，總代理人應將其中譯本於更新或修正後幾日內辦理公告？", "opts": [["A", "2日"], ["B", "3日"], ["C", "5日"], ["D", "7日"]], "ans": "B", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "112年第3次 法規筆記　第11題", "ex": "依境外基金管理辦法相關規定，境外基金機構於其境外基金公開說明書內容有更新或修正時，該境外基金之總代理人應將更新或修正後之公開說明書中譯本，於更新或修正後3日內辦理公告，使國內投資人得以即時知悉境外基金相關資訊之變動內容，以維護投資人權益並確保資訊揭露之時效性。\n\n逐項檢視： (A) 2日：期間過短，與規定之3日不符，錯誤。 (B) 3日：與規定之公告期限相符，正確。 (C) 5日：期間過長，超過法定期限，錯誤。 (D) 7日：同樣超過法定期限，錯誤。"}, {"id": "0f522d2fe2f5", "head": "證券自營商為債券附條件買賣時，其交易餘額不得超過之淨值倍數及約定期限最長者為：", "opts": [["A", "二倍及三個月"], ["B", "二倍及六個月"], ["C", "四倍及一年"], ["D", "六倍及一年"]], "ans": "D", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "113年第1,2次 法規筆記　第1題", "ex": "依「證券商辦理債券附條件交易管理規則」規定，證券自營商辦理債券附條件買賣（RP/RS）交易，其交易餘額（未了結部位）不得超過該證券商淨值之六倍；同時，個別交易的約定期限最長不得超過一年。\n\n因此本題答案為 (D) 六倍及一年。"}, {"id": "a83cee7b1a97", "head": "外國政府發行之政府公債，申請在櫃檯買賣之方式為何？", "opts": [["A", "逕向臺灣證券交易所申請，並由其審核後公告"], ["B", "逕向證券櫃檯買賣中心申請，並由其審核後公告"], ["C", "逕向中華民國證券商業同業公會申請，並由其審核後公告"], ["D", "由金融監督管理委員會函令證券櫃檯買賣中心公告"]], "ans": "D", "tag": "證交所與櫃買中心、上市上櫃審查", "srcTxt": "113年第1,2次 法規筆記　第2題", "ex": "依「外國債券管理規則」及櫃檯買賣相關規定，外國政府發行之政府公債欲在櫃檯市場買賣，其程序並非由發行人或承銷商比照一般公司債「申請審核」的模式，而是由主管機關金融監督管理委員會基於政策考量，逕以函令方式指示證券櫃檯買賣中心公告該等債券得在櫃檯市場買賣。\n\n這是因為外國政府公債涉及主權層級的發行主體，其准駁與上市（櫃）作業性質上屬於主管機關的行政決定，而非透過一般申請審查程序，因此排除(A)(B)(C)由發行人或機構主動「申請」再經審核公告的模式。\n\n故本題答案為(D) 由金融監督管理委員會函令證券櫃檯買賣中心公告。"}, {"id": "54b982c0f761", "head": "得為融資融券交易之上櫃股票經發行公司轉申請上市後，除了下列何種原因之外均可為融資融券的標的？", "opts": [["A", "股價波動過度劇烈者"], ["B", "股權過度集中者"], ["C", "成交量過度異常者"], ["D", "以上皆是"]], "ans": "B", "tag": "信用交易（融資融券）與借券", "srcTxt": "113年第1,2次 法規筆記　第3題", "ex": "依證券交易相關規定，原已為上櫃融資融券交易標的之股票，於發行公司轉申請上市後，原則上得繼續作為融資融券交易之標的，以維持交易之延續性，但若有股價波動過度劇烈、成交量過度異常等顯示市場已存在異常投機炒作疑慮之情形，主管機關或證交所仍得停止其信用交易，以控管風險。\n\n至於「股權過度集中」，其本質是公司股權結構分散度的問題，通常與內部人持股、公眾流通量有關，主要影響的是股票能否繼續「上市」或「上櫃」掛牌交易資格的認定，而非直接反映信用交易（融資融券）當下的市場風險或投機炒作程度，故此項並非用來限制轉上市後是否得為融資融券標的之排除事由。\n\n因此，(A)股價波動過度劇烈、(C)成交量過度異常均為得排除融資融券資格的正當理由，唯獨(B)股權過度集中者不屬於排除融資融券交易的原因。\n\n故本題答案為(B) 股權過度集中者。"}, {"id": "6a16544d1c1e", "head": "「證券交易法」對違約不履行交割，足以影響市場秩序行為之刑事處罰為：", "opts": [["A", "1 年以下有期徒刑"], ["B", "1 年以上 7 年以下有期徒刑"], ["C", "5 年以下有期徒刑"], ["D", "3 年以上 10 年以下有期徒刑"]], "ans": "D", "tag": "交割結算、違約處理與集中保管", "srcTxt": "113年第1,2次 法規筆記　第4題", "ex": "依證券交易法第155條、第171條規定，違約不履行交割係屬操縱market行為之一種態樣（意圖影響集中交易市場某種有價證券之交易價格，與他人通謀而為約定於自己出售有價證券時、或於自己購買有價證券時，由他方以約定價格購買或出售，並於嗣後不履行交割，足以影響市場秩序者）。\n\n此類行為經證交法第171條第1項第1款明定為證券詐欺／操縱市場之犯罪行為，其法定刑為3年以上10年以下有期徒刑，得併科新臺幣1千萬元以上2億元以下罰金；若犯罪所得金額達新臺幣1億元以上者，刑度更加重為7年以上有期徒刑。\n\n故本題答案為(D) 3年以上10年以下有期徒刑。"}, {"id": "c6ca52205ff7", "head": "本國公司可透過下列何種方式申請登錄興櫃？", "opts": [["A", "已公開發行公司者再申請登錄興櫃"], ["B", "申請登錄興櫃併送一般公開發行"], ["C", "申請登錄興櫃併送簡易公開發行"], ["D", "以上皆是"]], "ans": "D", "tag": "證交所與櫃買中心、上市上櫃審查", "srcTxt": "113年第1,2次 法規筆記　第5題", "ex": "依櫃買中心相關規定，本國公司申請登錄興櫃股票的途徑並不限於單一種方式，主要包括：\n\n已依證券交易法規定辦理公開發行、且股票尚未在證券交易所上市或於證券商營業處所買賣之公司，得逕行申請登錄興櫃。\n\n未公開發行之公司，可於申請登錄興櫃之同時，一併送件辦理「一般公開發行」程序，使公司在完成興櫃登錄流程中同步取得公開發行公司身分。\n\n未公開發行之公司，亦可選擇透過「簡易公開發行」機制（即配合輔導推薦證券商、以較簡化的審核程序）併同申請登錄興櫃，加速其掛牌時程。\n\n由於上述三種途徑（已公開發行公司直接申請、併送一般公開發行、併送簡易公開發行）在實務與法規上皆屬允許的申請方式，並非互斥選項，"}, {"id": "f103788842fa", "head": "依「證券交易法」之規定，私人間直接讓受不超過一交易單位之私募有價證券，前後二次讓受之行為，不得少於幾個月？", "opts": [["A", "1 個月"], ["B", "3 個月"], ["C", "4 個月"], ["D", "6 個月"]], "ans": "B", "tag": "私募", "srcTxt": "113年第1,2次 法規筆記　第6題", "ex": "依證券交易法第43條之8第1項第2款規定，私募有價證券原則上有轉讓限制，但於符合一定條件下得排除限制，其中一款即為「該私募有價證券係於私人間為之，且每次讓受不超過一交易單位」。惟為防止投資人藉由「化整為零、分批讓受」之方式規避私募有價證券三年（或一定期間）之轉讓限制，法規進一步要求：若同一私募有價證券前後有兩次以上、每次均不超過一交易單位之私人間讓受行為，則前後二次讓受行為之間隔，不得少於3個月，以避免此排除規定遭濫用而實質上使私募證券喪失轉讓限制之意義。"}, {"id": "3175ba331708", "head": "關於公開發行公司私募股票之股東會決議中，「出席數」與「同意數」之敘述，何者為是？", "opts": [["A", "代表已發行股份總數三分之二以上股東出席，出席股東表決權過半數之同意"], ["B", "代表已發行股份總數過半數股東出席，出席股東表決權過半數之同意"], ["C", "代表已發行股份總數過半數股東出席，出席股東表決權三分之二以上之同意"], ["D", "代表已發行股份總數三分之一以上股東出席，出席股東表決權過半數之同意"]], "ans": "C", "tag": "私募", "srcTxt": "113年第1,2次 法規筆記　第7題", "ex": "依公司法第43條之6規定，公開發行股票之公司欲私募普通公司債以外之有價證券（含私募股票），應經董事會以三分之二以上董事出席、出席董事過半數之決議，並應提報股東會決議。而股東會就私募案之決議門檻，準用公司法第185條等重大事項之特別決議標準，即：應有代表已發行股份總數過半數股東之出席（出席數門檻），以出席股東表決權三分之二以上之同意（同意數門檻）行之。\n\n這與一般股東會普通決議（過半數出席、出席表決權過半數同意）不同，私募股票事涉股東權益稀釋及公司資本結構變動，故法規要求較高之「特別決議」門檻，即出席數為過半數、同意數則提高至三分之二以上。"}, {"id": "a9e52f5175f1", "head": "投資人新申購開放式基金，可能會立即產生哪項費用？", "opts": [["A", "銷售費用"], ["B", "轉換費用"], ["C", "證券手續費"], ["D", "管理費"]], "ans": "A", "tag": "基金與 ETF 交易實務", "srcTxt": "113年第1,2次 法規筆記　第8題", "ex": "開放式基金（共同基金）之相關費用可分為兩大類：一次性交易費用與經常性費用。\n\n銷售費用（申購手續費）：投資人於申購基金當下即須支付，通常依申購金額之一定比例計收（前收型於申購時扣，後收型於贖回時扣），屬於「立即產生」的費用。\n\n轉換費用：僅在投資人於同一基金公司旗下不同基金間進行轉換時才會產生，非新申購時必然發生。\n\n證券手續費：屬於基金經理人於基金內部從事證券買賣交易時所生之成本，由基金資產負擔，並非投資人申購當下直接支付之費用。\n\n管理費：屬於基金存續期間內、按日或按期自基金淨值中扣除之經常性費用，並非申購當下立即產生，而是逐日內含攤提。\n\n因此，投資人「新申購」開放式基金時，會立即直接產生的費用為銷售費用（申購手續費）。"}, {"id": "5f1b83ba692d", "head": "一般公開發行公司初次申請股票上市條件，公司「獲利能力」標準之一為稅前淨利占年度決算之財務報告所列示股本比率，最近二個會計年度均需達多少者，始合乎獲利能力標準？", "opts": [["A", "3%以上"], ["B", "5%以上"], ["C", "6%以上"], ["D", "10%以上"]], "ans": "C", "tag": "證交所與櫃買中心、上市上櫃審查", "srcTxt": "113年第1,2次 法規筆記　第9題", "ex": "依臺灣證券交易所「有價證券上市審查準則」第4條規定，一般公開發行公司申請股票上市，其獲利能力標準有數種併行方式可供選擇，其中一種為：\n\n最近二個會計年度稅前淨利占年度決算財務報告所列示股本之比率，均達6%以上者；或\n\n最近二個會計年度平均達6%以上，且最近一年度較前一年度為佳者；或\n\n最近五個會計年度均達3%以上者。\n\n本題所問為「最近二個會計年度均需達多少」之獲利能力標準，對應之比率門檻即為6%以上（而非5個年度均達3%以上之較低門檻），此係考量二年期間較短，故要求之獲利比率門檻相對較高，以確保公司具備穩定且較高水準之獲利能力，方可核准上市。"}, {"id": "a9618842b252", "head": "因有價證券集中交易市場買賣所生之債權，甲、證券交易所；乙、證券經紀商、證券自營商；丙、委託人，三者對交割結算基金有優先受償之權，其優先順序如何？", "opts": [["A", "甲、乙、丙"], ["B", "甲、丙、乙"], ["C", "丙、甲、乙"], ["D", "丙、乙、甲"]], "ans": "C", "tag": "交割結算、違約處理與集中保管", "srcTxt": "113年第1,2次 法規筆記　第10題", "ex": "依證券交易法第55條規定，交割結算基金乃證券交易所為擔保因有價證券集中交易市場買賣所生債務之履行，向證券經紀商、證券自營商收取繳存之基金。就該交割結算基金之優先受償順序，法規基於保障最終端投資人（委託人）之立場，設計出特定優先次序：\n\n第一順位：委託人（丙）— 因委託人係實際下單買賣、承擔市場風險之最終端投資大眾，其債權應獲最優先之保障。\n\n第二順位：證券交易所（甲）— 交易所為維持市場正常運作、履行結算擔保之機構，其債權次於委託人。\n\n第三順位：證券經紀商、證券自營商（乙）— 因其為市場之專業中介機構，相對於委託人與交易所，承擔風險與責任之性質不同，故受償順序列為最後。\n\n故正確之優先受償順序為：丙（委託人）→ 甲（證券交易所）→ 乙（證券經紀商、證券自營商）。"}, {"id": "d9a0d5d0c467", "head": "依現行「公司法」規定，發行擔保公司債之總額，不得超過公司現有全部資產減去全部負債之餘額的多少？", "opts": [["A", "一倍"], ["B", "二分之一"], ["C", "三分之一"], ["D", "三分之二"]], "ans": "A", "tag": "公司法：股份、資本與公司債", "srcTxt": "113年第1,2次 法規筆記　第12題", "ex": "依公司法第247條規定，公司發行公司債之總額，因擔保情形不同而有不同上限：\n\n發行有擔保公司債，或無擔保公司債但符合一定信用評等等條件者，其發行總額不得超過公司現有全部資產減去全部負債後餘額（即淨值）之全部，也就是「一倍」。\n\n發行無擔保公司債者，因欠缺擔保保障，故限制較嚴，其總額不得超過前述餘額之二分之一。\n\n本題問的是「擔保公司債」之發行總額上限，依上述規定應為公司現有全部資產減去全部負債餘額之一倍。"}, {"id": "8dab50407634", "head": "公司買回其股份時，下列哪些關係人不得在買回期間內賣出？甲、董事；乙、經理人；丙、關係企業經理人之未成年子女；丁、監察人之配偶", "opts": [["A", "甲、乙、丙、丁"], ["B", "甲、乙、丙"], ["C", "乙、丙、丁"], ["D", "甲、乙、丁"]], "ans": "A", "tag": "公司法：股東會與董事會", "srcTxt": "113年第1,2次 法規筆記　第13題", "ex": "依證券交易法第28條之2規定，公司依法買回其股份期間內，為防止公司內部人利用資訊優勢與買回時機從中獲利、規避內線交易疑慮，明定公司之董事、監察人、經理人及持股逾10%之大股東，其本人及利用他人名義持有股份者，於該公司買回股份之期間內，不得將其持股賣出。所稱「利用他人名義持有」，依相關規定及實務見解，包括配偶、未成年子女，以及利用他人名義持有而其實質上仍歸屬本人所得支配運用之股份，此範圍亦及於關係企業經理人之未成年子女等具實質規避可能性之人。\n\n逐一檢視本題所列對象： 甲、董事：屬明文禁止賣出之內部人身分，應納入限制範圍。 乙、經理人：同屬明文禁止賣出之內部人身分，應納入限制範圍。 丙、關係企業經理人之未成年子女：屬於利用他人名義持有股份之延伸範圍，應納入限制範圍。 丁、監察人之配偶：監察人本身為禁止賣出之內部人，其配偶持股亦視為利用他人名義持有，應納入限制範圍。\n\n四者皆屬買回期間內不得賣出股份之關係人範圍。"}, {"id": "42ef7e1ff977", "head": "發行人要將其股票在交易所掛牌買賣，交易所因提供場所，每年依據發行有價證券之總面值，向發行人收取之費用稱為：", "opts": [["A", "掛牌費"], ["B", "上市費"], ["C", "場地費"], ["D", "服務費"]], "ans": "B", "tag": "有價證券定義與證券交易法適用範圍", "srcTxt": "113年第1,2次 法規筆記　第14題", "ex": "依證券交易所相關規則，發行人有價證券於證券交易所掛牌買賣，須向交易所繳納相關費用，主要可分為：\n\n初次上市費：於證券首次核准上市時，依上市有價證券之總面值或總金額，按一定費率一次性收取之費用。\n\n上市費（年費性質）：於證券掛牌買賣後，交易所因持續提供集中交易市場場所及相關服務，每年依該發行人已上市有價證券之總面值，按規定費率按年向發行人收取之費用，此即所謂「上市費」。\n\n本題描述之情境為「交易所因提供場所，每年依據發行有價證券之總面值，向發行人收取之費用」，其性質屬於逐年、依面值計收之經常性費用，對應之名稱即為「上市費」，而非一次性之掛牌費，亦非場地費或服務費此類非正式法定名稱。"}, {"id": "08305f7b5885", "head": "已兼營期貨顧問業務之證券投資顧問事業申請經營全權委託投資業務，或證券投資顧問事業同時申請經營全權委託投資業務及兼營期貨顧問業務者，實收資本額應達新臺幣多少元？", "opts": [["A", "五千萬元"], ["B", "七千萬元"], ["C", "一億元"], ["D", "二億元"]], "ans": "B", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "113年第1,2次 法規筆記　第15題", "ex": "依「證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法」相關規定，證券投資顧問事業申請經營全權委託投資業務，其實收資本額原則上應達新臺幣5,000萬元以上。惟若該證券投資顧問事業已兼營期貨顧問業務，或係同時申請經營全權委託投資業務並兼營期貨顧問業務者，因其業務範圍擴及期貨顧問、風險管理需求較高，主管機關要求應具備更高之資本實力，故其實收資本額門檻提高至新臺幣7,000萬元以上，以強化其財務健全性及對客戶之保障能力。"}, {"id": "9e26e8bbf3a9", "head": "有關證券交易爭議之仲裁，在法律上適用優先順序為何？", "opts": [["A", "「仲裁法」優先於「證券交易法」"], ["B", "「證券交易法」優先於「仲裁法」"], ["C", "「民法」優先於「證券交易法」"], ["D", "「民事訴訟法」優先於「證券交易法」"]], "ans": "B", "tag": "有價證券定義與證券交易法適用範圍", "srcTxt": "113年第1,2次 法規筆記　第16題", "ex": "依法律適用原則，特別法優先於普通法適用。證券交易法乃針對證券交易爭議所訂定之特別規範（包括其第166條至第170條就證券商與證券商、證券商與委託人間因證券業務所生爭議之仲裁程序另有專章規定），而仲裁法則為規範一般仲裁程序之普通法。\n\n依「特別法優於普通法」之法理，於證券交易爭議之仲裁事項，凡證券交易法已有規定者（如強制仲裁之適用範圍、仲裁人資格等），應優先適用證券交易法之規定；僅於證券交易法未規定之事項，始補充適用仲裁法之一般規定。"}, {"id": "829e11f991d5", "head": "證券商轉投資總金額不得超過其淨值百分之多少？", "opts": [["A", "20%"], ["B", "40%"], ["C", "50%"], ["D", "100%"]], "ans": "B", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "113年第1,2次 法規筆記　第17題", "ex": "依「證券商管理規則」相關規定，證券商為健全其財務結構、避免過度以自有資金從事轉投資而稀釋主要證券業務所需之資本適足性，明定證券商對外轉投資（包括對其他事業之投資）之總金額，不得超過其最近期經會計師查核簽證財務報告所列淨值之40%，以確保證券商保留足夠淨值支應其證券業務之經營與風險承擔能力。"}, {"id": "aa906a98aff5", "head": "上櫃公司若經申請變更公司名稱經核准後，應於連續多長期間內將此訊息公告於證券櫃買中心指定網站之重大訊息？", "opts": [["A", "六個月"], ["B", "三個月"], ["C", "二個月"], ["D", "一個月"]], "ans": "B", "tag": "證交所與櫃買中心、上市上櫃審查", "srcTxt": "113年第1,2次 法規筆記　第18題", "ex": "依「財團法人中華民國證券櫃檯買賣中心對上櫃公司重大訊息之查證暨公開處理程序」相關規定，上櫃公司經核准變更公司名稱後，因公司名稱涉及投資人辨識該公司之重要基礎，為避免投資人因公司名稱變更而產生混淆或誤認，主管機關要求該上櫃公司應將此變更事項列為重大訊息，並於核准後連續3個月內，持續公告於證券櫃檯買賣中心指定之重大訊息網站，使投資人於一段合理期間內均能查悉此項變更，以保障市場資訊透明度及投資人權益。"}, {"id": "d3cf4f04ddac", "head": "金融控股公司委託書之徵求人於股東會有選舉董事或監察人議案者，除持股期間應為繼續持有一年以外，其持有股份總數限制為何？", "opts": [["A", "已發行股份三百萬股或已發行股份總數千分之一以上"], ["B", "已發行股份三百萬股或已發行股份總數千分之三以上"], ["C", "已發行股份二百萬股或已發行股份總數千分之五以上"], ["D", "已發行股份二百萬股或已發行股份總數千分之三以上"]], "ans": "C", "tag": "委託書徵求", "srcTxt": "113年第1,2次 法規筆記　第19題", "ex": "依「公開發行公司出席股東會使用委託書規則」相關規定，並考量金融控股公司股本規模通常較一般公開發行公司龐大之特性，就金融控股公司委託書徵求人資格另設較高之持股門檻要求。當股東會議案涉及選舉董事或監察人時，徵求人除須符合徵求委託書前應繼續持有該公司股份達一年以上之條件外，其持有股份數量尚須達到一定門檻，以確保徵求人具備相當之股東身分與利害關係，避免徵求制度遭濫用。\n\n就金融控股公司而言，其持股數量門檻為：持有已發行股份達二百萬股，或持有股份數占已發行股份總數千分之五以上，二者擇一達成即可，此門檻高於一般公開發行公司之標準（一般公司通常為五十萬股或千分之二），反映金融控股公司股本規模較大之特性。"}, {"id": "d45968287c57", "head": "若公司設立未滿一年，公開說明書中公司組織記載應揭露發起人何種資訊？", "opts": [["A", "出資比例占前五名者"], ["B", "持股比例占前十名者"], ["C", "薪資比例占前三名者"], ["D", "發起人性別比例"]], "ans": "B", "tag": "募集發行與公開說明書", "srcTxt": "113年第1,2次 法規筆記　第20題", "ex": "依「公開說明書應行記載事項準則」相關規定，公開說明書「公司組織」乙節，就發行公司相關人員持股情形應予揭露，其目的在使投資人瞭解公司主要出資者、發起人之持股結構，作為評估公司股權集中度及治理狀況之參考。\n\n其中就設立未滿一年之公司而言，因公司成立時間尚短，尚無完整之股東會、董事會改選及股權變動歷程可供參考，故特別要求應揭露「發起人持股比例占前十名者」之相關資訊（含其姓名、持股數、持股比例等），使投資人得以掌握公司草創階段主要出資發起人之背景與持股結構，藉以評估公司股權穩定性與潛在利益關係。"}, {"id": "5ba26e3cdc9c", "head": "下列敘述何者正確？", "opts": [["A", "平衡型基金應於基金名稱中標明平衡字樣"], ["B", "受益憑證為無記名式"], ["C", "保護型基金係指在基金存續期間，由保證機構到期時提供受益人一定比率本金保證之基金"], ["D", "保本型基金之保本比率應達投資本金之50%以上"]], "ans": "A", "tag": "公司法：股份、資本與公司債", "srcTxt": "113年第1,2次 法規筆記　第21題", "ex": "逐一檢視各選項：\n\n(A) 平衡型基金應於基金名稱中標明平衡字樣：依證券投資信託基金相關規定，基金名稱應與其投資策略、資產配置性質相符，平衡型基金（同時投資股票與債券以求收益與風險平衡）依規定應於基金名稱中標明「平衡」字樣，使投資人得以從名稱直接辨識基金類型，此敘述正確。\n\n(B) 受益憑證為無記名式：依證券投資信託及顧問法相關規定，受益憑證原則上應為記名式，以利受益人身分之登記與權益之保障（例如配息、贖回等作業均須確認受益人身分），而非無記名式，此敘述錯誤。\n\n(C) 保護型基金係指在基金存續期間，由保證機構到期時提供受益人一定比率本金保證之基金：此敘述實為「保本型基金」之定義（由保證機構提供到期保本承諾），而「保護型基金」則係透過基金本身之投資操作策略（如固定比例投資組合保險等，並非由外部保證機構提供保證）設法達到降低本金損失風險之效果，兩者性質不同，此敘述錯誤（張冠李戴）。\n\n(D) 保本型基金之保本比率應達投資本金之50%以上：保本型基金之保本比率規定應達投資本金之90%以上（而非50%），50%之門檻過低，不符實際規範，此敘述錯誤。"}, {"id": "b73f3bebde2d", "head": "有關發行人申報發行員工認股權憑證之規範，以下敘述何者錯誤？", "opts": [["A", "應經董事會三分之二以上董事出席及出席董事超過二分之一之同意"], ["B", "認股權人資格條件，至少應包括個人表現及績效等事項"], ["C", "發放審核程序須提報薪資報酬委員會或審計委員會同意"], ["D", "發行期間自申報生效通知到達之日起不得超過一年"]], "ans": "D", "tag": "公司治理、獨立董事與審計委員會", "srcTxt": "113年第1,2次 法規筆記　第22題", "ex": "逐一檢視各選項：\n\n(A) 應經董事會三分之二以上董事出席及出席董事超過二分之一之同意：依「發行人募集與發行員工認股權憑證處理準則」相關規定，公司發行員工認股權憑證，其發行計畫應經董事會三分之二以上董事出席，及出席董事超過二分之一之同意，屬正確之董事會決議門檻規定。\n\n(B) 認股權人資格條件，至少應包括個人表現及績效等事項：依規定，發行人擬訂員工認股權憑證之認股權人資格條件，應依員工年資、職務、績效等因素合理訂定，其中個人表現及績效確屬應納入考量之條件事項，此敘述正確。\n\n(C) 發放審核程序須提報薪資報酬委員會或審計委員會同意：依公司治理相關規範，員工認股權憑證之核發對象、數量及條件，涉及員工薪酬與激勵制度之核心事項，應提報薪資報酬委員會審議通過，或依公司治理結構提報審計委員會等相關程序，此敘述正確。\n\n(D) 發行期間自申報生效通知到達之日起不得超過一年：依規定，發行人申報發行員工認股權憑證經申報生效後，其發行期間自申報生效通知到達之日起，不得超過六個月，逾期未發行者應重行申報生效，而非一年，此敘述之期限錯誤。"}, {"id": "86d5aeafb976", "head": "因應公司法第22條之1之修正並促進公司資訊透明及落實洗錢防制作為，公司自民國107年11月1日起應依法於「公司負責人及主要股東資訊申報平臺」申報負責人及主要股東資訊，其有變動者，並應於變動後多少日內為之？", "opts": [["A", "15日"], ["B", "20日"], ["C", "30日"], ["D", "60日"]], "ans": "A", "tag": "防制洗錢與內部控制稽核", "srcTxt": "113年第1,2次 法規筆記　第23題", "ex": "依公司法第22條之1規定，公司應於每年依規定期間內，將董事、監察人、經理人及持股超過一定比例之股東等相關資訊，向中央主管機關指定之資訊平臺辦理申報；其有變動者，並應自變動事項發生之日起15日內為之。\n\n此項規定旨在強化公司負責人及主要股東資訊之透明度，並配合國際洗錢防制規範，使主管機關得以即時掌握公司實質控制權與重要人員異動情形，防杜利用公司從事洗錢等不法行為。"}, {"id": "da10b82e1f23", "head": "依公司法規定，相關公司買回公司股份與轉讓給員工之行為，下列敘述何者正確？", "opts": [["A", "買回股份，應經股東會特別決議為之"], ["B", "買回股份後，應在2年內轉讓給員工，否則應將買回股份視為未發行股份，辦理變更登記"], ["C", "買回之股份不得超過公司已發行股份總數百分之五"], ["D", "非公開發行公司若為閉鎖型股份有限公司，則不得為轉讓員工之目的，買回公司股份"]], "ans": "C", "tag": "公司法：股東會與董事會", "srcTxt": "113年第1,2次 法規筆記　第24題", "ex": "逐一檢視各選項：\n\n(A) 買回股份，應經股東會特別決議為之：依公司法第167條之1規定，公司為將股份轉讓予員工，得經董事會三分之二以上董事出席、出席董事過半數之決議買回其股份，此決議機關為董事會而非股東會，且門檻亦非股東會特別決議，此敘述錯誤。\n\n(B) 買回股份後，應在2年內轉讓給員工，否則應將買回股份視為未發行股份，辦理變更登記：依公司法第167條之1第2項規定，公司買回之股份，應於3年內轉讓於員工，逾期未轉讓者，視為公司未發行股份，並應辦理變更登記，題目所述期限為2年，與法定之3年不符，此敘述錯誤。\n\n(C) 買回之股份不得超過公司已發行股份總數百分之五：依公司法第167條之1第1項規定，公司收買股份之總數，不得超過該公司已發行股份總數百分之五，收買股份之總金額，不得逾保留盈餘加已實現之資本公積之金額，此敘述正確。\n\n(D) 非公開發行公司若為閉鎖型股份有限公司，則不得為轉讓員工之目的，買回公司股份：依公司法第356條之9規定，閉鎖型股份有限公司亦準用第167條之1規定，得為轉讓員工之目的買回其股份，並未排除閉鎖型公司之適用，此敘述錯誤。"}, {"id": "e16923493b7d", "head": "某證券商為專營證券業務之上櫃公司，且其特別盈餘公積尚未達實收資本額，則該證券商應於每年稅後盈餘項下，提存多少比例之特別盈餘公積？", "opts": [["A", "百分之十"], ["B", "百分之二十"], ["C", "百分之三十"], ["D", "百分之五十"]], "ans": "B", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "113年第1,2次 法規筆記　第25題", "ex": "依「證券商管理規則」相關規定，證券商為健全其財務結構、強化風險承擔能力，於其特別盈餘公積尚未累積達實收資本額之前，應於每年稅後盈餘項下，提存較高比例之特別盈餘公積，以加速累積緩衝資本。\n\n就專營證券業務之上市（櫃）證券商而言，於特別盈餘公積尚未達實收資本額之階段，其提存比例規定為百分之二十，高於一般公司依公司法提存法定盈餘公積之比例（10%），此係考量證券商業務具高度財務槓桿與市場風險特性，須有較充足之公積作為風險緩衝，待特別盈餘公積累積達實收資本額後，始得依規定調降提存比例或停止提存。"}, {"id": "55fa97915712", "head": "依「證券交易法」之規定，私募之應募人，原則上自該有價證券交付之日起多久後，可將私募之有價證券賣出？", "opts": [["A", "1年"], ["B", "2年"], ["C", "3年"], ["D", "5年"]], "ans": "C", "tag": "私募", "srcTxt": "113年第1,2次 法規筆記　第26題", "ex": "依證券交易法第43條之8第1項規定，私募有價證券之應募人及購買人，非有下列情形之一者，不得再行賣出：其一為該私募有價證券自該有價證券交付之日起滿三年，始得賣出。此規定之目的在於避免私募制度遭利用作為規避公開發行、公開招募程序之管道，透過設定一定閉鎖期間，確保私募有價證券不致於短期內即在市場上流通轉讓，破壞私募與公開發行間之區隔。\n\n其餘如私人間直接讓受不超過一交易單位、依法院之確定判決或其他相關法律規定之移轉等情形，則屬例外排除規定，得不受三年閉鎖期之限制。"}, {"id": "4fa8655f0555", "head": "證券投資信託契約終止後，原則上應於多少時間內辦理清算證券投資信託基金？", "opts": [["A", "1個月內"], ["B", "3個月內"], ["C", "半年內"], ["D", "1年內"]], "ans": "B", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "113年第1,2次 法規筆記　第27題", "ex": "依「證券投資信託基金管理辦法」相關規定，證券投資信託契約終止後，證券投資信託事業應於證券投資信託契約終止之日起，原則上3個月內完成證券投資信託基金之清算程序，並將清算後之賸餘財產按受益權單位數比例分派予受益人，以確保基金終止後之財產得以迅速、妥適處理，保障受益人權益，避免因清算程序過度延宕而影響受益人資產之流動性與價值。"}, {"id": "b5daa3831368", "head": "甲持續買入乙公開發行公司股份，至六月十日超過股份總額百分之十，則甲自取得大股東身分當日起多久內不得轉讓所持有乙公司之股票？", "opts": [["A", "12個月"], ["B", "9個月"], ["C", "6個月"], ["D", "3年"]], "ans": "C", "tag": "公司法：股份、資本與公司債", "srcTxt": "113年第1,2次 法規筆記　第28題", "ex": "依證券交易法第157條規定，發行股票公司董事、監察人、經理人或持股超過股份總額百分之十之股東（即所稱「內部人」），對公司股票具有短線交易歸入權之適用，其中就大股東身分之取得亦有相關轉讓限制。\n\n依證券交易法第22條之2規定，公開發行公司之董事、監察人、經理人或持有公司股份超過股份總額百分之十之股東，其股票之轉讓，應依規定辦理申報或透過集中交易市場、證券商營業處所為之，且新取得大股東身分者（如本題甲持續買進乙公司股份，至六月十日始超過10%而取得大股東身分），自其取得該身分之日起，6個月內不得將其所持有之股票轉讓，以防止此類內部人於短期間內取得大量股份後又迅速出脫，藉由資訊優勢或影響力從事不當套利，損及市場交易公平性。"}, {"id": "655d6da3bcc8", "head": "依證券交易法之規定，下列敘述何者錯誤？", "opts": [["A", "任何人單獨或與他人共同取得任一公開發行公司已發行股份總額超過百分之十五之股份者，應於取得後，同一年度結束前，向主管機關申報"], ["B", "募集有價證券，應先向認股人或應募人交付公開說明書"], ["C", "證券交易所得依法令或上市契約之規定終止有價證券上市，並應報請主管機關備查"], ["D", "公開發行公司審計委員會應由全體獨立董事組成，其人數不得少於3人，其中1人為召集人，且至少1人應具備會計或財務專長"]], "ans": "A", "tag": "公司治理、獨立董事與審計委員會", "srcTxt": "113年第1,2次 法規筆記　第29題", "ex": "正確答案是 (A)（也就是題目要找的「錯誤」敘述）。\n\n依證交法第43-1條第1項規定，任何人單獨或與他人共同取得任一公開發行公司已發行股份總額超過「百分之十」者，應於取得後「十日內」向主管機關申報。(A)把門檻寫成15%、申報期限寫成「同一年度結束前」，這兩個數字都是錯的，正確應該是「10%、10日內」。\n\n其餘三個選項都是對的：(B)出自證交法第31條，募集有價證券須先交付公開說明書；(C)出自第144條，證交所依法令或上市契約終止上市須報請主管機關備查；(D)出自第14-4條，審計委員會由全體獨立董事組成、人數不得少於3人、1人為召集人、至少1人具會計或財務專長，都是條文原文。"}, {"id": "c63591479e79", "head": "甲股份有限公司近期擬召開股東常會討論變更章程等議案，該公司並於股東常會召開前之停止股票過戶日前，公告受理股東之提案、書面或電子受理方式、受理處所及受理期間。依公司法之規定，下列敘述何者錯誤？", "opts": [["A", "甲公司股東若不克出席股東會，得出具一委託書，並委託一人代理出席股東會"], ["B", "股東提案得不以一\n項為限"], ["C", "甲公司受理股東提案之受理期間不得少於十日"], ["D", "甲公司股東會討論盈餘轉增資之議案，應在召集事由中列舉並說明其主要內容，不得以臨時動議提出"]], "ans": "B", "tag": "委託書徵求", "srcTxt": "113年第1,2次 法規筆記　第31題", "ex": "正確答案是 (B)（也就是題目要找的「錯誤」敘述），圖片上的打勾標示正確。\n\n依公司法第172-1條第1項規定，持有已發行股份總數百分之一以上股份之股東，得向公司提出股東常會議案，但「以一項為限」，超過一項者，均不列入表決。也就是說股東提案是有數量限制的（一項），(B)說「不以一項為限」剛好講反了，是錯誤敘述。\n\n其餘三項都是正確的：(A)出自第177條，股東得出具一份委託書、委託一人代理出席（「一股東一委託書、一人代理」原則）；(C)出自第172-1條第2項，公司受理股東提案之期間不得少於十日；(D)出自第172條第5項，涉及盈餘轉增資（以盈餘發行新股）之議案，須在召集事由中列舉並說明主要內容，不得以臨時動議提出，這類重大議案都要求「事先揭露」，不能臨時才丟出來讓股東措手不及。"}, {"id": "cd1bde3c6bb9", "head": "某一證券商淨值為 20 億，若經主管機關核准將其資金用於股權性質之投資，則其投資取得成本總額不得超過：", "opts": [["A", "6億"], ["B", "8億"], ["C", "10億"], ["D", "15億"]], "ans": "A", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "113年第1,2次 法規筆記　第32題", "ex": "正確答案是 (A) 6億，圖片上的打勾標示正確。\n\n依「證券商管理規則」規定，證券商經主管機關核准以自有資金為股權性質之投資，其投資取得成本總額不得超過該證券商淨值的百分之三十。代入本題數字：\n\n投資上限 = 淨值 × 30% = 20億 × 0.3 = 6億\n\n所以答案是 (A)。常見誤選原因是把比例記錯成40%（會誤算成8億）或其他業務規範的資金運用上限比例，混淆了不同投資性質適用的百分比門檻。"}, {"id": "673024571f2b", "head": "為促進我國普惠金融與金融科技發展，下列何者可依金融科技發展與創新實驗條例申請辦理證券業務創新實驗？", "opts": [["A", "證券商"], ["B", "證券金融事業"], ["C", "科技業"], ["D", "以上皆可進行申請"]], "ans": "D", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "113年第3次 法規筆記　第1題", "ex": "正確答案為(D) 以上皆可進行申請。\n\n依「金融科技發展與創新實驗條例」（俗稱金融監理沙盒）之規定，此制度之立法目的即在於促進普惠金融與金融科技發展，其申請主體並不限於既有的金融機構，而是採取開放式設計：不論是證券商、證券金融事業等既有金融機構，或是不具金融機構身分的一般科技業者（新創公司、科技公司等），只要其創新實驗之營業項目涉及證券業務、且有助於普惠金融或金融科技發展，皆可依該條例向主管機關申請辦理創新實驗，於一定期間及範圍內豁免相關法令限制，先行測試其商業模式之可行性。"}, {"id": "bad39290d25f", "head": "證券商辦理有價證券買賣融資融券，對每種證券之融資總金額，不得超過其淨值百分之多少？", "opts": [["A", "百分之三"], ["B", "百分之十"], ["C", "百分之四十"], ["D", "無限制"]], "ans": "B", "tag": "信用交易（融資融券）與借券", "srcTxt": "113年第3次 法規筆記　第2題", "ex": "正確答案為(B) 百分之十。\n\n依「證券商辦理有價證券買賣融資融券管理辦法」規定，證券商辦理有價證券買賣融資融券業務時，對每一種證券之融資總金額，不得超過該證券商淨值之10%；另就融券與出借合計之總金額，不得超過淨值之5%。此規定之目的在於分散證券商對單一證券之信用曝險，避免集中承擔過高風險，維護證券商財務健全與整體市場信用交易之穩定。\n\n其餘選項：\n\n(A) 百分之三與(C) 百分之四十皆非法規所訂之正確比例。\n\n(D) 無限制錯誤，因法規對每種證券之融資總金額訂有明確上限（淨值10%），並非無限制。"}, {"id": "938eae921310", "head": "公司股票有被進行公開收購者、(B) 公司股權有重大異動者、(C) 公司所從屬之控制公司股權有異動者，皆屬於股權結構、公司控制權變動相關之事件\n\n下列何種重大消息係指「證券交易法」第一百五十七條之一第五項及第六款所稱涉及公司之財務業務，對其股價有重大影響之消息？", "opts": [["A", "公司股票有被進行公開收購者"], ["B", "公司股權有重大異動者"], ["C", "公司所從屬之控制公司股權有異動者"], ["D", "公司獨立董事均解任"]], "ans": "D", "tag": "內線交易", "srcTxt": "113年第3次 法規筆記　第3題", "ex": "正確答案為(D) 公司獨立董事均解任。\n\n依「證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法」，重大消息可分為兩大類：一為「涉及公司之財務、業務」之重大消息（規定於該辦法第2條），另一為「涉及該證券之市場供求」之重大消息（規定於該辦法第3條），兩者性質與判斷基準並不相同。\n\n公司獨立董事均解任，屬於公司治理層面之重大事件，直接涉及公司內部治理結構與經營監督機制之重大變動，性質上屬於「涉及公司之財務、業務」之重大消息，故歸類於第2條所定範疇。\n\n其餘選項：\n\n(A) 公司股票有被進行公開收購者、(B) 公司股權有重大異動者、(C) 公司所從屬之控制公司股權有異動者，此三者皆屬於股權結構、公司控制權變動相關之事件，直接影響該證券在市場上之供給與需求關係（如收購導致籌碼集中、控制權易主影響市場預期等），故均歸類於「涉及該證券之市場供求」之重大消息（第3條），而非題目所問之「涉及公司之財務業務」類型，因此均非本題答案。"}, {"id": "e234751e9664", "head": "因累積跌幅達一定比例被暫停融資融券交易、停止有價證券借貸及當日沖銷交易之期信ETF，當連續___營業日之基金每日單位淨資產價值較其最初單位淨資產價值累積跌幅均未達___，可於公告後次一營業日起恢復融資融券交易、有價證券借貸及當日沖銷交易？", "opts": [["A", "10個、50%"], ["B", "10個、65%"], ["C", "30個、50%"], ["D", "30個、65%"]], "ans": "D", "tag": "信用交易（融資融券）與借券", "srcTxt": "113年第3次 法規筆記　第5題", "ex": "正確答案是 (D) 30個、65%，圖片上的打勾標示正確。\n\n這題延續前一題的觸發機制：期信ETF只要最近10個營業日的平均單位淨資產價值較最初淨資產價值累積跌幅達65%以上，就會被暫停融資融券交易、停止有價證券借貸及當日沖銷交易。而要恢復正常交易，門檻設計上會比觸發時更嚴謹——必須連續「30個」營業日，每日單位淨資產價值較最初淨資產價值的累積跌幅「都」沒有再達到65%，才能公告後次一營業日起恢復交易。\n\n也就是說，同一個「65%」是判斷風險程度的基準線，但暫停用短天數（10個營業日）快速反應風險，恢復則要求較長天數（30個營業日）持續確認淨值已經穩定回升、不再逼近警戒線，避免剛解除警示又立刻再度觸發，形成「暫停快、恢復慢」的不對稱設計。(A)(B)(C) 都是把天數或百分比其中一項配錯。"}, {"id": "307ac7827cb6", "head": "關於公司申請停止公開發行之規範，下列敘述何者正確？", "opts": [["A", "應有代表已發行股份總數二分之一以上股東出席之股東會，以出席股東表決權過半數之同意行之"], ["B", "應有代表已發行股份總數三分之二以上股東出席之股東會，以出席股東表決權過半數之同意行之"], ["C", "應由三分之二以上董事之出席，及出席董事過半數之同意行之"], ["D", "全體董事三分之二以上同意行之"]], "ans": "B", "tag": "公司法：股東會與董事會", "srcTxt": "113年第3次 法規筆記　第8題", "ex": "公司申請停止公開發行，依公司法第156條之2規定，須經股東會以「特別決議」通過，其表決門檻準用公司法第185條（讓與全部或主要部分營業、財產等重大事項）之標準，也就是：\n\n應有代表已發行股份總數三分之二以上之股東出席股東會，並以出席股東表決權過半數之同意行之（若公開發行公司出席股份未達三分之二門檻，則可改採「代表已發行股份總數過半數股東出席，出席股東表決權三分之二以上同意」的較低出席、較高同意比例方案，但基本規範仍以三分之二出席、過半數同意為原則）。\n\n逐項檢視： (A) 出席門檻僅寫「二分之一以上」，未達特別決議所要求的三分之二出席標準，錯誤。 (B) 「三分之二以上股東出席，出席股東表決權過半數同意」，正好對應特別決議之標準門檻，正確。 (C) 停止公開發行屬於股東會決議事項（涉及股東權益重大變動），並非董事會決議事項，以「董事出席、董事同意」作為門檻的敘述方向錯誤。 (D) 同理，錯把應由股東會決議之事項寫成董事會決議，且門檻設計亦不符法定要求，錯誤。"}, {"id": "0ee0ab746931", "head": "下列有關基金保管機構之敘述何者正確？", "opts": [["A", "指本於信託關係，擔任證券投資信託契約委託人"], ["B", "指本於信託關係，擔任證券投資信託契約受託人"], ["C", "依法及證券投資信託契約辦理相關基金保管業務之保險公司"], ["D", "依法及證券投資信託契約辦理相關基金保管業務之券商"]], "ans": "B", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "113年第3次 法規筆記　第9題", "ex": "依證券投資信託及顧問法第5條規定之定義，基金保管機構係指本於信託關係，擔任證券投資信託契約受託人，依證券投資信託契約及相關法令規定，保管、處分、收付證券投資信託基金，並辦理與基金保管業務有關事項之信託公司或兼營信託業務之銀行。\n\n在證券投資信託契約架構中，證券投資信託事業（投信公司）是「委託人」，負責基金之管理及運用；基金保管機構則是「受託人」，負責基金資產之保管與相關款項之收付，二者角色分工明確，且基金保管機構之主體資格為信託公司或兼營信託業務之銀行，並非保險公司或券商。\n\n逐項檢視： (A) 誤將基金保管機構定位為「委託人」，實際上委託人為證券投資信託事業（投信公司），錯誤。 (B) 正確指出基金保管機構本於信託關係擔任「受託人」角色，與法定定義相符，正確。 (C) 基金保管機構之主體應為信託公司或兼營信託業務之銀行，並非保險公司，錯誤。 (D) 同理，基金保管機構之主體並非券商，錯誤。"}, {"id": "b68c2234f1ba", "head": "下列何者採除息交易？", "opts": [["A", "國內可轉換公司債"], ["B", "債券換股權利證書"], ["C", "國內公司債"], ["D", "以上皆是\n\n答案：(D) 以上皆是"]], "ans": "D", "tag": "公司法：股份、資本與公司債", "srcTxt": "114年第1次 法規筆記　第1題", "ex": "「除息交易」是指有價證券在配發利息（或股息）之後，交易所會將該證券的參考價格往下調整，扣除已發放的利息部分，避免投資人因為除息當天價格自然下跌而誤判漲跌。\n\n這題問的其實是「哪些債券類商品會有除息機制」。答案是：只要是會定期配息的債券類商品，交易所在配息日都會做除息處理，因此：\n\n- 國內可轉換公司債：本質上仍是公司債，持有期間會領取票面利息，配息時同樣要除息。\n- 債券換股權利證書（ECB 分割後的債券部分憑證）：性質上等同於公司債的利息請求權部分，配息時也要除息。\n- 國內公司債：最基本的公司債，配息除息是理所當然。\n\n因為這三者本質上都是「會配發利息的債務性有價證券」，配息時都必須做除息調整，所以正確答案是 (D) 以上皆是，而不是只有 (C) 國內公司債。這也是圖片中打叉選項 (C) 之所以錯的原因——它只選到其中一種，範圍設得太窄，忽略了可轉換公司債和 ECB 換股權利證書其實也具有相同的配息除息特性。"}, {"id": "50048328b740", "head": "某上市公司申報現金增資案，擬提撥現金增資金額百分之十五以時價公開發行，應經何單位決議通過後，才能向主管機關申報？", "opts": [["A", "監察人聯席會"], ["B", "股東會"], ["C", "常董會"], ["D", "董事會\n\n答案：(B) 股東會"]], "ans": "B", "tag": "募集發行與公開說明書", "srcTxt": "114年第1次 法規筆記　第2題", "ex": "關鍵在於「提撥一定成數以時價對外公開發行」這件事，本質上是在排除／限制原有股東的新股優先認購權。\n\n依公司法規定，公司發行新股，原股東原則上享有按股份比例優先認購的權利；但公司法第267條允許公司保留一定成數（實務上常見上限為發行新股總額的10%~15%）洽由員工承購或以時價對外公開發行。因為這會影響到原股東的法定優先認購權益，屬於股東重大權益事項，所以必須經股東會特別決議通過，才能對外辦理公開發行、並向主管機關（金管會）申報。\n\n而其他選項為什麼不對：\n\n- (D) 董事會：一般新股發行（未涉及對外公開發行、未影響股東優先認購權部分）確實可由董事會決議即可辦理，但本題特別強調「提撥15%以時價公開發行」，這是對股東優先權的例外處理，法律要求拉高到股東會層級決議，不能只靠董事會。\n- (C) 常董會：常務董事會屬於董事會授權下的執行機構，層級低於股東會，無權決議此類涉及股東權益的重大事項。\n- (A) 監察人聯席會：監察人（監事）的職權在於監督與查核，並非公司經營或增資決策機關，公司法上也沒有「監察人聯席會」這種決議增資案的機制，選項本身在功能定位上就不符。\n\n所以本題"}, {"id": "7f62a3f4acb0", "head": "依公司法之規定，1人同時受2人以上委託代理行使表決權，不得超過已發行股份總數之百分之幾？", "opts": [["A", "百分之五"], ["B", "百分之十"], ["C", "百分之三"], ["D", "百分之一\n\n答案：(C) 百分之三"]], "ans": "C", "tag": "公司法：股東會與董事會", "srcTxt": "114年第1次 法規筆記　第3題", "ex": "這題考的是公司法第177條第2項有關「委託書代理表決權比例上限」的規定：\n\n一人同時受二人以上股東委託時，其代理之表決權不得超過已發行股份總數表決權之百分之三；超過者，其超過之表決權，不予計算。\n\n也就是說，法律是為了防止「委託書大戶」利用大量收購委託書、集中控制表決權，進而操控股東會決議，因此設下單一代理人所代理的委託表決權總和，最高不得超過該公司已發行股份總數的3%這道防線。若超過3%的部分，該超過部分的表決權會被視為無效（不予計算），而不是整份委託書作廢。\n\n圖片標示的答案 (C) 百分之三 是正確的，(B) 百分之十 之所以錯，是把這條3%的門檻跟其他規定（例如公開收購或大股東持股申報的門檻常出現10%字樣）搞混了，屬於張冠李戴的陷阱選項。"}, {"id": "ea7fabf0b1d6", "head": "公開收購如全部應賣有價證券之數量，超過所預定之收購數量時，公開收購人應依何種方式向應賣人購買？", "opts": [["A", "依規模向數量較多之應賣人收購"], ["B", "依隨機排列之順序向應賣人收購"], ["C", "依時間順序向較早之應賣人收購"], ["D", "依同一比例分配至股為止向全部應賣人收購\n\n答案：(D) 依同一比例分配至股為止向全部應賣人收購"]], "ans": "D", "tag": "公開收購", "srcTxt": "114年第1次 法規筆記　第4題", "ex": "這題考的是「公開收購公開發行公司有價證券管理辦法」中關於應賣數量超過預定收購量時的分配原則。規定明確要求公開收購人必須採取比例分配（proration）方式，也就是不論應賣人是先賣、後賣、賣得多或賣得少，一律按照「應賣股數 ÷ 全部應賣總股數」的相同比例，分配收購額度給每一位應賣人，收購到預定的收購數量為止，多餘未成交的部分則退還給原應賣人。\n\n這樣設計的核心目的是公平原則：確保所有想參與應賣的股東，不論下單早晚、持股多寡，都能得到相同機會比例被收購，避免公開收購人挑選特定對象（例如只收購大股東或先送件者）造成不公平對待，也防止內線消息靈通者搶先卡位。\n\n其他選項為什麼錯：\n\n- (A) 依規模挑數量多者：違反公平原則，會讓小股東處於劣勢。\n- (B) 隨機排序：不具備制度上的公平保證，也非法規採用的方式。\n- (C) 依時間先後（誰先賣先成交）：這是「先到先得」邏輯，同樣會讓晚下單的應賣人吃虧，不符合法規要求的比例分配精神。\n\n圖片標示的答案 (D) 是正確的。"}, {"id": "7fdc83431bb8", "head": "在證券交易所上市或證券商營業處所買賣之有價證券之給付或交割應以下列何者為之？ 甲、現貨；乙、現款；丙、帳簿劃撥；丁、支票", "opts": [["A", "僅甲、乙"], ["B", "僅丙、丁"], ["C", "僅甲、丙"], ["D", "僅乙、丁\n\n答案：(A) 僅甲、乙"]], "ans": "A", "tag": "交割結算、違約處理與集中保管", "srcTxt": "114年第1次 法規筆記　第5題", "ex": "這題的法源是證券交易法第43條第1項：\n\n證券交易所上市或於證券商營業處所買賣之有價證券，其給付或交割，應以現款、現貨為之。\n\n也就是說，法律明文規定的給付或交割方式，本體就是「現貨」（甲）搭配「現款」（乙）這兩項，所以答案是 (A) 僅甲、乙。\n\n那「帳簿劃撥（丙）」為什麼不能選？因為同條第2項雖然提到「前項給付、交割之有價證券，得以帳簿劃撥方式為之」，但這只是現貨交割的實際作業技術手段（也就是用電腦帳簿劃撥取代實體券券本票券的搬運，方便集保結算），法律上它仍然是在履行「現貨」交割這件事，並不是與現貨、現款並列的另一種獨立給付方式。所以丙其實是包含在甲（現貨）的實現手法之中，不能單獨算成第三個選項。\n\n至於「支票（丁）」則完全不符合規定，因為證券交易法明確要求要用「現款」，支票屬於票據信用工具，存在跳票、兌現與否的不確定性，法律不允許用支票取代現款來完成證券交易的給付義務，這也是圖片中錯誤選項 (C) 僅甲、丙 之所以誤導人的地方——它誤把「帳簿劃撥」當成與現貨、現款並列的獨立交割方式，忽略了帳簿劃撥其實只是現貨交割的技術執行手段。\n\n圖片標示的答案 (A) 僅甲、乙 是正確的。"}, {"id": "3f0d2bfd34bf", "head": "開放式基金受益人要求贖回受益憑證，其買回價格之計算為：", "opts": [["A", "按契約公式"], ["B", "按面額"], ["C", "依買回請求當日基金淨值計算"], ["D", "依買回請求到達之當日或次一營業日基金淨值計算\n\n答案：(D) 依買回請求到達之當日或次一營業日基金淨值計算"]], "ans": "D", "tag": "基金與 ETF 交易實務", "srcTxt": "114年第1次 法規筆記　第6題", "ex": "這題考的是基金買回的「未知價原則」（forward pricing）。開放式基金的買回價格並非以受益人「送出請求那一刻」的即時淨值計算，而是要看「買回請求送達基金公司（或銷售機構）的時間」是否在每日公告的截止時點（實務上通常是下午3點或3點30分）之前：\n\n- 若請求在截止時點之前送達 → 以當日收盤後核算出的基金淨值計算買回價格。\n- 若請求在截止時點之後才送達 → 順延以次一營業日的基金淨值計算。\n\n這種設計的目的是為了防止投資人利用「已經知道當天淨值走勢」來投機套利（例如市場已經收盤、淨值已定，投資人才決定要不要贖回），因此制度上刻意讓買回價格建立在「請求送達時點所對應的、尚未確定或即將確定的淨值」上，而不是讓投資人可以回頭挑一個對自己最有利、已知的淨值來贖回，這就是所謂的未知價原則。\n\n其他選項為什麼錯：\n\n- (A) 按契約公式：基金淨值是依基金資產淨值除以受益權單位數計算，並非依某種契約約定的固定公式決定買回價，這個敘述本身概念錯誤。\n- (B) 按面額：面額只是發行時的參考單位（例如每受益權單位10元），基金淨值會隨資產表現波動，買回價格不可能固定按面額計算，否則基金淨值漲跌就毫無意義了。\n- (C) 依買回請求當日基金淨值計算：這個選項之所以是陷阱，是因為它忽略了「截止時點」這個關鍵條件——如果請求是在收盤截止時間之後才送達，就不能用「當日」淨值，而必須順延到次一營業日，所以單純講「當日」並不完整、不夠精確，這正是圖片上打叉的原因。\n\n圖片標示的答案 (D) 是正確的。"}, {"id": "c2798db9e32a", "head": "依「證券交易法」及「公開發行公司董事監察人股權成數及查核實施規則」規定，公開募集及發行有價證券之公司，公司實收資本額在新臺幣三億元以下者(無選任獨立董事)，全體董事所持有記名股票之股份總額不得少於公司已發行股份總額＿＿，全體監察人不得少於＿＿？", "opts": [["A", "5%；0.50%"], ["B", "15%；1.5%"], ["C", "10%；0.1%"], ["D", "7.5%；0.75%\n\n答案：(B) 15%；1.5%"]], "ans": "B", "tag": "公司治理、獨立董事與審計委員會", "srcTxt": "114年第1次 法規筆記　第7題", "ex": "這題考的是「公開發行公司董事監察人股權成數及查核實施規則」中，依公司實收資本額級距訂定的董監事最低持股門檻。這個制度的立法目的，是要求公司經營層（董事、監察人）自身也要持有一定比例的股份，讓經營者的利益與公司、股東的利益綁在一起，避免經營者拿別人的錢做事卻自己完全不持股、缺乏切身利害的道德風險。\n\n規則採級距遞減的設計——資本額越大，門檻百分比反而越低（因為分母變大，同樣百分比要求的絕對金額會過高，不合理），實務常見的級距大致如下：\n\n- 實收資本額 3億元以下：全體董事持股不得少於已發行股份總額 15%；全體監察人不得少於 1.5%\n- 超過3億元至10億元：董事 10%；監察人 1%\n- 超過10億元至20億元：董事 7.5%；監察人 0.75%\n- 超過20億元至100億元：董事 5%；監察人 0.5%\n\n本題問的是「實收資本額3億元以下、且未設獨立董事」的情形，對應到的正是最高一檔的門檻：董事15%、監察人1.5%，所以答案是 (B)。\n\n其他選項為什麼是陷阱：\n\n- (A) 5%；0.50%：這其實是「超過20億至100億元」資本額級距的門檻，資本額規模抓錯了一大截。\n- (C) 10%；0.1%：董事比例10%對應到的是「超過3億至10億元」那一級距沒錯，但監察人比例被錯置成0.1%（正確應該是1%），數字對不齊，屬於湊錯配對的混淆選項。\n- (D) 7.5%；0.75%：這是「超過10億至20億元」級距的門檻，同樣是資本額級距抓錯。\n\n圖片標示的答案 (B) 15%；1.5% 是正確的。"}, {"id": "1d03ea40a149", "head": "保護基金投資每家上市、上櫃或興櫃公司股票之原始投資不得超過：", "opts": [["A", "一百萬元"], ["B", "一千股"], ["C", "二百萬元"], ["D", "二千股\n\n答案為 (B) 一千股。"]], "ans": "B", "tag": "投資人保護法與團體訴訟", "srcTxt": "114年第2次 法規筆記　第1題", "ex": "這題考的是「財團法人證券投資人及期貨交易人保護基金」（簡稱保護基金）的特殊持股規定。保護基金基於《證券投資人及期貨交易人保護法》所賦予的職能，會對每一家上市、上櫃或興櫃公司進行「原始投資」，目的是取得該公司股東身分，以便未來在必要時能代表投資人對公司經營者提起股東代位訴訟或行使少數股東權利（例如訴請解任董監事），藉此保障投資人權益。\n\n因為這種持股的目的是「取得訴訟資格」而非一般財務投資，所以法規特別限制其原始取得股數要精簡、象徵性即可，明訂每家公司原始投資不得超過一千股，並非以金額（元）來限制。這也是為什麼(A)(C)兩個「金額」選項容易讓人誤判——考生若直覺聯想到一般投資金額上限，就會誤選成百萬元等級的金額選項，但本題規範的量詞單位是「股數」而不是「金額」。\n\n至於(D)二千股則是常見的干擾選項，容易與其他證券法規中出現的股數門檻（如某些揭露義務或持股比例的股數基準）混淆，但保護基金原始投資的法定上限就是一千股，並非二千股。"}, {"id": "ffd54bf42c0f", "head": "證券櫃檯買賣交易市場共同責任制給付結算基金之繳存應：", "opts": [["A", "以現金為限"], ["B", "以現金、有價證券為限"], ["C", "以現金、國庫券、公債為限"], ["D", "以現金、短期票券為限\n\n答案為 (A) 以現金為限。"]], "ans": "A", "tag": "交割結算、違約處理與集中保管", "srcTxt": "114年第2次 法規筆記　第2題", "ex": "這題考的是「證券櫃檯買賣（OTC）交易市場共同責任制給付結算基金」的繳存方式規定。這個基金屬於違約損失風險準備性質的結算基金，目的是當有證券商在櫃買市場交易發生違約交割時，由全體參加該共同責任制的證券商共同分擔損失、確保市場結算安全，性質上類似「共同保險池」。\n\n因為這種基金必須在違約事件發生時立即動用、隨時可變現支應，不能有變現風險或估價爭議，所以法規明訂繳存僅能以現金方式繳納，不允許用有價證券、國庫券、公債或短期票券等方式抵繳。這點跟一般證券商的「營業保證金」或投資人的「委託保證金」不同——那些制度有時允許用政府公債、國庫券等信用風險極低的有價證券來替代現金繳存，但共同責任制給付結算基金因為要求「立即流動性」，特別排除了這些替代方式，故只認可現金。\n\n因此(B)(C)(D)這幾個選項都是常見的干擾設計，容易讓人誤以為結算類基金也比照一般保證金制度可用公債、國庫券等有價證券繳納，但本題規範的是流動性要求最高的結算基金，答案就是單純的「以現金為限」。"}, {"id": "1ebc52b327de", "head": "採洽商銷售承銷之認購(售)權證、指數投資證券、附認股權公司債案件，每一認購人認購數量不得超過該次承銷總數之：", "opts": [["A", "20%"], ["B", "10%"], ["C", "30%"], ["D", "5%\n\n答案為 (B) 10%。"]], "ans": "B", "tag": "指數投資證券（ETN）", "srcTxt": "114年第2次 法規筆記　第3題", "ex": "這題考的是「洽商銷售」承銷方式下的單一認購人集中度限制。認購（售）權證、指數投資證券（ETN）、附認股權公司債這類商品，若採「洽商銷售」（也就是承銷商自行與特定對象洽談銷售，而非公開申購）的方式承銷，為了避免整個發行案的籌碼過度集中在少數人手上、影響後續市場流通性與價格穩定，法\n\n規特別限制每一位認購人的認購數量不得超過該次承銷總數的 10%。\n\n這是一種「反過度集中」的保護性設計：如果沒有這個上限，理論上一位大戶就能包下整批發行，導致該權證或商品上市後籌碼集中在極少數人手中，容易造成流動性不足、價格容易被操控等問題，違背證券市場公平、公開、流通的精神。\n\n至於(A)20%、(C)30%、(D)5%都是常見的干擾選項，容易和其他承銷相關規定（例如一般股票公開申購的個人認購上限、或其他類型商品的集中度限制）搞混，但本題明確指的是「洽商銷售的認購權證／指數投資證券／附認股權公司債」這個特定類型，其法定上限就是 10%。"}, {"id": "02b78128ed24", "head": "下列何者得擔任境外基金之總代理人？甲、證券投資信託事業；乙、證券投資顧問事業；丙、證券經紀商；丁、信託業", "opts": [["A", "僅甲、乙、丙"], ["B", "甲、乙、丙、丁皆可"], ["C", "僅乙、丙"], ["D", "僅甲、乙\n\n答案為 (A) 僅甲、乙、丙。"]], "ans": "A", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "114年第2次 法規筆記　第4題", "ex": "這題考的是《境外基金管理辦法》對「總代理人」資格的規定。所謂境外基金總代理人，是代表境外基金機構在台灣統籌辦理該境外基金募集、銷售、申購買回等事務的窗口機構，責任重大，因此法規限定只有特定三類已受金融監理、具備證券相關專業能力的事業才能擔任：\n\n- 甲、證券投資信託事業（俗稱投信）：本身就是專門從事基金發行與管理的專業機構，最常見的境外基金總代理人型態。\n- 乙、證券投資顧問事業（俗稱投顧）：具備證券投資分析與顧問專業，也是常見的總代理人型態。\n- 丙、證券經紀商（證券商）：具備證券承作與客戶服務能量，符合一定條件下也可擔任。\n\n丁、信託業則不得擔任總代理人——信託業在境外基金體系中扮演的角色通常是「保管機構」或作為銷售機構之一（例如透過信託契約幫客戶投資境外基金），但法規並未賦予信託業擔任「總代理人」的資格，因為總代理人涉及對外代表境外基金機構、負責申報核准、資訊揭露等法定義務，屬於證券投資信託顧問法體系下核准的三類事業之專屬職能，信託業屬於銀行法／信託業法體系，兩者監理框架不同。\n\n所以正確答案是「僅甲、乙、丙」，丁（信託業）被排除在外，這也是本題設計干擾選項(B)「甲乙丙丁皆可」的用意——測試考生是否誤以為信託業也具備此資格。"}, {"id": "bdea54e8aca5", "head": "為使保護機構得以順利進行訴訟，以爭取投資人、交易人之權利，投保法特別在裁判費與擔保費用方面給予優遇，如依「證券投資人及期貨交易人保護法」§35 規定，訴訟標的金額或價額超過新臺幣___元者，超過部分暫免繳裁判費？", "opts": [["A", "三千萬"], ["B", "四千萬"], ["C", "一千萬"], ["D", "二千萬\n\n答案為 (A) 三千萬。"]], "ans": "A", "tag": "其他", "srcTxt": "114年第2次 法規筆記　第5題", "ex": "這題考的是《證券投資人及期貨交易人保護法》第35條對保護機構（也就是保護基金）提起訴訟或仲裁時，在裁判費方面給予的特別優遇。條文明定：保護機構為投資人及交易人提起代位訴訟等相關訴訟時，其訴訟標的之金額或價額超過新臺幣三千萬元的部分，暫免繳納裁判費。\n\n這項規定的立法用意在於降低保護機構代表廣大投資人興訟的財務門檻。一般民事訴訟的裁判費是依訴訟標的金額比例計算，標的金額越高，裁判費也越高，如果保護機構要代表大量受害投資人求償（求償金額往往非常龐大），若完全比照一般程序繳納裁判費，可能光是裁判費就是一筆天文數字，反而讓保護機構因資金壓力而卻步，無法有效發揮保障投資人的功能。因此立法者特別給予「超過三千萬元部分暫免繳裁判費」的優遇，降低保護機構提起訴訟的成本障礙，讓其能更順利地代表投資人爭取權益。\n\n同一條文精神也延伸到「擔保費用」方面（例如聲請假扣押、假處分時法院要求提供擔保金），同樣給予保護機構優惠待遇，整體邏輯都是為了讓保護機構這個「公益性質的訴訟發動者」不因訴訟成本過高而失去實際嚇阻不法、保障投資人的效果。\n\n(B)(C)(D)都是常見的干擾金額選項，但法條明確規定的門檻數字就是三千萬元，答案為(A)。"}, {"id": "aaca5782f0c7", "head": "境外基金募集及銷售案件，主管機關得委託以下何單位受理申請案件？", "opts": [["A", "集保結算所"], ["B", "證券投資信託暨顧問商業同業公會"], ["C", "不得委託其他單位受理"], ["D", "證交所\n\n答案為 (A) 集保結算所。"]], "ans": "A", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "114年第2次 法規筆記　第6題", "ex": "根據《境外基金管理辦法》第2-1條明文規定：「本會（金管會）得委託臺灣集中保管結算所股份有限公司受理第二十七條之境外基金募集及銷售案件」。也就是說，境外基金要在台灣募集及銷售，依法本來應向主管機關金管會申請核准或申報生效，但實務上金管會將這項受理申請的行政作業，委託給臺灣集中保管結算所（集保結算所，TDCC）辦理，包括受理案件申請、以及後續若發現有應撤銷或廢止核准／生效情形時，執行相關處分。\n\n這也呼應集保結算所在境外基金體系中扮演的「基金市場後檯服務機構」角色——它不只負責申購、買回、轉換、孳息分派等款項收付與資訊傳輸，也建置了「基金資訊觀測站」作為總代理人申報與投資人查詢資訊的平台，因此由金管會委託其一併受理募集銷售案件的申請，在行政效率與資訊整合上具有一致性。\n\n(B)證券投資信託暨顧問商業同業公會（SITCA）雖然在境外基金領域也扮演自律規範、發布問答集等角色，但並非法定受託受理申請案件的機構；(D)證交所主要負責集中交易市場業務，與境外基金募集銷售申請無關；(C)「不得委託其他單位受理」則與法條明文允許委託的規定相反。"}, {"id": "aaca5782f0c7", "head": "境外基金募集及銷售案件，主管機關得委託以下何單位受理申請案件？", "opts": [["A", "集保結算所"], ["B", "證券投資信託暨顧問商業同業公會"], ["C", "不得委託其他單位受理"], ["D", "證交所\n\n答案為 (A) 集保結算所。"]], "ans": "A", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "114年第2次 法規筆記　第7題", "ex": "根據《境外基金管理辦法》第2-1條明文規定：「本會（金管會）得委託臺灣集中保管結算所股份有限公司受理第二十七條之境外基金募集及銷售案件」。也就是說，境外基金要在台灣募集及銷售，依法本來應向主管機關金管會申請核准或申報生效，但實務上金管會將這項受理申請的行政作業，委託給臺灣集中保管結算所（集保結算所，TDCC）辦理，包括受理案件申請、以及後續若發現有應撤銷或廢止核准／生效情形時，執行相關處分。\n\n這也呼應集保結算所在境外基金體系中扮演的「基金市場後檯服務機構」角色——它不只負責申購、買回、轉換、孳息分派等款項收付與資訊傳輸，也建置了「基金資訊觀測站」作為總代理人申報與投資人查詢資訊的平台，因此由金管會委託其一併受理募集銷售案件的申請，在行政效率與資訊整合上具有一致性。\n\n(B)證券投資信託暨顧問商業同業公會（SITCA）雖然在境外基金領域也扮演自律規範、發布問答集等角色，但並非法定受託受理申請案件的機構；(D)證交所主要負責集中交易市場業務，與境外基金募集銷售申請無關；(C)「不得委託其他單位受理」則與法條明文允許委託的規定相反。"}, {"id": "02921aec6363", "head": "證券商辦理融資融券，其淨值應達新臺幣多少元？", "opts": [["A", "3億"], ["B", "5億"], ["C", "2億"], ["D", "10億\n\n答案為 (C) 2億。"]], "ans": "C", "tag": "信用交易（融資融券）與借券", "srcTxt": "114年第2次 法規筆記　第8題", "ex": "根據《證券商辦理有價證券買賣融資融券管理辦法》第3條規定，證券商若要申請自行辦理有價證券買賣的融資融券業務，其中一項基本財務門檻就是：最近期經會計師查核簽證之財務報告淨值須達新臺幣2億元以上。\n\n這項淨值要求的用意在於確保證券商本身具備足夠的財務實力與風險承擔能力。融資融券本質上是證券商用自有資金或轉融通資金借給投資人操作槓桿交易（融資買進、融券賣出），一旦市場出現劇烈波動或大量投資人違約交割，證券商必須有足夠的資本緩衝去吸收這些風險損失，否則容易引發連鎖性的信用風險，甚至波及整個市場的結算安全。因此主管機關（金管會）透過設定最低淨值門檻，把不具備足夠資本實力的證券商排除在這項高風險業務之外，屬於一種事前的資格審查機制。\n\n值得注意的是，法規也保留彈性，主管機關得視國內經濟與金融情況調整此門檻，並非一成不變的固定數字，但目前現行規定就是2億元。(A)3億、(B)5億、(D)10億都是常見的干擾金額，容易與其他證券商業務（例如承銷業務、自營商業務等）各自不同的資本額或淨值門檻搞混，但融資融券業務明確規定的門檻就是2億元。"}, {"id": "6f1cdfaa4b71", "head": "下列何者不得為證券商辦理有價證券出借業務之借券之費率(年利率)？", "opts": [["A", "3.5%"], ["B", "5%"], ["C", "18%"], ["D", "以上皆可以"]], "ans": "C", "tag": "信用交易（融資融券）與借券", "srcTxt": "114年第2次 法規筆記　第9題", "ex": "正確答案為 (C) 18%，圖片上的勾選標示是對的。\n\n依台灣證券交易所「有價證券借貸辦法」規定，借券費率是有上限的：\n\n- 定價交易：採固定費率，目前為年利率 3.5%（(A) 選項）。\n- 競價交易／議借交易：由借貸雙方自行申報或協議費率，但最高不得超過年利率 16%。\n\n因此 (A) 3.5%、(B) 5% 都落在合法範圍內（3.5% 是固定費率、5% 低於 16% 上限），可以作為借券費率；而 (C) 18% 已超過 16% 的法定上限，屬於不得使用的費率，所以答案選 (C)。(D)「以上皆可以」自然也不成立，因為 18% 已違規。\n\n常見誤區：容易誤以為費率是雙方自由議定、沒有上限，而忽略了法規對議借/競價交易明訂「最高不得超過年利率16%」這條硬性限制。\n\nSources: [台灣證券交易所 SBL 問答集](https://www.twse.com.tw/zh/products/sbl/qa.html)"}, {"id": "8c3466eafa09", "head": "上市上櫃公司董事、監察人、經理人或持有公司股份超過股份總額百分之十之股東，於向主管機關申報轉讓之日起幾日後，方能於集中交易市場或證券商營業處所將所持有之股票出售？", "opts": [["A", "15日"], ["B", "3日"], ["C", "5日"], ["D", "10日"]], "ans": "B", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "114年第2次 法規筆記　第10題", "ex": "正確答案為 (B) 3日，圖片標示正確。\n\n依《證券交易法》第22條之2規定，公司內部人（董事、監察人、經理人，以及持股超過發行股份總額10%的大股東）欲轉讓其持股，除少量轉讓（每次未超過一定股數，得免申報）外，超過一定數量者必須先向主管機關申報，主要有兩種轉讓方式：\n\n- 在集中交易市場或證券商營業處所（公開市場）出售：須自申報之日起滿3日後才能開始賣出。\n- 進行櫃買中心以外之特定人洽商受讓（私下轉讓）：則是在申報後滿3日內即可完成，程序略有不同。\n\n題目問的是「於集中交易市場或證券商營業處所出售」，適用的是前者，因此答案是 3日，目的在讓市場有時間消化這項內部人申報轉讓的資訊，避免內部人利用資訊優勢立即出貨、損及一般投資人權益。\n\n常見誤區：容易把「15日」的申報前置期（例如某些私募或公開收購相關規定）或其他天數規定混淆進來，但本題問的是「申報後、公開市場賣出前」的等待期，正確規定就是3日。"}, {"id": "6ea73db35193", "head": "依「公開發行公司出席股東會使用委託書規則」之規定，非屬徵求委託書之受託代理人，除股務代理機構外，所受委託之人數不得超過：", "opts": [["A", "30人"], ["B", "99人"], ["C", "20人"], ["D", "10人"]], "ans": "A", "tag": "委託書徵求", "srcTxt": "114年第2次 法規筆記　第11題", "ex": "正確答案為 (A) 30人，圖片標示正確。\n\n依《公開發行公司出席股東會使用委託書規則》規定，委託書的取得分為兩種型態：\n\n- 徵求委託書：公開對外徵求，受託人須依規定辦理徵求程序（例如委任信託事業或股務代理機構辦理徵求）。\n- 非屬徵求之受託代理（即單純受一般股東個別委託，不涉及公開徵求行為）：為避免少數人透過大量受託委託書、集中掌控表決權而規避徵求委託書應遵守的公開、資訊揭露等規範，法規特別限制：除股務代理機構外，受託代理人受託之人數不得超過30人。\n\n這個「30人」上限的立法目的，就是要防止有心人士以「非徵求」名義規避徵求委託書應負擔的資訊揭露與程序義務，變相大量吸收委託書、操控股東會表決結果。\n\n常見誤區：容易與其他委託書相關數字混淆，例如「一人受託代理之股數不得超過已發行股份總額表決權之3%」是另一條限制受託股數比例的規定，跟這裡限制「受託人數上限30人」是不同的規範重點，答題時要分清楚是限制「人數」還是限制「股數比例」。"}, {"id": "78daca0f1407", "head": "設置獨立董事之公司，董事會設有常務董事者，常務董事中獨立董事人數：", "opts": [["A", "無任何限制"], ["B", "不得少於一人，且不得少於常務董事席次五分之一"], ["C", "不得少於常務董事席次二分之一"], ["D", "常務董事由獨立董事充任\n\n答案為 (B) 不得少於一人，且不得少於常務董事席次五分之一。"]], "ans": "B", "tag": "公司治理、獨立董事與審計委員會", "srcTxt": "114年第3次 法規筆記　第1題", "ex": "根據《公開發行公司獨立董事設置及應遵循事項辦法》第8條明文規定：「依本法設置獨立董事之公司，董事會設有常務董事者，常務董事中獨立董事人數不得少於一人，且不得少於常務董事席次五分之一。」這是一條「雙重下限」的規定——同時要求「至少1人」和「至少占常務董事席次1/5」，兩個條件都要滿足，取其中較嚴格者為準。\n\n這項規定的用意在於：常務董事會通常是公司實際處理日常重大經營決策、開會頻率遠高於董事會全體的核心決策小組，如果獨立董事只出現在董事會、卻完全被排除在常務董事會之外，那麼獨立董事在董事會設立所欲達成的「監督管理階層、制衡大股東、強化公司治理」的功能就會被架空、形同虛設。因此法規要求即使公司設有常務董事會這種更精簡的決策層級，獨立董事的聲音與監督角色也必須被保留在這個核心圈子裡，不能被邊緣化。\n\n(A)「無任何限制」明顯與法規要求相反，這正是常見的誤答陷阱——如果沒有下限規定，公司大股東理論上可以在組成常務董事會時完全排除獨立董事，架空獨立董事制度。(C)「不得少於常務董事席次二分之一」門檻設得過高，並非法規實際要求（法規只要求最低五分之一）。(D)「常務董事由獨立董事充任」則是完全曲解了規定——法規只要求常務董事「中有」一定比例獨立董事，並非要求常務董事「全部由」獨立董事擔任。"}, {"id": "5f1ee65503aa", "head": "下列何者敘述不符合興櫃股票交易制度？", "opts": [["A", "興櫃股票交易雙方至少必有一方為該股票之推薦證券商"], ["B", "興櫃股票與上櫃股票採相同的交易機制成交"], ["C", "投資人之間無法相互成交興櫃股票"], ["D", "興櫃股票交易價格沒有漲跌幅的限制\n\n答案為 (B) 興櫃股票與上櫃股票採相同的交易機制成交，這句話是錯誤敘述（也就是「不符合」實際制度的選項）。"]], "ans": "B", "tag": "交易制度（競價、漲跌幅、零股、盤後）", "srcTxt": "114年第3次 法規筆記　第2題", "ex": "興櫃股票和上櫃股票雖然都是在證券商營業處所買賣的有價證券，但兩者的交易機制其實完全不同，這正是本題的考點：\n\n上櫃股票採取的是類似上市股票的集中市場競價撮合機制，投資人下單後由電腦系統依價格優先、時間優先原則自動配對成交，且設有每日10%的漲跌幅限制。\n\n興櫃股票則採取議價交易方式，而非集中撮合。因為興櫃公司通常還沒有像上市上櫃公司那麼長的公開資訊揭露歷史，市場成熟度較低、資訊透明度相對不足，所以制度設計上要求每一檔興櫃股票至少要有2家以上的「推薦證券商」，交易時買賣雙方至少必須有一方是該股票的推薦證券商，由推薦證券商參與議價、扮演造市與價格發現的角色，一般投資人彼此之間無法直接相互成交，必須透過推薦證券商作為交易對手或中介。此外，興櫃市場也沒有漲跌幅限制，所以股價一天之內波動可能非常劇烈。\n\n所以(A)(C)(D)三項描述的都是興櫃制度的真實特徵，唯獨(B)「興櫃股票與上櫃股票採相同的交易機制成交」是錯的——興櫃是議價制，上櫃是集中競價制，兩者機制並不相同，這正是題目要考生辨識出來的「不符合」選項。"}, {"id": "24bd58094a95", "head": "某公司以總括申報發行新股，以下敘述何者不正確？", "opts": [["A", "只能在預定發行之期間內追補發行新股"], ["B", "預定發行期間內追補發行新股最多3次"], ["C", "應於發行新股總括申報書載明預定發行期間"], ["D", "追補發行新股應檢具公開說明書\n\n答案為 (B) 預定發行期間內追補發行新股最多3次，這句話是錯誤敘述（不正確）。"]], "ans": "B", "tag": "募集發行與公開說明書", "srcTxt": "114年第3次 法規筆記　第3題", "ex": "這題考的是《發行人募集與發行有價證券處理準則》第19-1條至19-3條對「總括申報發行新股」制度的規定。總括申報制度讓發行公司可以「一次申報、分次（追補）發行」新股，不必每次發行都重新走一次完整的申報生效程序，提升籌資效率。逐項檢視：\n\n(A) 只能在預定發行之期間內追補發行新股——正確。第19-1條規定，發行人申報總括生效時就必須訂定「預定發行期間」（自申報生效日起不得超過2年），而第19-3條也明訂「預定發行期間屆滿」是總括申報「終止」的事由之一，代表一旦超過這個期間，就不能再依這次總括申報追補發行新股，必須在期間內完成。\n\n(B) 預定發行期間內追補發行新股最多3次——錯誤，就是本題答案。查遍第19-1、19-2、19-3條的規定，法規只對「期間」設有限制（不得超過2年、追補須於評估總結意見出具日起30日內辦理、3個月內收足股款等），完全沒有針對追補發行的「次數」設下如「最多3次」這樣的量化上限。只要在預定發行期間內、且預定總股數尚未發行完畢，發行人理論上可以視資金需求分批多次追補發行，並沒有次數限制。這正是總括申報制度設計的彈性所在——讓公司能依市場時機與資金需求，靈活分批籌資，如果限制次數反而違背這個制度精神。\n\n(C) 應於發行新股總括申報書載明預定發行期間——正確。第19-1條明文要求發行人應於申報時訂定並記載預定發行期間等事項。\n\n(D) 追補發行新股應檢具公開說明書——正確。第19-2條明訂，發行人於預定發行期間內追補發行新股時，應檢具公開說明書，並委請主辦證券承銷商及律師分別提出評估報告及法律意見書，確保每次追補發行時投資人仍能取得最新且充分的公開資訊。\n\n所以只有(B)「最多3次」是法規中查無依據、憑空杜撰的次數限制，屬於不正確的敘述。"}, {"id": "69beb75c00e6", "head": "董事為自己或他人與公司為買賣、借貸或其他法律行為時，由何者為公司之代表？", "opts": [["A", "股東"], ["B", "經理人"], ["C", "董事長"], ["D", "監察人\n\n答案為 (D) 監察人。"]], "ans": "D", "tag": "公司法：股東會與董事會", "srcTxt": "114年第3次 法規筆記　第4題", "ex": "這題考的是《公司法》第223條的核心規定：「董事為自己或他人與公司為買賣、借貸或其他法律行為時，由監察人為公司之代表。」\n\n這條規定的立法用意在於防止利益衝突（自我交易）。公司平常的對外法律行為，本來應該由董事長代表公司（依公司法第208條），但如果今天的交易對象「就是董事本人」（例如董事要把自己的房子賣給公司，或向公司借錢），若還是由董事長（董事會成員之一，甚至可能就是該董事本人）來代表公司簽約，就等於是「球員兼裁判」——同一批人既是交易的一方、又代表公司審核交易條件是否對公司有利，很容易出現董事犧牲公司利益、圖利自己的道德風險。\n\n因此法律特別排除董事長（或一般董事）的代表權，改由監察人跳出來代表公司進行該筆交易的審查與簽署。監察人是公司法制度中專責監督董事會執行業務、審查財務業務狀況的獨立機關，與董事之間存在制衡關係，由監察人代表公司與董事進行交易，才能確保交易條件是在利益迴避、客觀公正的情況下決定，保障公司及全體股東的權益。\n\n(A)股東、(B)經理人都不具有法定的公司對外代表權；(C)董事長雖然是公司一般情況下的法定代表人，但正因為本題情境是「董事本人」與公司交易，董事長本身就屬於董事會的一員、甚至有可能就是行為人本人，存在利益衝突，所以此時法律特別排除董事長的代表資格，改由監察人代表，這也是最容易讓考生誤選(C)的陷阱所在。"}, {"id": "cf935b4a32c3", "head": "依「股票上市或於證券商營業處所買賣公司薪資報酬委員會設置及行使職權辦法」規定，薪資報酬委員會成員由___決議委任之，其人數不得少於_人，其中一人為召集人。", "opts": [["A", "董事會，3"], ["B", "股東會，4"], ["C", "股東會，3"], ["D", "董事會，4\n\n答案為 (A) 董事會，3。"]], "ans": "A", "tag": "公司治理、獨立董事與審計委員會", "srcTxt": "114年第3次 法規筆記　第5題", "ex": "根據《股票上市或於證券商營業處所買賣公司薪資報酬委員會設置及行使職權辦法》的規定：「委員人數不得少於三人，由董事會決議委任之」，且委員中至少應有過半數委員為獨立董事，委員會的召集人及會議主席須由委員互推之獨立董事擔任，其中一人為召集人。\n\n之所以是由「董事會」而非「股東會」來決議委任薪資報酬委員會成員，是因為薪資報酬委員會本質上屬於董事會轄下的功能性委員會（類似審計委員會的性質），主要職責是審議董事、監察人及經理人的薪資報酬政策、制度、標準與結構，屬於公司治理架構中「董事會授權、專業分工」的一環，性質上與需要股東會決議的重大公司事項（如章程變更、董監選任、盈餘分配等）不同，因此法規明訂由董事會這個層級來決議委任委員，而非拉高到股東會層級，這樣才能保持薪酬治理機制的專業性與運作效率。\n\n至於人數門檻定為「不得少於3人」，是為了確保委員會有足夠的成員數量進行合議、避免少數人（甚至單一人）主導薪酬決策而流於恣意或球員兼裁判，同時搭配「過半數須為獨立董事」的要求，強化薪酬審議的獨立性與客觀性，避免公司經營團隊球員兼裁判、自訂偏高薪酬的利益衝突問題。\n\n(B)(C)(D)都是常見的干擾組合，容易把「委任機關」誤記成股東會，或把人數門檻誤記成4人，但正確規定就是「董事會決議委任，人數不得少於3人」。"}, {"id": "936c8e1016a9", "head": "下列對海外存託憑證之敘述何者錯誤？", "opts": [["A", "是由外國銀行擔任保管人"], ["B", "發行買賣及交割均在國外的證券市場"], ["C", "是由國外存託機構所發行的一種可轉讓憑證"], ["D", "可表彰持有一定數量之本國公司之有價證券\n\n答案為 (A) 是由外國銀行擔任保管人，這句話是錯誤敘述。"]], "ans": "A", "tag": "交割結算、違約處理與集中保管", "srcTxt": "114年第3次 法規筆記　第6題", "ex": "這題考的是海外存託憑證（GDR, Global Depositary Receipt）架構中「存託機構」與「保管機構」的角色分工，這是最容易混淆的重點：\n\n海外存託憑證是台灣（本國）上市上櫃公司，將自己已發行的股票交付給國內的保管機構（保管銀行）保管，再由國外的存託機構（通常是國際知名的存託銀行）依保管股數，在海外證券市場發行、銷售存託憑證給當地投資人。也就是說：\n\n- 存託機構（Depositary）＝外國銀行：負責在海外發行、銷售這種可轉讓憑證，扮演的是「憑證發行者」角色，對應選項(C)「是由國外存託機構所發行的一種可轉讓憑證」——這是正確敘述。\n- 保管機構（Custodian）＝本國（台灣）銀行：負責在國內保管對應數量的標的公司股票，確保每一單位存託憑證背後都有等值的實體股票作為支撐，是「股票的實際保管者」，而非(A)所說的外國銀行。\n\n因此(A)「是由外國銀行擔任保管人」把「存託機構」和「保管機構」的角色搞反了——保管人（保管機構）應該是本國銀行，外國銀行扮演的是存託機構的角色，兩者職能與所在地完全不同，不能混為一談，這正是本題設計的陷阱所在，答案是(A)。\n\n(B)「發行買賣及交割均在國外的證券市場」正確，因為海外存託憑證本質上就是為了讓海外投資人能在當地市場直接買賣交易，不必跨境操作台灣股票。(D)「可表彰持有一定數量之本國公司之有價證券」也正確，這正是存託憑證的核心功能——每單位憑證代表對應一定數量的本國公司股票所有權。"}, {"id": "2170bca72687", "head": "屬科技事業之發行公司，申請股票上櫃時，其持有已發行股份總數下列何項之比例者，應按規定辦理集中保管及屆期領回？", "opts": [["A", "1%以上之股東"], ["B", "3%以上之股東"], ["C", "5%以上之股東"], ["D", "10%以上之股東\n\n答案為 (C) 5%以上之股東。"]], "ans": "C", "tag": "交割結算、違約處理與集中保管", "srcTxt": "114年第3次 法規筆記　第7題", "ex": "這題考的是「科技事業」申請股票上市／上櫃時，對內部人（董事及大股東）股票集中保管的特殊規定。依審查準則規定，屬科技事業性質的發行公司，其董事、持股超過已發行股份總額5%之股東（另外還包括以專利權或專門技術出資而在公司任職、持股達申請上市（櫃）時已發行股份總數千分之五以上或10萬股以上的股東），都應按規定辦理股票集中保管，並在一定期間屆滿後才能分批領回。\n\n這項規定之所以特別針對「科技事業」設定較低的5%門檻（比一般公司更嚴格），主要考量是：科技類公司在草創初期往往仰賴少數技術創辦人、研發核心團隊持有大量股份或技術股，這些人對公司未來營運與股價的影響力極大。如果這些關鍵大股東在公司剛掛牌、資訊揭露歷史尚淺、市場對公司了解有限的階段就大量出脫持股，容易對股價造成劇烈衝擊，也可能讓外部投資人對公司經營穩定性產生疑慮。因此透過集中保管制度，強制這些持股達5%以上的大股東把股票交付保管一段期間、且採分階段（每半年領回四分之一，2年後才能全數領回）的方式逐步解禁，用意在於穩定股價、避免內部人於上市初期大量出售持股套現、以及讓市場有充分時間消化與評估公司價值。\n\n相較之下，一般（非科技事業）公司的集中保管門檻通常設在10%、且領回期限也較寬鬆（6個月後可領回二分之一、滿1年後全數領回），這也是本題選項(D)「10%以上之股東」容易讓考生誤選的原因——那其實是「一般事業」的門檻，而非「科技事業」的較嚴格標準。"}, {"id": "81a9f402bd1f", "head": "上市公司發行新股擬採總括申報，應同時符合多項條件，其中申報時市值門檻為何？", "opts": [["A", "應達新臺幣十億元以上"], ["B", "應達新臺幣二十億元以上"], ["C", "應達新臺幣三十億元以上"], ["D", "應達新臺幣五十億元以上"]], "ans": "B", "tag": "募集發行與公開說明書", "srcTxt": "115年第1次 法規筆記　第1題", "ex": "本題考的是「發行人募集與發行有價證券處理準則」中，普通公司債／股票採「總括申報 (shelf registration)」制度的資格條件。\n\n總括申報制度是為了讓體質健全、資訊透明度高的公司，可以「一次申報、分次發行」，不必每次募資都重新走完整審查程序，藉此縮短籌資時程、提高資本市場效率。因此法規設下多項門檻，確保只有財務體質與市場流通性夠好的公司才能適用，主要包括：\n\n- 已依規定辦理公開發行，且股票（或債券）已在證券交易所上市或於證券商營業處所買賣（即為上市或上櫃公司）。\n- 最近一年內財務報告未經會計師出具無保留意見以外之意見，且無重大違反相關法令、對股東權益有重大影響之情事。\n- 申報日前一段時間之市值須達新臺幣二十億元以上——這是用來篩選具一定規模、股票流通性較佳的公司，避免小型、資訊揭露相對薄弱的公司也適用簡化程序。\n\n因為題目給的門檻選項中，唯一與法規規定相符的市值標準是新臺幣二十億元以上，所以"}, {"id": "a58d8b74615f", "head": "依「公開發行公司出席股東會使用委託書規則」規定，持有已發行股份總數10%以上之股東，且繼續持有多少期間以上，得委託信託事業擔任委託書徵求人？", "opts": [["A", "半年"], ["B", "一年"], ["C", "二年"], ["D", "三年"]], "ans": "B", "tag": "委託書徵求", "srcTxt": "115年第1次 法規筆記　第2題", "ex": "依該規則規定，持有公司已發行股份總數10%以上之股東，且其持股期間須繼續持有一年以上，始得委託信託事業或股務代理機構擔任委託書徵求人代為徵求股東會委託書。此一「一年」之最低持股期間要求，目的在確保徵求人具備一定之股東身分穩定性與對公司經營之持續關注，避免短期投機性持股者濫用徵求機制影響股東會決議。"}, {"id": "dcc05ad8896c", "head": "證券投資信託事業募集之基金，投資於任一公司所發行無擔保公司債之總額，不得超過該公司所發行無擔保公司債總額之多少？", "opts": [["A", "5%"], ["B", "15%"], ["C", "10%"], ["D", "3%"]], "ans": "C", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "115年第1次 法規筆記　第3題", "ex": "正確答案為 (C) 10%，圖片上的標示是對的。\n\n依據《證券投資信託基金管理辦法》第10條的規定：「每一基金投資於任一公司所發行無擔保公司債之總額，不得超過該公司所發行無擔保公司債總額之百分之十。」\n\n這項規定的用意是分散風險——避免單一基金過度集中持有同一家公司發行的無擔保公司債，一旦該公司出現信用問題，基金曝險過大會影響投資人權益。這類「投資於任一標的不得超過該標的發行總額之一定比例」的限制，在證券投資信託法規中很常見（例如對股票、金融債券等也都有類似的集中度上限），考試時可以把「10%」這個數字跟「無擔保公司債」直接連結記憶。"}, {"id": "79e6ca7d8b2f", "head": "證券投資信託事業所經理之私募證券投資信託基金，基金保管機構得申請開立信用帳戶，其融資融券額度不得超過基金規模多少比例？", "opts": [["A", "100%"], ["B", "75%"], ["C", "50%"], ["D", "25%"]], "ans": "C", "tag": "私募", "srcTxt": "115年第1次 法規筆記　第4題", "ex": "正確答案為 (C) 50%。\n\n依據投信投顧公會《私募證券投資信託基金問答集》規定：私募基金開立信用帳戶後，融資、融券之額度「各不得超過基金規模 50%」，且融券額度應與借券賣出合併計算，同樣不得超過基金規模 50%。投信事業必須在信託契約中明訂這些交易的上限額度，並在投資說明書中揭露相關風險監控機制。\n\n這項規定的邏輯跟前一題（無擔保公司債投資上限 10%）類似，都是透過設定「佔基金規模的上限比例」來控管槓桿與集中度風險——差別在於，公司債投資限制是為了避免過度集中在單一發行人身上，而信用交易額度限制則是為了控管基金整體的槓桿曝險程度，不讓融資融券把基金的實際風險部位放大超過可承受範圍。"}, {"id": "7ed049564b0b", "head": "有關公開發行公司視訊股東會，以下敘述何者有誤？", "opts": [["A", "視訊會議相關事務應委外辦理"], ["B", "指公司不召開實體股東會，僅以視訊方式召開，股東僅得以視訊方式參與股東會"], ["C", "股東會召集通知應載明對以視訊方式參與股東會有困難之股東所提供之適當替代措施"], ["D", "應經董事會過半數出席及出席董事過半數同意之決議行之"]], "ans": "D", "tag": "公司法：股東會與董事會", "srcTxt": "115年第1次 法規筆記　第5題", "ex": "正確答案為 (D)，圖片標示無誤，(D) 是敘述有誤的選項。\n\n依《公開發行股票公司股務處理準則》第44-9條第3項規定，公司召開視訊股東會，應經董事會「三分之二以上董事出席，出席董事過半數同意」之決議行之——門檻是「三分之二以上出席」，而不是選項(D)所說的「過半數出席」，出席人數的門檻被講輕了，所以(D)有誤。\n\n其餘選項都對得上法條原文： (A) 對應第44-10條第1項：「公司召開股東會視訊會議，其視訊會議相關事務應委外辦理」（受託對象限代辦股務機構或證券集中保管事業）。 (B) 對應第44-9條第1項第2款「視訊股東會」的定義，就是純視訊股東會（不開實體會場，股東只能用視訊參與）。 (C) 對應第44-21條第3款，召集通知須載明對視訊參與有困難股東的替代措施（至少要提供連線設備及必要協助）。\n\n這題的出題邏輯很典型——把某個門檻數字（三分之二 vs. 過半數）偷偷調低，其他敘述照抄法條原文讓你以為都對，藉此測驗有沒有記熟具體的門檻數字。"}, {"id": "be9a06a35f28", "head": "證券商得為自行買賣特定外國債券之買賣斷交易，以下敘述何者錯誤？", "opts": [["A", "以外幣計價之外國政府相關債券、金融債券及公司債為限"], ["B", "得為附條件交易"], ["C", "應以固定利率或正浮動利率方式計息"], ["D", "不得包括具股權性質之債券"]], "ans": "B", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "115年第1次 法規筆記　第6題", "ex": "正確答案為 (B)，圖片標示無誤，(B) 是錯誤的敘述。\n\n依金管會令釋（金管證券字第1140383475號）規定，證券商得為自行買賣特定外國債券之買賣斷交易，但不得為附條件交易——也就是只能做「買斷/賣斷」的一次性所有權移轉交易，不能做附買回、附賣回這種帶約定條件的交易。選項(B)把規定講反了，所以是錯的。\n\n其餘三個選項都對得上規定： (A) 標的限於「以外幣計價之外國政府相關債券、金融債券及公司債」，沒錯。 (C) 計息方式須為「固定利率或正浮動利率」，沒錯（用意是排除利率結構複雜、風險難評估的浮動利率設計）。 (D) 明確排除結構型債券、具股權性質之債券、次順位債券、TLAC債券、MBS、CDO及涉陸股市場之債券，所以「不得包括具股權性質之債券」正確。\n\n這題的核心分辨點在於：買賣斷交易（outright transaction）跟附條件交易（repo/reverse repo）是兩種本質不同的交易型態，主管機關限定證券商只能做前者，用意是避免槓桿與交易對手風險擴大，讓證券商在外國債券業務上維持較單純、風險可控的曝險方式。"}, {"id": "5e5c178f85cb", "head": "證券商每年度申請設置簡易分支機構、分支機構變更為簡易分支機構，是否有家數之限制？", "opts": [["A", "有限制，每年申請設置簡易分支機構併計分支機構變更為簡易分支機構不得超過3家"], ["B", "無限制"], ["C", "有限制，每年申請設置簡易分支機構、分支機構變更為簡易分支機構各最多3家"], ["D", "有限制，每年申請設置簡易分支機構、分支機構變更為簡易分支機構各最多1家"]], "ans": "A", "tag": "證券商設立、財務業務與管理規則", "srcTxt": "115年第1次 法規筆記　第7題", "ex": "正確答案為 (A)，圖片標示無誤。\n\n依《證券商設置標準》第24條之2規定：「證券商每年度申請設置簡易分支機構併計分支機構變更為簡易分支機構之總家數，不得超過三家。」\n\n這題的關鍵字是「併計」——也就是「新設簡易分支機構」跟「既有分支機構變更為簡易分支機構」這兩種情形要合併加總計算，一年總數上限是3家，而不是像(C)那樣兩種情形「各自」可以有3家（那樣一年最多可能開到6家，超出規定）。(D)則是把上限數字寫錯，也不對。(B)無限制更是明顯錯誤，法規本身就是為了控管證券商快速展店的規模才訂出這個上限。\n\n這種「合併計算 vs. 分別計算」的陷阱，是法規考題常見的出題手法，讀的時候要特別留意條文裡「併計」「合計」這類字眼。"}, {"id": "23d6e59e4bc5", "head": "證券商兼營信託業務應申請兼營全權委託投資業務門檻金額為何？", "opts": [["A", "500萬元"], ["B", "1,000萬元"], ["C", "1,500萬元"], ["D", "2,000萬元\n\n正確答案為 (C) 新臺幣1,500萬元以上，圖片標示無誤。\n\n依《證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法》第2條第5項規定：「信託業單獨管理運用或集合管理運用之信託財產，涉及運用於證券交易法第6條之有價證券達新臺幣一千五百萬元以上者」，應申請兼營全權委託投資業務。\n\n這裡的關鍵是要分清楚兩種不同情境、兩個不同門檻，題目考的正是這個分辨：\n\n- 證券商「兼營信託業務」（本題情境）：信託財產運用於有價證券達 1,500萬元以上 → 對應第2條第5項。\n- 投信、投顧或證券經紀商「以信託方式經營全權委託」（另一種情境，本質是拿信託架構做全權委託帳戶，而非兼營信託本業）：原始信託財產達 1,000萬元以上 → 對應第2條之1第1項。\n\n兩者用詞很像、金額不同，很容易混淆，我一開始查資料時也先撈到後者的1,000萬元，後來核對條文全文才確認題目問的是前者。選(B) 1,000萬元是誤把「以信託方式經營全權委託」的門檻套用到「兼營信託業務」情境上了。"]], "ans": "C", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "115年第1次 法規筆記　第8題", "ex": ""}, {"id": "9efdcfd304a6", "head": "有關「公司法」與「證券交易法」之敘述，下列何者正確？", "opts": [["A", "公司法乃證券交易法之特別法"], ["B", "證券交易法僅限規範上市上櫃公司"], ["C", "有價證券之募集發行與買賣事項，優先適用證券交易法"], ["D", "公司法僅規範未公開發行公司\n\n正確答案為 (C)，圖片標示無誤。\n\n依《證券交易法》第2條：「有價證券之募集、發行、私募及買賣，其管理、監督依本法之規定；本法未規定者，適用公司法及其他有關法律之規定。」這條文本身就是「特別法優於普通法」原則的明文化。\n\n逐一檢視其他選項： (A) 講反了——是「證券交易法」相對於「公司法」而言是特別法（規範證券交易這個特定領域），而不是公司法是證交法的特別法。 (B) 錯，證交法規範對象不限於上市上櫃公司，公開發行公司（未上市上櫃者）也適用證交法相關規定。 (D) 錯，公司法是規範所有股份有限公司（含公開發行與未公開發行）組織與運作的基本法，不是只管未公開發行公司。\n\n這題的核心邏輯是「特別法優於普通法」（lex specialis derogat legi generali）：公司法是規範公司組織運作的一般性法律，證交法則是針對「有價證券募集發行與買賣」這個特定領域訂立的特別規範，當兩者都有規定時，證交法優先適用；證交法沒規定的部分，才回頭適用公司法補充。"]], "ans": "C", "tag": "私募", "srcTxt": "115年第1次 法規筆記　第10題", "ex": ""}]}}], "subjects": ["投資學", "財務分析", "法規"]};
// 真題／模擬卷固定 50 題／科，時間依科目基準（投資學 50／法規 60／財務分析 90 分鐘）；
// 筆記練習題庫依科目合併、題數不固定（可能遠大於 50），時間額度依同一基準等比放大。
const SUBJ_BASE_SEC = {'投資學': 50 * 60, '法規': 60 * 60, '財務分析': 90 * 60};
function baseSecOf(s) { return SUBJ_BASE_SEC[s] || 60 * 60; }
function secBudget(p, s) {
  const base = baseSecOf(s);
  const n = qsOf(p, s).length;
  return Math.max(base, Math.ceil(n / 50) * base);
}

const S = {
  paper: DATA.papers[0].id,
  subj: DATA.subjects[0],
  order: {},
  ans: {},
  left: {},
  started: {},
  done: {},
  view: 'exam'
};
const key = (p, s) => p + '|' + s;
const paperOf = id => DATA.papers.find(p => p.id === id);
const qsOf = (p, s) => paperOf(p).subjects[s];
// 錯題本用：跨考卷依 qid 找到題目本體（拿解析用，不受目前 S.paper 影響）。
function findQuestion(qid) {
  for (const p of DATA.papers) {
    for (const s of DATA.subjects) {
      const hit = qsOf(p.id, s).find(function (q) { return q.id === qid; });
      if (hit) { return hit; }
    }
  }
  return null;
}

function initState() {
  for (const p of DATA.papers) {
    for (const s of DATA.subjects) {
      const k = key(p.id, s);
      S.ans[k] = {};
      S.left[k] = secBudget(p.id, s);
      S.started[k] = false;
      shuffleSubject(p.id, s);
    }
  }
}

function shuffleSubject(p, s) {
  const n = qsOf(p, s).length;
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  S.order[key(p, s)] = a;
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}

function mmss(sec) {
  sec = Math.max(0, sec);
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' +
         String(sec % 60).padStart(2, '0');
}

// 深色模式：純手動切換，預設亮色，不跟隨系統設定；選擇存 localStorage，
// 下次開啟直接沿用。<head> 裡已有一段先行腳本在畫面繪製前套用過一次，
// 這裡的 applyTheme() 負責之後切換時同步更新圖示與 aria 文字。
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('btnTheme');
  if (btn) {
    btn.textContent = dark ? '☀️' : '🌙';
    const label = dark ? '切換為亮色模式' : '切換為深色模式';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
}

function initTheme() {
  let dark = false;
  try { dark = localStorage.getItem('gme_theme') === 'dark'; } catch (e) {}
  applyTheme(dark);
}

document.getElementById('btnTheme').onclick = function () {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  applyTheme(dark);
  try { localStorage.setItem('gme_theme', dark ? 'dark' : 'light'); } catch (e) {}
};

function renderQuiz() {
  if (S.done[key(S.paper, S.subj)]) { renderResult(); return; }
  document.getElementById('result').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');

             (picked === o[0] ? ' checked' : '') + (locked ? ' disabled' : '') +
             ' data-qi="' + qi + '"><span class="L">(' + o[0] + ')</span>' + esc(o[1]) + '</label>';
    }).join('');

           '<span class="qt">' + esc(q.head) +
           '<div class="tagline">' + esc(q.tag) + '</div></span></div>' + opts + '</div>';
  }).join('');

function updateProg() {
  const k = key(S.paper, S.subj);
  const done = Object.keys(S.ans[k]).length;
  const tot = qsOf(S.paper, S.subj).length;
  let all = 0, allTot = 0;
  for (const s of DATA.subjects) {
    all += Object.keys(S.ans[key(S.paper, s)]).length;
    allTot += qsOf(S.paper, s).length;
  }
  document.getElementById('prog').textContent =
    '本科 ' + done + '/' + tot + '　全卷 ' + all + '/' + allTot +
    (S.done[k] ? '　（本科已交卷）'
      : !S.started[k] ? '　（本科尚未開始）'
      : S.left[k] <= 0 ? '　（本科時間已到，已鎖定）' : '');

  const c = document.getElementById('clock');
  c.textContent = mmss(S.left[k]);
  c.className = 'clock' + (S.left[k] <= 0 ? ' over' : (S.left[k] <= 300 ? ' warn' : ''));
}

function grade(subject) {
  const k = key(S.paper, subject);
  const qs = qsOf(S.paper, subject);
  const byTag = {};
  let right = 0, blank = 0;
  qs.forEach(function (q, qi) {
    const a = S.ans[k][qi];
    const ok = a === q.ans;
    if (!a) { blank++; } else if (ok) { right++; }
    const t = byTag[q.tag] || (byTag[q.tag] = {name: q.tag, right: 0, tot: 0});
    t.tot++;
    if (ok) { t.right++; }
  });
  const res = {right: right, blank: blank, tot: qs.length,
               score: qs.length ? Math.round(right / qs.length * 100) : null,
               byTag: byTag};
  S.done[k] = res;
  postAttempt(subject, res);
  return res;
}

// ---------- 紀錄上傳（離線先排隊，下次連線補傳）----------
const QKEY = 'gaoye_pending_attempts';

function loadQueue() {
  try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {}
}
function setSync(msg, bad) {
  const el = document.getElementById('sync');
  if (el) { el.textContent = msg; el.className = 'sync' + (bad ? ' bad' : ''); }
}

function buildPayload(subject, res) {
  const p = paperOf(S.paper);
  const k = key(S.paper, subject);
  const answers = [];
  const subjects = {};
  if (res.tot) {   // 重練卷可能某科 0 題，別送假的 0 分上去
    subjects[subject] = {score: res.score, right: res.right, blank: res.blank, tot: res.tot,
                         secs: secBudget(S.paper, subject) - S.left[k]};
    qsOf(S.paper, subject).forEach(function (q, qi) {
      const a = S.ans[k][qi] || null;
      answers.push({subject: subject, qid: q.id, head: q.head, tag: q.tag,
                    chosen: a, correct: q.ans, ok: a === q.ans});
    });
  }
  return {paper: S.paper, paperName: p.name, subjects: subjects, answers: answers};
}

function send(payload) {
  return fetch('api/attempt', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(function (r) {
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.json();
  });
}

function postAttempt(subject, res) {
  const payload = buildPayload(subject, res);
  setSync('紀錄上傳中…');
  send(payload).then(function () {
    setSync('紀錄已儲存');
    flushQueue();
  }).catch(function () {
    const q = loadQueue();
    q.push(payload);
    saveQueue(q);
    setSync('離線：已暫存本機，連線後自動補傳（待傳 ' + q.length + ' 份）', true);
  });
}

function flushQueue() {
  const q = loadQueue();
  if (!q.length) { return Promise.resolve(); }
  return send(q[0]).then(function () {
    const rest = loadQueue().slice(1);
    saveQueue(rest);
    if (rest.length) { return flushQueue(); }
    setSync('離線暫存的紀錄已補傳完成');
  }).catch(function () {});
}

function renderResult() {

      return '<div class="res"><div class="nm">' + esc(s) + '</div>' +
             '<div class="sc" style="color:#aaa">—</div>' +
             '<div class="vd">本卷無此科題目</div></div>';
    }

    const r = S.done[key(S.paper, s)];
    if (!r) {
      allGraded = false;

             '<div class="sc" style="color:#aaa">—</div>' +
