", "head": "以下風險來源中，哪一項與通貨膨脹最直接相關？", "opts": [["A", "利率風險"], ["B", "流動性風險"], ["C", "購買力風險"], ["D", "違約風險"]], "ans": "C", "tag": "總體經濟、貨幣政策與利率", "srcTxt": "115年第2次 第34題（本屆原題）", "ex": "購買力風險是指通貨膨脹侵蝕投資實質報酬的風險，與物價上漲直接相關，屬於通膨風險的另一種說法。"}, {"id": "43a1781fcc6e", "head": "由無風險利率和風險溢酬組成，描述預期報酬率和多個因子存在線性關係的理論是：", "opts": [["A", "套利定價理論(Arbitrage Pricing Theory)"], ["B", "投資組合理論(Portfolio Theory)"], ["C", "資本資產定價模式(Capital Asset Pricing Model)"], ["D", "效率市場理論(Efficient Market Theory)"]], "ans": "A", "tag": "市場效率假說與異常現象", "srcTxt": "115年第2次 第35題（本屆原題）", "ex": "以無風險利率加上多個風險因子溢酬所構成、描述預期報酬與多因子間線性關係的理論即為套利定價理論(APT)，區別於僅用單一市場因子的CAPM。"}, {"id": "cafcb231d2d9", "head": "下列何者的報酬率可用來檢定市場是否符合強式效率市場？", "opts": [["A", "公司董事長"], ["B", "公司大股東"], ["C", "基金經理人"], ["D", "選項(A)(B)(C)皆是"]], "ans": "D", "tag": "市場效率假說與異常現象", "srcTxt": "115年第2次 第36題（本屆原題）", "ex": "強式效率市場檢定須涵蓋所有掌握內部資訊者的報酬表現，董事長、大股東、基金經理人皆屬可能擁有資訊優勢者，故三者皆可作為檢定對象。"}, {"id": "50a1e4bdc540", "head": "使用反向策略可以獲得超額報酬的假設原因為：", "opts": [["A", "市場反應過度"], ["B", "市場反應不足"], ["C", "報酬不具可預測性"], ["D", "投資人的不理性行為是隨機的"]], "ans": "A", "tag": "市場效率假說與異常現象", "srcTxt": "115年第2次 第37題（本屆原題）", "ex": "反向策略之所以能獲得超額報酬，是建立在市場對資訊產生過度反應、股價偏離基本面後會回歸的假設上。"}, {"id": "48486d20f66d", "head": "在CAPM 模式中，若已知市場的預期報酬為18%，而甲股票的β值為0，無風險利率為6%，試 問該股票的預期報酬率為何？", "opts": [["A", "6%"], ["B", "12%"], ["C", "14%"], ["D", "16%"]], "ans": "A", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "115年第2次 第38題（本屆原題）", "ex": "CAPM：E(R)＝Rf＋β×(Rm－Rf)＝6%＋0×(18%－6%)＝6%，貝它為0代表股票報酬不受市場風險影響，只等於無風險利率。"}, {"id": "a9c010b0eadd", "head": "下列敘述何者為非？", "opts": [["A", "損失規避是指個體會避免損失，因為損失的痛苦程度大於同等金額利得所帶來的滿足程度"], ["B", "過度自信是指投資人高估自己的過去績效，因而不願意處理績效不佳的投資決策"], ["C", "可取性捷思(availability heuristic)是指容易令人聯想到的事件會讓人誤以為這個事件常常發生"], ["D", "小數法則(law of small numbers)是指人們誤以為小樣本下也能代表整體結果"]], "ans": "B", "tag": "行為財務學", "srcTxt": "115年第2次 第39題（本屆原題）", "ex": "過度自信主要是指投資人高估自己判斷的準確度而過度交易，敘述中「不願意處理績效不佳的投資決策」較接近處分效果（不願認賠）的定義，而非過度自信的核心定義，故此敘述有誤。"}, {"id": "daab972322f6", "head": "一般而言，何種股票型共同基金的分散風險的效果最大？", "opts": [["A", "大型股基金"], ["B ,000，X2 年 中曾支付3 元的普通股股利，請問永靖企業當天的本益比為多少？", "opts": [["A", "6"], ["B", "3.6"], ["C", "3"], ["D", "2.4"]], "ans": "A", "tag": "股東權益、股票股利與庫藏股", "srcTxt": "115年第2次 第20題（本屆原題）", "ex": "每股盈餘＝600,000÷100,000股＝6元；本益比＝市價36元÷EPS6元＝6倍。"}, {"id": "dd6cda2a9f53", "head": "民雄公司去年底財務報表上列有銷貨毛利6,000 萬元，營業費用1,000 萬元，營業外收入200 萬 元，營業外費用2,000 萬元，遞延所得稅1,000 萬元，所得稅費用500 萬元，則其稅後淨利為：", "opts": [["A", "2,700 萬元"], ["B", "1,700 萬元"], ["C", "2,300 萬元"], ["D", "3,200 萬元"]], "ans": "A", "tag": "所得稅與遞延所得稅", "srcTxt": "115年第2次 第21題（本屆原題）", "ex": "稅前淨利＝毛利6,000－營業費用1,000＋營業外收入200－營業外費用2,000＝3,200萬；稅後淨利＝3,200－所得稅費用500＝2,700萬。"}, {"id": "1d6bfe3ba9b1", "head": "如果甲資產平均報酬率為0.08，乙資產平均報酬率為0.14，則投資組合包括甲與乙資產各 50%，其組合平均報酬率為何？", "opts": [["A", "0.095"], ["B", "0.12"], ["C", "0.11"], ["D", "0.10"]], "ans": "C", "tag": "風險概念與要求報酬率", "srcTxt": "115年第2次 第22題（本屆原題）", "ex": "投資組合報酬率為個別資產報酬率之加權平均，50%×0.08＋50%×0.14＝0.11。"}, {"id": "c6ef4f3ede7e", "head": "在產品售價不變的情況下，若生產某商品的總固定成本與單位變動成本都下降，對其邊際貢獻率 與損益兩平銷貨收入有何影響？", "opts": [["A", "邊際貢獻率下降，損益兩平點上升"], ["B", "邊際貢獻率上升，損益兩平點下降"], ["C", "邊際貢獻率下降，損益兩平點下降"], ["D", "邊際貢獻率不變，損益兩平點上升"]], "ans": "B", "tag": "成本習性、損益兩平與營運槓桿", "srcTxt": "115年第2次 第23題（本屆原題）", "ex": "固定成本與單位變動成本同時下降，使單位邊際貢獻（售價－變動成本）上升、邊際貢獻率提高，且損益兩平點＝固定成本÷邊際貢獻率，分子減小分母變大，故兩平點下降。"}, {"id": "60830f876516", "head": "有關生產機器設備的重置支出問題，其決策目標為何？", "opts": [["A", "生產的未來成本極小化"], ["B", "生產的內部成本極小化"], ["C", "生產的收益極小化"], ["D", "生產成本的現值極小化"]], "ans": "D", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "115年第2次 第24題（本屆原題）", "ex": "重置設備決策在比較不同時點汰換方案時，應以未來各期成本折現後之現值極小化為目標，才能考量貨幣時間價值做正確比較。"}, {"id": "907499f8efad", "head": "下列何者會使得股票賣權(Put Option)的價值增加？", "opts": [["A", "標的股票價格增加"], ["B", "執行價格(Exercise Price)下降"], ["C", "標的股票的波動性減少"], ["D", "到期日變長"]], "ans": "D", "tag": "選擇權與期貨基本概念（跨科）", "srcTxt": "115年第2次 第25題（本屆原題）", "ex": "賣權為保護標的物下跌之權利，到期日拉長增加標的資產價格變動的機會與時間價值，使賣權價值上升；其餘選項（股價上漲、履約價下降、波動性減少）皆使賣權價值下降。"}, {"id": "3acda7297044", "head": "若甲股票報酬率與乙股票報酬率之共變數為0.5，則乙股票報酬率與甲股票報酬率之共變數為：", "opts": [["A", "資料不足，無法斷定"], ["B", "-0.5"], ["C", "大於0.5"], [" srcTxt": "曾出現 2 次：106-3、115-1　｜　本卷採用 115-1 版本　｜　⚠ 選項曾被改寫", "ex": "公開發行公司資金貸與他人前，須經公司董事會同意，不得僅由董事長或經理人逕行決定，以強化資金貸放的內部監督機制。"}, {"id": "433981bd69a0", "head": "證券商欲為證券投資信託事業特定資格之發起人，其所需之資格條件，下列何者為非？", "opts": [["A", "綜合經營證券承銷、自營及經紀業務滿三年之證券商"], ["B", "實收資本額達新臺幣八十億元以上"], ["C", "最近三年未曾因資金管理業務接受主管機關之處分"], ["D", "最近期經會計師查核簽證之財務報告，每股淨值不低於面額"]], "ans": "C", "tag": "證券投資信託及顧問法（投信投顧）", "srcTxt": "曾出現 1 次：115-2　｜　本卷採用 115-2 版本", "ex": "證券商欲擔任證券投資信託事業特定發起人，須符合承銷經紀自營滿三年、實收資本額達八十億元以上、每股淨值不低於面額等條件，「最近三年未曾因資金管理業務受處分」並非法定敘述用語，故此項為非。"}, {"id": "ce721effe56e", "head": "得為融資融券交易之上櫃股票經發行公司轉申請上市後，除了下列何種原因之外均可為融資融券的 標的？", "opts": [["A", "股價波動過度劇烈者"], ["B", "股權過度集中者"], ["C", "成交量過度異常者"], ["D", "選項(A)(B)(C)皆是 6"]], "ans": "B", "tag": "信用交易（融資融券）與借券", "srcTxt": "曾出現 4 次：106-3、107-1、107-4、113-1　｜　本卷採用 113-1 版本　｜　⚠ 選項曾被改寫", "ex": "上櫃股票轉上市後，除因股權過度集中原因外，原屬融資融券標的者仍可繼續作為信用交易標的；股價波動過度劇烈或成交量異常則不在此例外保留範圍內。"}]}}, {"id": "p_notes", "name": "筆記練習題庫", "note": "整理自個人讀書筆記（112–115 年各期，投資學/財務分析/法規三科依科目合併，不分期別），含完整詳解；正確性未經官方逐題覆核，若發現錯誤請修正筆記後重新匯入。", "subjects": {"投資學": [{"id": "3602292ba3f1", "head": "波浪理論認為在一個完整的多頭走勢中，應有幾個向上的漲升波與幾個向下的修正波所構成？", "opts": [["A", "5個向上的漲升波與2個向下的修正波"], ["B", "5個向上的漲升波與4個向下的修正波"], ["C", "5個向上的漲升波與3個向下的修正波"], ["D", "3個向上的漲升波與5個向下的修正波"]], "ans": "C", "tag": "技術分析", "srcTxt": "112年第1次 投資學筆記　第1題", "ex": "答案為 (C) 5個向上的漲升波與3個向下的修正波，與圖片標示一致。\n\n這是艾略特波浪理論（Elliott Wave Theory）的核心結構。一個完整的多頭市場循環由8個波所組成：前段是5個推動波（Impulse Wave，標記為1-2-3-4-5），方向與主趨勢一致，其中第1、3、5波是順勢上漲波，第2、4波是逆勢的小幅修正；後段接著是3個修正波（Corrective Wave，標記為A-B-C），方向與主趨勢相反，用來修正整個上漲循環。所以整體結構就是「5波上漲＋3波修正」，合計8個波，這也是波浪理論中最經典的「5-3結構」。\n\n其他選項為何錯： (A) 只有2個修正波，不符合A-B-C三波修正的完整結構。 (B) 4個修正波過多，不符合典型的3波（A-B-C）修正模式。 (D) 把推動波與修正波的波數顛倒了（3上5下），這其實比較接近空頭走勢或修正循環的概念，不是多頭走勢的推動結構。"}, {"id": "fa7ceae4158e", "head": "以財務比率評估企業之績效，哪一種較為全面？", "opts": [["A", "與同業在同一年度作比較"], ["B", "與本身過去歷史資料作比較"], ["C", "與同業作該比率之趨勢之分析比較"], ["D", "與整體市場之同一比率在同一年度作比較"]], "ans": "C", "tag": "財務報表與財務比率分析（跨科）", "srcTxt": "112年第1次 投資學筆記　第2題", "ex": "答案為 (C) 與同業作該比率之趨勢之分析比較，與圖片標示一致。\n\n財務比率分析常見的兩種基準是「橫斷面比較」（cross-sectional，即與同業或同期其他公司比）與「時間序列比較」（time-series，即與自己過去的歷史數據比）。這兩種方法各自都只反映一個面向：橫斷面能看出相對同業的位置，但看不出趨勢；時間序列能看出自身的進步或退步，但缺乏外部基準判斷這樣的表現在同業中算好還是壞。而「與同業作該比率之趨勢之分析比較」同時結合了這兩個維度，既能看出公司這項比率隨時間的動態變化，又能對照同業的趨勢做相對評估，因此在評估企業績效時是相對最全面、最不容易被單一時點或單一基準誤導的方法。\n\n其他選項為何較不全面： (A) 只在同一年度和同業比較，屬於單一時點的橫斷面比較，缺乏時間面向，看不出公司或同業是在進步還是退步。 (B) 只跟自己過去比，缺乏外部同業基準，可能公司雖然比去年進步，但其實仍遠落後同業水準，這種比較法無法揭露。 (D) 與整體市場同一比率比較，容易受到不同產業結構、資本密集度等特性差異影響（例如把科技業比率拿去跟傳產比並不公平），且同樣缺乏趨勢資訊。"}, {"id": "8ade046e8f0f", "head": "有關投資組合保險之敘述，何者不正確？", "opts": [["A", "較一般避險策略保守"], ["B", "希望設定投資組合價值之下限"], ["C", "希望投資組合的價值能夠在一定的風險程度下增加"], ["D", "組合保險的基本操作策略為追漲、殺跌"]], "ans": "A", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "112年第1次 投資學筆記　第3題", "ex": "答案為 (A) 較一般避險策略保守，此敘述不正確，與圖片標示一致。\n\n投資組合保險（Portfolio Insurance，如CPPI固定比例投資組合保險策略）並不是比一般避險策略更「保守」，恰恰相反，它是一種動態調整資產配置的策略：行情上漲時提高風險性資產（如股票）的部位，行情下跌時降低風險性資產部位，也就是俗稱的「追漲殺跌」（buy high, sell low）。透過這種動態加碼／減碼的操作，目的是在保住投資組合價值下限（floor）的同時，仍保留參與市場上漲行情、讓組合價值能夠增值的空間。這種持續交易、追隨行情動態調整部位的作法，反而在震盪盤整的市場中容易因為反覆買高賣低而侵蝕報酬（俗稱cash bleed），並不能簡單定性為「保守」，所以(A)的敘述不正確。\n\n其他選項為何正確： (B) 設定投資組合價值下限，正是組合保險策略的核心目標，透過動態調整確保組合價值不會跌破這個底線。 (C) 在保住下限的前提下，讓投資組合價值仍有機會隨市場上漲而增值，這正是組合保險相對於單純持有無風險資產更具吸引力之處。 (D) 組合保險的操作機制確實是「行情上漲時加碼、行情下跌時減碼」，也就是追漲殺跌的動態調整策略，這是CPPI等組合保險模型的標準操作邏輯。"}, {"id": "4bafcbfca9e1", "head": "利用財務報表資料挑選股票時，哪一種方式較可以找到績優之股票？", "opts": [["A", "比較淨利大小"], ["B", "比較每股營業利益大小"], ["C", "比較每股淨利大小"], ["D", "比較營業外收益大小"]], "ans": "B", "tag": "其他", "srcTxt": "112年第1次 投資學筆記　第3題", "ex": "答案為 (B) 比較每股營業利益大小，與圖片標示一致。\n\n挑選績優股時，關鍵在於要看出公司「本業」的真實獲利能力，而且要排除公司規模（股本大小）不同所造成的比較失真，這正是「每股營業利益」勝出的原因，可以拆成兩個層次來看：\n\n第一層，為什麼要用「每股」而不是用「總額」？公司甲淨利1億元、公司乙淨利5000萬元，看起來甲比較賺錢，但如果甲的股本是乙的5倍，換算成每股獲利反而是乙比較高。用總額比較會被股本規模干擾，換成每股數字才能公平比較不同公司間真正的獲利效率，所以(A)「比較淨利大小」這種看總額的方式，本身就先輸給有換算成每股的選項。\n\n第二層，為什麼要用「營業利益」而不是「淨利」？淨利（稅後純益）裡面除了本業的營業利益之外，還混雜了「營業外收支」，例如處分土地、廠房、有價證券的一次性利得，或匯兌損益、業外投資收益等非經常性項目。一家公司可能本業其實在虧損，卻因為一次性賣資產認列大筆業外利益，讓淨利看起來很亮眼，但這種獲利不具持續性，無法反映公司真正、可長期依賴的賺錢能力。相對地，「營業利益」只計算本業經營的收入減去營業成本與費用，能更真實地反映公司核心競爭力與經營績效，也更適合用來篩選「績優」（體質真正優良、獲利具持續性）的公司。\n\n所以綜合這兩個邏輯，「每股營業利益」同時做到了「排除股本規模干擾」與「排除業外非經常性損益干擾」，是四個選項中最能反映公司本業真實獲利能力的比較基礎。\n\n其他選項為何較不理想： (A) 比較淨利大小：只看總額，會被股本規模不同扭曲比較結果，且淨利仍含業外損益干擾。 (C) 比較每股淨利大小：雖然已換算成每股（解決了股本規模問題），但淨利仍然包含業外的一次性損益，可能被非經常性利得或損失誤導，無法純粹反映本業績效。 (D) 比較營業外收益大小：業外收益本身就是非經常性、不具持續性的損益來源（如資產處分利得），拿業外收益的大小來挑股票邏輯上完全錯誤，反而可能挑到本業體質不佳、只靠業外一次性利益撐帳面的公司。"}, {"id": "5d5297e24e03", "head": "友好公司預期明年可發放1.2元現金股利，且每年成長7%。假設目前無風險利率為6%，市場風險溢酬為8%，若友好公司股票之貝它(Beta)係數為0.75，在CAPM與股利折現模式同時成立，請問其股價應為何？", "opts": [["A", "10.71元"], ["B", "15元"], ["C", "20元"], ["D", "24元"]], "ans": "D", "tag": "股票評價：股利折現模型", "srcTxt": "112年第1次 投資學筆記　第4題", "ex": "答案為 (D) 24元，與圖片標示一致。\n\n這題分兩步驟，先用CAPM算出必要報酬率，再套進固定成長股利折現模型（Gordon Growth Model）算股價。\n\n第一步，用資本資產定價模式（CAPM）算必要報酬率 r：\n\nr = 無風險利率 + β × 市場風險溢酬 = 6% + 0.75 × 8% = 6% + 6% = 12%\n\n注意這裡的「市場風險溢酬」（market risk premium，即Rm−Rf）題目已經直接給8%，不需要另外扣無風險利率，直接乘上Beta加回無風險利率即可。\n\n第二步，把算出來的r代入固定成長股利折現公式：\n\nP0 = D1 / (r − g)\n\n題目已經明確給出「明年」（也就是D1）發放1.2元股利，成長率g = 7%，代入：\n\nP0 = 1.2 / (12% − 7%) = 1.2 / 5% = 24元\n\n常見算錯原因： 最常見的錯誤是CAPM計算時誤把市場風險溢酬當成「市場報酬率」，多扣了一次無風險利率，例如錯誤算成 6% + 0.75×(8%−6%) = 7.5%，導致必要報酬率偏低、股價估值失真；也可能是成長率代入錯誤（例如忘記扣掉g，直接用r=12%去除1.2元，得到10元附近的錯誤答案），這些都會導致選到(A)(B)(C)等偏低的估值結果。"}, {"id": "428d1b5d4bd1", "head": "當利率上升時，對債券價格與再投資報酬率之影響為何？", "opts": [["A", "債券價格與再投資報酬率皆上升"], ["B", "債券價格上升但再投資報酬率下跌"], ["C", "債券價格與再投資報酬率皆下跌"], ["D", "債券價格下跌但再投資報酬率上升"]], "ans": "D", "tag": "債券評價與價格利率關係", "srcTxt": "112年第1次 投資學筆記　第5題", "ex": "答案為 (D) 債券價格下跌但再投資報酬率上升，與圖片標示一致。\n\n這題牽涉到債券投資的兩種相反力量，也是「利率風險」與「再投資風險」互相抵銷（形成免疫策略, Immunization）的理論基礎。\n\n價格面：利率上升時，市場上新發行債券能提供更高的票息，使得手上原本票面利率較低、較舊的債券相對不再具吸引力，投資人願意支付的價格自然下降，這就是債券價格與市場利率呈反向關係的基本原理（折現率變大，未來現金流現值變小）。\n\n再投資面：債券每期領到的利息（票息）通常需要拿去做再投資，而再投資能拿到的報酬率就是取決於當下的市場利率。利率上升代表未來收到的利息可以用更高的利率滾入再投資，因此再投資報酬率會跟著上升。\n\n這兩股力量方向相反：利率上升讓「價格」受損（資本利損），卻讓「再投資收益」受惠，兩者一漲一跌，這正是債券投資中「價格風險」與「再投資風險」互相對沖的關係，也是存續期間免疫策略能夠成立的理論基礎。\n\n其他選項為何錯： (A) 債券價格不會因利率上升而上漲，方向錯誤。 (B) 把價格與再投資報酬率的漲跌方向完全講反了。 (C) 再投資報酬率不會因利率上升而下跌，這部分方向錯誤。"}, {"id": "3533f64915a1", "head": "當資本市場投資人更加規避風險，並且預期通貨膨脹將上升時，證券市場線之形狀將如何變化？", "opts": [["A", "截距上升、斜率增加"], ["B", "截距上升、斜率減少"], ["C", "截距下降、斜率增加"], ["D", "截距下降、斜率減少"]], "ans": "A", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "112年第1次 投資學筆記　第6題", "ex": "答案為 (A) 截距上升、斜率增加，與圖片標示一致。\n\n證券市場線（Security Market Line, SML）是CAPM的圖形表達，方程式為：\n\nE(Ri) = Rf + βi × [E(Rm) − Rf]\n\n其中截距是無風險利率 Rf，斜率是市場風險溢酬 [E(Rm) − Rf]。\n\n第一，預期通貨膨脹上升時：無風險利率（如公債殖利率）中隱含了對未來通膨的補償，這是費雪效應（Fisher Effect）的基本邏輯，名目利率 ≈ 實質利率 + 預期通膨率。當市場預期通膨上升，投資人會要求更高的名目報酬來彌補購買力的損失，使得名目無風險利率Rf上升，也就是SML的截距（縱軸上的起始點）跟著上升。\n\n第二，投資人更加規避風險時：投資人對承擔相同的一單位風險，會要求更高的額外報酬作為補償，這會直接推升市場風險溢酬 [E(Rm) − Rf]，也就是SML的斜率增加，代表SML這條線變得更陡，Beta每增加1單位所要求的額外報酬也隨之提高。\n\n兩個效果同時發生，就會讓SML整條線「往上平移且變得更陡」，也就是截距上升、斜率增加。\n\n其他選項為何錯： (B) 截距上升符合通膨預期上升的邏輯，但斜率減少與「投資人更規避風險」的方向相反，風險趨避提高應該讓斜率增加而非減少。 (C) 截距下降與通膨預期上升的方向相反，通膨預期上升應使無風險利率、也就是截距上升，而非下降。 (D) 截距與斜率的方向都與題目條件相反，兩者皆不符。"}, {"id": "c87127ecacf2", "head": "其它條件不變，當市場利率下降時，持有存續期間（Duration）長的債券較存續期間短的債券：", "opts": [["A", "獲利多"], ["B", "損失多"], ["C", "獲利少"], ["D", "損失少"]], "ans": "A", "tag": "存續期間與凸性", "srcTxt": "112年第1次 投資學筆記　第7題", "ex": "答案為 (A) 獲利多。\n\n利率下降時債券價格上漲，而存續期間越長，價格對利率變動的敏感度越高，漲幅也越大，因此存續期間長的債券在利率下降時獲利會比存續期間短的債券更多。\n\n（價格變動百分比 ≈ −存續期間 × 利率變動幅度 )"}, {"id": "349bb729df7f", "head": "一年期的利率為 4.8%，二年期的利率為 5.13%。請問一年後之預期一年期利率為何？（假設利率為實質年利率）", "opts": [["A", "5.02%"], ["B", "5.23%"], ["C", "5.46%"], ["D", "5.51%"]], "ans": "C", "tag": "其他", "srcTxt": "112年第2次 投資學筆記　第1題", "ex": "用遠期利率關係式（無偏預期理論）：\n\n(1+r₂)² = (1+r₁) × (1+f)\n\n其中 r₁=4.8%、r₂=5.13%，f 為一年後的預期一年期利率（遠期利率）。\n\nf = (1.0513)² / 1.048 − 1 = 1.10523 / 1.048 − 1 ≈ 0.0546 = 5.46%\n\n答案為 (C) 5.46%"}, {"id": "9b8aa16741b9", "head": "有關我國10年期公債期貨所規定之可交割債券之敘述，下列何者「正確」？ 甲、到期日距交割日在8年6個月以上10年以下；乙、1年付息1次；丙、到期日距交割日為11年；丁、到期1次還本", "opts": [["A", "僅甲、乙"], ["B", "僅甲、丙、丁"], ["C", "僅甲、乙、丁"], ["D", "僅乙、丙、丁"]], "ans": "C", "tag": "期貨定價、基差與避險", "srcTxt": "112年第2次 投資學筆記　第2題", "ex": "依臺灣期貨交易所「中華民國十年期政府債券期貨契約」交易規則第五條，可交割債券須符合：\n\n一、中華民國政府中央登錄公債 二、發行時償還期限為十年，或增額發行時原始公債償還期限為十年 三、到期日距交割日在八年六個月以上十年以下 四、一年付息一次 五、到期一次還本\n\n逐項檢驗： 甲「8年6個月以上10年以下」符合條文第三款，正確。 乙「1年付息1次」符合條文第四款，正確。 丙「距交割日為11年」超出10年上限，不符合條文第三款，錯誤。 丁「到期一次還本」符合條文第五款，正確。\n\n正確組合為甲、乙、丁。\n\n答案為 (C) 僅甲、乙、丁。"}, {"id": "11dd2eb46ca8", "head": "成為臺灣50指數成分股的資格，何者「正確」？甲、公司成立3年以上；乙、依公司市值大小排序，取排名前50檔股票", "opts": [["A", "僅甲"], ["B", "僅乙"], ["C", "甲、乙均正確"], ["D", "甲、乙均不正確"]], "ans": "B", "tag": "其他", "srcTxt": "112年第2次 投資學筆記　第3題", "ex": "答案為 (B) 僅乙\n\n臺灣50指數（由臺灣證交所與富時FTSE合編）是以「自由流通市值」為主要篩選依據，從上市普通股中挑出市值排名最大的前50檔股票納入成分股，並輔以流動性等條件篩選，每季（3、6、9、12月）調整一次成分股。\n\n甲「公司成立3年以上」錯誤：指數編製規則並未設定公司成立年限門檻，只要符合市值排名與流動性條件即可能入選（也因此常有新上市未滿3年的公司被納入的案例）。\n\n乙「依公司市值大小排序，取前50檔」正確：這正是臺灣50指數選股的核心邏輯（實務上更精確地說是採「自由流通市值」排序，而非單純總市值，但這是選項敘述的合理簡化，方向正確）。"}, {"id": "614cbf67fe3d", "head": "在利率期限結構中的市場區隔理論（Market Segmentation Theory）中，理論上如果長期利率下跌，則短期利率將：", "opts": [["A", "上漲"], ["B", "不受影響"], ["C", "下跌"], ["D", "以上皆錯誤"]], "ans": "B", "tag": "利率期限結構與殖利率曲線", "srcTxt": "112年第2次 投資學筆記　第4題", "ex": "答案為 (B) 不受影響，與圖片標示一致。\n\n市場區隔理論主張，不同到期期限的債券市場是彼此獨立、互不替代的資金市場，因為借款人與投資人各自對特定期限有偏好（例如受限於負債存續期間、法規要求或流動性需求），不會因為利率誘因就輕易跨期限移動資金。在這個假設下，長、短期利率是分別由各自市場的供需獨立決定，因此長期利率的變動理論上不會傳導影響到短期利率。\n\n常見混淆點： (A)(C) 上漲或下跌都隱含長短期利率之間存在連動關係，這其實是「預期理論」（Expectations Theory）或「流動性溢酬理論」（Liquidity Premium Theory）的思維，不是市場區隔理論的主張，市場區隔理論恰恰否定這種連動性。 (D) 既然「不受影響」本身就是正確答案，此選項自然不成立。"}, {"id": "781ef0fda18a", "head": "掌握底部量及頭部量，可用何項技術指標？", "opts": [["A", "OBV"], ["B", "TAPI"], ["C", "平均量"], ["D", "ADL"]], "ans": "C", "tag": "技術分析", "srcTxt": "112年第2次 投資學筆記　第5題", "ex": "答案為 (C) 平均量，與圖片標示一致。\n\n平均量是將一段期間內的成交量取平均，\n用來觀察量能的整體水準與趨勢變化。底部量通常出現在股價低檔、量能持續萎縮到某個相對低點（量縮），頭部量則出現在股價高檔、成交量急遽放大到相對高點（量增），透過觀察平均量的升降，可以較清楚判斷目前是否處於底部量縮或頭部量增的階段，進而研判趨勢是否有轉折跡象，因此是判斷底部量、頭部量的常用指標。\n\n其他選項為何不適用： (A) OBV（能量潮）是把每日成交量依股價漲跌方向累加或累減，用來觀察資金流向與價格背離，偏重的是「量價關係」而非單純的底部量、頭部量判讀。 (B) TAPI（加權指數成交值比率）是用大盤成交值除以加權指數，反映的是平均每點指數的成交值，偏向衡量價量的加權關係，不是專門用來抓底部量、頭部量的工具。 (D) ADL（漲跌線）是用每日上漲家數減下跌家數再累加，反映的是市場漲跌家數的廣度（多空氣氛），跟成交量高低沒有直接對應關係。"}, {"id": "e7bcbeb81fbf", "head": "題目（部分內容因擷取圖片頂端被裁切，依可見文字與解題脈絡重建）： 某公司股價為$184，公司計劃保留60%的盈餘作為再投資用，並賺取25%的報酬，直到永遠。昨日剛公告去年每股盈餘為$10，試計算投資人對該股票要求的年報酬率為多少？", "opts": [["A", "12.5%"], ["B", "15.98%"], ["C", "17.17%"], ["D", "17.5%"]], "ans": "D", "tag": "其他", "srcTxt": "112年第2次 投資學筆記　第7題", "ex": "答案為 (D) 17.5%，與圖片標示一致，這是「固定成長股利折現模型」（Gordon Growth Model, Constant Growth DDM）搭配「永續成長率公式」的綜合應用。\n\n第一步，算永續成長率 g：公司把60%的盈餘保留下來再投資（保留率 b = 60%），每投入的資金能賺取25%的報酬（即股東權益報酬率 ROE = 25%）。永續成長率公式為：\n\ng = 保留率 × ROE = 60% × 25% = 15%\n\n這個公式的邏輯是：公司靠保留盈餘去創造成長，保留的比例越高、再投資的報酬率越高，未來盈餘（進而股利）成長就越快。\n\n第二步，算今年即將發放的股利 D1。去年EPS是10元，保留60%代表只發放40%出去當股利，所以去年股利 D0 = 10 × (1−60%) = 10 × 40% = 4元。而股利同樣會照成長率成長，所以今年（下一期）的股利：\n\nD1 = D0 × (1+g) = 4 × 1.15 = 4.6元\n\n第三步，套入固定成長股利折現模型：\n\nP0 = D1 / (r − g)\n\n已知股價 P0 = 184，代入反推 r：\n\n184 = 4.6 / (r − 15%)\n\nr − 15% = 4.6 / 184 = 0.025\n\nr = 15% + 2.5% = 17."}, {"id": "050587f5277a", "head": "以下哪項新金融商品免徵交易稅？", "opts": [["A", "臺指期貨"], ["B", "臺指選擇權"], ["C", "認購權證"], ["D", "不動產投資信託(REITs)"]], "ans": "D", "tag": "選擇權基本概念與到期損益", "srcTxt": "112年第2次 投資學筆記　第7題", "ex": "答案為 (D) 不動產投資信託(REITs)，與圖片標示一致。\n\n依「不動產證券化條例」規定，不動產投資信託受益證券（REITs）的買賣依規定免徵證券交易稅，用意在降低不動產證券化商品的交易成本，鼓勵投資人透過小額資金間接參與大型不動產投資，促進不動產市場證券化。此外，投資人從REITs取得的收益分配歸屬「利息所得」，境內個人可適用10%分離課稅。\n\n其他選項為何要課稅： (A) 臺指期貨屬於期貨交易，須依規定課徵期貨交易稅（按契約金額一定比例課徵）。 (B) 臺指選擇權同樣屬於期貨選擇權交易，也須課徵期貨交易稅。 (C) 認購權證屬於有價證券，買賣時須依規定課徵證券交易稅，稅率通常為千分之一（發行人賣出時課徵；投資人買賣認購權證本身另有相關稅制）。"}, {"id": "3386090bc6c7", "head": "某公司今年每股發放股利3元，在股利零成長的假設下，已知投資人的必要報酬率為8%，則每股普通股的預期價值為：", "opts": [["A", "20元"], ["B", "30元"], ["C", "33.3元"], ["D", "37.5元"]], "ans": "D", "tag": "股票評價：股利折現模型", "srcTxt": "113年第1次（Hard） 投資學筆記　第1題", "ex": "零成長股利折現模型（Gordon Growth Model, g=0）：  \nP = D / r = 3 / 0.08 = 37.5元  \n答案為 (D)。"}, {"id": "2c5eec6132eb", "head": "某公司即將發行公司債籌措資金，每一張公司債承諾從第3年年底開始，每年支付$5,000債息直到永遠。假設投資人要求報酬率為5%，試計算買賣雙方都同意之債券價格約為多少？", "opts": [["A", "$86,384"], ["B", "$90,703"], ["C", "$95,238"], ["D", "$100,000"]], "ans": "B", "tag": "債券評價與價格利率關係", "srcTxt": "113年第1次（Hard） 投資學筆記　第2題", "ex": "這是「遞延永續年金」（Deferred Perpetuity）。永續年金公式 PV = C / r 算出的，是「第一次付款前一期」的現值。第一次付款在第3年底，所以這個公式算出的是第2年底的價值：\n第2年底價值 = 5,000 / 0.05 = 100,000\n再把這個第2年底的價值折現回今天（折現2期）：\nP = 100,000 / (1.05)² = 100,000 / 1.1025 ≈ $90,703\n\n答案為 (B)\nC 是每期固定發生的現金流金額（每年的債息 $5,000）r 是每期的必要報酬率（折現率）。\nPV = C / r 算出的是「這筆永續、每期固定金額 C 的現金流」在第一次付款前一期的價值"}, {"id": "6e90708decd8", "head": "有關騰落指標（ADL）的敘述，何者「不正確」？", "opts": [["A", "ADL 是以股票漲跌家數累積差值研判大盤走勢"], ["B", "ADL 的計算公式，其取樣的漲跌家數與 ADR 相同"], ["C", "ADL 能全面真實的反映股市的走勢方向，而不被個別大戶所操縱"], ["D", "ADL 公式中，其下限為 0，上限則無限制"]], "ans": "D", "tag": "國際投資與匯率", "srcTxt": "113年第1次（Hard） 投資學筆記　第3題", "ex": "ADL（騰落指標，Advance-Decline Line）是把每天「上漲家數－下跌家數」的差值逐日累加，形成一條連續累積線，用來衡量大盤漲跌的廣度（多少檔股票真正參與行情，而非只看少數權值股）。\n\n正確答案是 (D)。  \n因為 ADL 是「差值」的累積加總，上漲家數可能少於下跌家數，使當天差值為負，長期累積下來 ADL 完全可以是負數，並沒有「下限為0」這回事；上下都是無限制的。所以 D 這個敘述本身描述錯誤，是題目要找的「不正確」選項。\n\n其餘三個選項其實都是對 ADL 的正確描述：\n\n- (A) 正確：ADL 本來就是用漲跌家數的累積差值來研判大盤走勢。\n- (B) 正確：ADL 與 ADR（漲跌比率）都是取樣同一批每日上漲/下跌家數資料，只是一個做累加差值、一個做比率。\n- (C) 正確：因為 ADL 看的是「參與家數」而非個股權重，比較不易被少數大戶或權值股操縱，能較全面反映市場廣度。"}, {"id": "f8064deba252", "head": "假設一90天期國庫券的面額為100萬元，報價為95.30，請問投資人欲買進時，須支付多少金額？（一年以365天計算）", "opts": [["A", "953,000元"], ["B", "988,411元"], ["C", "986,931元"], ["D", "992,274元"]], "ans": "B", "tag": "貨幣市場工具（CD／CP／BA／國庫券）", "srcTxt": "113年第1次（Hard） 投資學筆記　第4題", "ex": "國庫券採「貼現報價」方式，報價95.30代表年化貼現率為 100 − 95.30 = 4.70%。實際90天的貼現率要換算成天數比例，再從面額（以100為基準）扣除：\n\n100 − 4.7 × (90/365) = 100 − 1.1589 = 98.8411（每100元面額的實際價格）\n再依比例換算到面額100萬元： 98.8411% × 1,000,000 = 988,411元\n\n答案為 (B)。\n\n常見算錯原因：\n\n- (A) 953,000：誤把報價95.30直接乘以面額（95.30% × 1,000,000），忽略了90天只是一年的一部分，沒有按天數比例換算貼現金額。\n- (C)、(D)：天數比例或貼現率代入有誤差（例如用360天換算，或算式順序顛倒），導致折現金額算錯。"}, {"id": "27f5cddcca9a", "head": "甲公司為擴充產能，將盈餘保留再投資，未來兩年年底均不發放股利，而第三年底發放每股現金股利3元，且預期之後每年股利均可成長4%，直至永遠。若要求報酬率為10%，則甲公司目前每股之合理價格為多少？", "opts": [["A", "50元"], ["B", "52元"], ["C", "41.32元"], ["D", "42.98元"]], "ans": "C", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "113年第1次（Hard） 投資學筆記　第5題", "ex": "這題是「延遲成長股利折現模型」，股利從第3年底才開始發放，之後才進入固定成長（4%）階段。\n\nGordon Growth Model：P = D / (r − g) 算出來的，是「第一次股利發放前一期」的價值。這裡第一次股利在第3年底，所以算出來的是第2年底的價值：\n\n第2年底價值 = 3 / (10% − 4%) = 3 / 0.06 = 50元\n\n再把這個第2年底的價值折現回今天（折現2期）：\n\nP = 50 / (1.1)² = 50 / 1.21 ≈ 41.32元\n\n答案為 (C)。\n\n常見算錯原因：\n\n- (A) 50元：忘記還要把「第2年底的價值」折現回今天，直接把中間算出來的50元當成現在的價格。\n- (B)、(D)：折現期數算錯（例如折現1期而非2期），或成長率/報酬率代入位置弄反。"}, {"id": "20515bc9322d", "head": "當技術分析(使用歷史資料預測股價)無效時，市場至少必須是：", "opts": [["A", "弱式效率市場假說"], ["B", "半強式效率市場假說"], ["C", "強式效率市場假說"], ["D", "非效率市場"]], "ans": "A", "tag": "市場效率假說與異常現象", "srcTxt": "113年第1次（Hard） 投資學筆記　第6題", "ex": "效率市場假說（EMH）依「股價反映了多少資訊」分三個層級，一層比一層嚴格：\n\n- 弱式：股價已反映所有「歷史價格與成交量」資訊\n- 半強式：連所有「公開資訊」（財報、新聞等）都已反映\n- 強式：連「內部消息」都已反映\n\n技術分析只用到歷史價格資料，題目問的是「至少」要滿足哪個條件才會讓技術分析失效。既然技術分析僅仰賴歷史資料，只要市場達到最基本的「弱式效率」，股價就已經吸收了所有歷史資訊，技術分析自然賺不到超額報酬——不需要更嚴格的半強式或強式效率才會讓它失效。\n\n答案為 (A) 弱式效率市場假說。\n\n常見誤選原因：\n\n- (B) 半強式：把「公開資訊也反映」誤認為是技術分析失效的必要條件，但技術分析根本沒用到公開資訊（財報等），所以不需要到半強式這麼嚴格。\n- (C) 強式：門檻設得更高，同樣不必要。\n- (D) 非效率市場：邏輯相反——市場沒效率時，歷史資料反而可能還有預測力，技術分析才可能有效。"}, {"id": "b0647eb15464", "head": "(容易，但少見的RPO/RS計算)\n   題目：老王以1,000萬元之公債用面額與證券公司承作附賣回(RS)交易，雙方約定利率為6%，並於30天後向證券公司買回，屆時老王應支付證券公司之利息為何？（註：一年以365天計算）", "opts": [["A", "$49,315"], ["B", "$44,770"], ["C", "$48,770"], ["D", "$42,185"]], "ans": "A", "tag": "債券種類與特性（公債／可轉債／附條件）", "srcTxt": "113年第1次（Hard） 投資學筆記　第7題", "ex": "附賣回交易（RS）的利息就是單利計算：本金 × 利率 × (天數/365)。\n\n利息 = 10,000,000 × 6% × (30/365) = 600,000 × 30/365 ≈ $49,315\n\n答案為 (A)。\n\n常見算錯原因：\n\n- (B)、(C)、(D)：多半是天數比例算錯（例如用360天當分母、或30天換算錯誤），導致利息金額偏低。"}, {"id": "fd8b51cb1173", "head": "公司股利成長率之值為多少時，就「不可以」應用股利永續成長模式來估計股價？", "opts": [["A", "低於股票要求報酬率"], ["B", "高於股票要求報酬率"], ["C", "大於0"], ["D", "不管公司股利成長率的值是多少，都可以使用股利成長模式估計股價"]], "ans": "B", "tag": "股票評價：股利折現模型", "srcTxt": "113年第1次（Hard） 投資學筆記　第8題", "ex": "股利永續成長模型（Gordon Growth Model）：P₀ = D₁ / (k − g)，這個公式成立的前提是分母 (k − g) 必須為正，也就是要求報酬率 k 一定要大於成長率 g。\n\n若成長率 g 等於或高於要求報酬率 k，分母會變成0或負數，算出來的股價會失真（除以0或變成負值），公式就不適用了。\n\n答案為 (B) 高於股票要求報酬率。\n\n常見誤選原因：\n\n- (A) 低於要求報酬率：這正是模型成立的正常情況（k > g），可以使用，不是「不可以」的情境。\n- (C) 大於0：只要求成長率為正還不夠，重點是要跟要求報酬率比較大小，g 只要小於 k，即使是正的也能用。\n- (D)：忽略了模型必須滿足 k > g 且成長率穩定的前提。"}, {"id": "6149894f8901", "head": "已知一債券的票面利率為8%，面額為100元，5年後到期，每半年付息一次，且目前此債券的殖利率為5%，則此債券目前的價格約為：", "opts": [["A", "93.372元"], ["B", "97.523元"], ["C", "100元"], ["D", "113.128元"]], "ans": "D", "tag": "債券評價與價格利率關係", "srcTxt": "113年第1次（Hard） 投資學筆記　第9題", "ex": "每半年付息一次，所以要把年數轉成「期數」：5年 × 2 = 10期；票面利率、殖利率也要除以2變成半年期：\n\n- 每期票息 = 100 × 8% / 2 = 4元\n- 每期折現率 = 5% / 2 = 2.5%\n\n債券價格 = 票息年金現值 + 面額現值\n\n= 4 × [1 − (1.025)⁻¹⁰] / 0.025 + 100 × (1.025)⁻¹⁰ = 4 × 8.7521 + 100 × 0.7812 = 35.008 + 78.120 ≈ 113.128元\n\n答案為 (D)。\n\n判斷邏輯（不用算也能先抓方向）：票面利率(8%) > 殖利率(5%)，代表這張債券發的利息比市場要求的報酬率高，投資人願意用「溢價」（高於面額100元）買進，所以價格必然大於100元——直接排除 (A)(B)(C)。\n\n常見算錯原因：\n\n- (A)、(B)：忘記把年利率和年數換算成「半年期」，直接套用年付息一次的公式，導致折現期數或利率代錯。"}, {"id": "cb9a3ce80550", "head": "假設滬深300指數單日大跌8.7%，則有關其反向型ETF的表現，下列何者正確？", "opts": [["A", "漲幅限制為10%"], ["B", "漲幅可能高於8.7%，但不會超過10%"], ["C", "漲幅不可能低於8.7%"], ["D", "無漲跌幅限制"]], "ans": "D", "tag": "共同基金與 ETF", "srcTxt": "113年第1次（Hard） 投資學筆記　第10題", "ex": "關鍵概念是台灣證交所對「連結單一國外指數的ETF」的規定：這類跨境ETF（例如追蹤滬深300、追蹤那斯達克等）不適用台股一般個股/一般ETF的10%漲跌幅限制，可以無漲跌幅限制交易。\n\n原因是這類ETF的淨值連動的是境外市場的指數，而境外市場本身可能單日就大漲大跌超過10%（像題目中滬深300大跌8.7%這種情況並不罕見）。如果台灣這邊硬性套用10%限制，ETF市價會被鎖住、追不上境外指數的實際漲跌，導致市價和淨值嚴重偏離。所以主管機關特別把這類商品排除在漲跌幅限制之外。\n\n答案為 (D) 無漲跌幅限制。"}, {"id": "856faea5e682", "head": "關於臺灣公司治理100指數之敘述，何者「不正確」？", "opts": [["A", "原則從最近1年公司治理評鑑結果前20%的股票中篩選"], ["B", "定期審核以外之期間，成分股因故剔除，將即按順位遞補後續排名公司"], ["C", "每一營業日收盤後發布一次「報酬指數」"], ["D", "於股市交易時間內，每5秒計算1次「市值指數」"]], "ans": "B", "tag": "其他", "srcTxt": "113年第1次（Hard） 投資學筆記　第11題", "ex": "答案為 (B)。\n\n臺灣公司治理100指數的成分股審核有固定的「定期審核」機制。若在定期審核以外的期間，某檔成分股因故（下市、停止交易等）被剔除，原則上不會立即按排名遞補下一名公司，而是維持缺額，等到下一次定期審核時才會一併調整成分股名單。B選項描述「將即按順位遞補」，正好講反了，所以是題目要找的「不正確」敘述。\n\n其餘三個選項都是正確描述：\n\n- (A) 正確：指數編製原則是先從最近一年公司治理評鑑結果的前20%股票中篩選，再考量市值規模、流動性等條件。\n- (C) 正確：報酬指數（含息報酬）通常是每個營業日收盤後計算並發布一次，不像市值指數是盤中即時計算。\n- (D) 正確：市值指數（價格指數）在交易時間內會高頻即時計算並更新（如每5秒一次），讓投資人可即時掌握指數變化。"}, {"id": "ca07cbf7e57f", "head": "小何使用6萬美元的自有資金，並借入額外的50萬歐元，借1個月的歐元要支付0.5%的月利率，而將資金投資於澳幣能夠獲得1%的月報酬。假設澳幣的即期匯率目前為0.6美元，而1歐元目前價值1.2美元。若匯率在下一個月沒有變化，試問小何進行此利差交易(Carry Trade)的月報酬為：", "opts": [["A", "0.55%"], ["B", "2.83%"], ["C", "6.00%"], ["D", "10.00%"]], "ans": "C", "tag": "國際投資與匯率", "srcTxt": "113年第1次（Hard） 投資學筆記　第12題", "ex": "這是典型的槓桿式利差交易（Carry Trade），核心邏輯是：用自有資金＋借來的低息貨幣，一起投入高報酬資產，賺取「投資報酬」與「借款成本」之間的價差，再算出這筆利潤佔「自有資金」的比率（因為只有自有資金是自己出的本）。\n\n第一步，把借款換算成美元： 50萬歐元 × 1.2美元/歐元 = 60萬美元\n\n第二步，算出總投入本金（自有＋借入，統一用美元）： 6萬美元（自有） + 60萬美元（借入換算） = 66萬美元\n\n第三步，這筆錢投資澳幣賺1%月報酬。因為匯率下個月不變，用美元計價的報酬率也是1%： 66萬美元 × 1% = 6,600美元（投資獲利）\n\n第四步，算借款利息成本（歐元計價，再換算成美元）： 50萬歐元 × 0.5% = 2,500歐元 → 2,500 × 1.2 = 3,000美元（利息成本）\n\n第五步，淨利潤： 6,600 − 3,000 = 3,600美元\n\n第六步，換算成「自有資金」的報酬率（這才是題目要問的月報酬）： 3,600 / 60,000 = 6.00%\n\n答案為 (C)。\n\n常見算錯原因：\n\n- (D) 10.00%：可能誤把「總淨利潤」直接除以某個較小或錯誤的分母，或忘記扣除借款利息成本。\n- (A)、(B)：可能是總投入金額、借款成本，或分母（自有資金）代錯，導致比例算歪。"}, {"id": "e03564c8bcaf", "head": "一個剛發行的1年期債券，面額為$10,000，每半年付息一次，其債息分別依序為$300和$500，若目前同類型債券之市場殖利率為10%，試計算該債券價格約為：", "opts": [["A", "$8,950"], ["B", "$9,810"], ["C", "$9,831"], ["D", "$10,293"]], "ans": "B", "tag": "債券評價與價格利率關係", "srcTxt": "113年第1次（Hard） 投資學筆記　第13題", "ex": "半年付息一次，所以要用「半年期折現率」來算，即 10%/2 = 5%，總共2期。這題兩期的債息金額不一樣（$300、$500），不能直接套年金公式，要把每一期的現金流分別折現再加總：\n\n第1期現金流：$300（純利息） 第2期現金流：$500（利息）+ $10,000（到期還本）= $10,500\n\nP = 300 / (1.05)¹ + 10,500 / (1.05)² = 285.71 + 9,523.81 ≈ $9,810\n\n答案為 (B)。\n\n常見算錯原因：\n\n- (A)：可能誤把折現率直接用10%（年利率）而非半年期的5%去折現，導致折現過多、價格偏低。\n- (C)、(D)：可能把兩期債息金額搞混（例如兩期都套用同一個利息數字），或折現期數算錯。"}, {"id": "952259c304a6", "head": "若甲證券之平均報酬為18%，標準差為0.20，而乙證券之平均報酬為4%，標準差為0.10，若二證券為完全負相關，其共變異數為何？", "opts": [["A", "0.05"], ["B", "0.3"], ["C", "-0.02"], ["D", "-0.04"]], "ans": "C", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "113年第1次（Hard） 投資學筆記　第14題", "ex": "共變異數（Covariance）的公式是：相關係數 × 甲標準差 × 乙標準差。\n\n「完全負相關」代表相關係數 ρ = -1（兩者永遠反方向變動）。\n\n共變異數 = -1 × 0.20 × 0.10 = -0.02\n\n答案為 (C)\n\n\n題目沒用到平均報酬18%和4%這兩個數字——那是用來算「相關係數」本身時才需要的原始資料（如果沒直接告知ρ的話），但這題已經直接告訴你「完全負相關」，所以可以跳過那一步，直接代入 ρ=-1。"}, {"id": "55ef4487b5d6", "head": "下列敘述何者正確？", "opts": [["A", "債券到期期限愈短，利率風險愈大"], ["B", "債券的存續期間愈長，利率風險愈高"], ["C", "債券的票面利率愈低，利率風險愈低"], ["D", "以上皆非"]], "ans": "B", "tag": "存續期間與凸性", "srcTxt": "113年第1次（Hard） 投資學筆記　第15題", "ex": "答案為 (B)。\n\n存續期間（Duration）衡量的是債券價格對利率變動的敏感度，存續期間愈長，代表現金流回收的加權平均時間愈晚，債券價格受利率變動影響就愈大，也就是利率風險愈高。這是判斷債券利率風險最核心也最準確的指標（比單純看到期期限更全面，因為存續期間同時考慮了到期時間和票息大小/時間分布）。\n\n其餘選項為何不對：\n\n- (A)：方向講反了。到期期限愈短，現金流回收得愈快，通常利率風險反而愈低，不是愈大。\n- (C)：方向也講反了。票面利率愈低，代表早期收到的現金流（票息）愈少，現金流回收時間會被拉得更晚，存續期間會愈長，利率風險其實愈高，而不是愈低。\n- (D)：因為(B)本身就是正確敘述，所以「以上皆非」不成立。"}, {"id": "35af2890aaa9", "head": "假設前一營業日H公司股價收盤為30元，其認購權證之履約價格為25元，權利金為3.5元，若執行比例為1.3，請問今天H公司權證之最大上漲幅度為：", "opts": [["A", "7.00%"], ["B", "8.40%"], ["C", "120.57%"], ["D", "111.43%"]], "ans": "D", "tag": "選擇權基本概念與到期損益", "srcTxt": "113年第1次（Hard） 投資學筆記　第16題", "ex": "權證（認購權證）的漲跌是跟著標的股票的價格變動、再乘上「執行比例」放大，所以權證的漲跌幅度通常比股票本身大很多（這就是權證的槓桿特性）。\n\n第一步，算出股票今天最大能漲多少錢： 台股現貨每日漲跌幅限制為10%，所以股價最大漲幅金額 = 30元 × 10% = 3元\n\n第二步，把這個漲幅乘上執行比例，換算成權證理論上能增加的價值： 3元 × 1.3（執行比例）= 3.9元\n\n第三步，用這個增加金額除以權證原本的權利金（3.5元），才是權證本身的漲幅百分比： 3.9 / 3.5 ≈ 111.43%\n\n答案為 (D)。\n\n常見算錯原因：\n\n- (A) 7.00%、(B) 8.40%：把「股票的10%漲幅」直接乘上執行比例當成權證漲幅百分比（10%×1.3=13%附近算法錯誤組合），忘記要先換算成金額、再除以權利金這個基準，導致算出來的比例遠低於實際值。\n- (C) 120.57%：可能是分子或分母代錯數字（例如用履約價25元而非權利金3.5元當分母）。"}, {"id": "d54405daabd8", "head": "何種證券之持有人在公司辦理現金增資時，有優先認購新股之權利？甲.認購權證；乙.普通股；丙.認股權證；丁.可轉換公司債", "opts": [["A", "僅乙"], ["B", "僅甲、乙"], ["C", "僅乙、丙"], ["D", "僅甲、丙"]], "ans": "A", "tag": "認購（售）權證", "srcTxt": "113年第1次（Hard） 投資學筆記　第17題", "ex": "答案為 (A) 僅乙。\n\n依公司法規定，公司辦理現金增資時，是既有「股東」依持股比例享有優先認購新股的權利（俗稱股東的優先認股權）。四個選項裡，只有「乙、普通股」持有人是真正的公司股東，所以只有乙符合。\n\n其餘三者為什麼沒有這項權利：\n\n- 甲、認購權證：屬於衍生性金融商品，持有人只是買了一張「未來能用特定價格買股票」的權利憑證，並不是公司股東，不享有股東的現增優先認購權。\n- 丙、認股權證：性質跟認購權證類似，持有人也不是股東，只是依約定條件行使認股權利，同樣沒有現增優先權。\n- 丁、可轉換公司債：持有人的身分是「債權人」（借錢給公司），在還沒轉換成股票之前，法律上不是股東，自然沒有股東才有的優先認購權。"}, {"id": "3950f93c4c2c", "head": "描述期望報酬率與β值之間關係的線，稱為：", "opts": [["A", "資本市場線（Capital Market Line）"], ["B", "效率集合（Efficient Set）"], ["C", "證券市場線（Security Market Line）"], ["D", "等平均線（Iso-Mean Line）"]], "ans": "C", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "113年第1次（Hard） 投資學筆記　第18題", "ex": "答案為 (C) 證券市場線。\n\n證券市場線（SML）是CAPM模型的核心圖形，畫的是「期望報酬率」對「β值（系統風險）」的線性關係，適用於任何單一資產或投資組合，不論是不是有效投資組合都能畫在這條線上。\n\n其餘選項為何不對：\n\n- (A) 資本市場線（CML）：畫的是期望報酬率對「總風險（標準差）」的關係，而且只適用於「有效投資組合」（市場投資組合＋無風險資產的組合），不是β的關係線，也不是題目問的「β值」這個座標軸。\n- (B) 效率集合：指的是有效前緣上所有投資組合的集合，講的是報酬與風險（標準差）的取捨關係，跟β無關。\n- (D) 等平均線：不是CAPM架構下的標準概念，指的是報酬率相同的連線，與β值的關係無關。"}, {"id": "465b8410b878", "head": "在KD中何者為牛市背離現象？", "opts": [["A", "大盤創新低點，RSI值並沒有創新低點"], ["B", "大盤創新低點，DIF值並沒有創新低點"], ["C", "大盤創新低點，ADX值並沒有創新低點"], ["D", "大盤創新低點，K值並沒有創新低點"]], "ans": "D", "tag": "技術分析", "srcTxt": "113年第1次（Hard） 投資學筆記　第19題", "ex": "答案為 (D)。\n\n題目問的是「KD指標」的牛市背離，所以要看的必須是KD指標本身（也就是K值或D值），而不是其他技術指標。牛市背離的意思是：股價創新低，但KD指標（K值）卻沒有跟著創新低、反而形成較高的低點，代表雖然價格還在跌，但下跌的動能其實在減弱，是可能反轉向上的訊號。\n\n其餘選項為何不對（都是「指標選錯」的陷阱）：\n\n- (A) RSI值：RSI是另一個獨立的技術指標（相對強弱指標），它的背離叫做「RSI背離」，不是KD背離。\n- (B) DIF值：DIF是MACD指標裡的一條線，它的背離屬於「MACD背離」，也不是KD背離。\n- (C) ADX值：ADX是用來衡量趨勢強弱的指標，本身不判斷方向、也沒有背離這個概念，跟KD背離完全無關。"}, {"id": "bfb8784301d2", "head": "一般而言，下列那種平均報酬率的計算方法，最適合來衡量投資組合的投資績效？", "opts": [["A", "時間加權法"], ["B", "調和平均法"], ["C", "金額加權法"], ["D", "內部報酬率法"]], "ans": "A", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "113年第1次（Hard） 投資學筆記　第20題", "ex": "答案為 (A) 時間加權法。\n\n衡量投資組合（或基金經理人）的「純投資績效」時，最理想的方法要能排除投資人自己進出資金（何時申購、何時贖回、金額多少）造成的干擾，只反映經理人操盤本身的功力。時間加權法就是把整個投資期間切成好幾個子期間，每個子期間各自算報酬率再連乘，剛好能剔除現金流入流出時點與金額的影響，所以最適合用來評估投資組合績效。\n\n其餘選項為何不對：\n\n- (B) 調和平均法：本來就不是設計來衡量報酬率的方法，實務上很少用在這個用途上。\n- (C) 金額加權法：會受到投資人「什麼時候投入多少錢」影響，算出來的報酬率其實混雜了投資人自身進出場時機的運氣成分，反映的比較像是投資人自己的實際經驗，不是經理人單純的操盤績效。\n- (D) 內部報酬率法（IRR）：本質上等同金額加權報酬率，一樣會受現金流入流出的時點與金額影響，同樣不適合拿來單獨評估投資組合的純投資績效。"}, {"id": "b5e3a9a04d4c", "head": "在CAPM模式中，若已知甲股票的預期報酬為18%，甲股票的β值為1.2，目前無風險利率為6%，則市場風險溢酬為：", "opts": [["A", "10%"], ["B", "12%"], ["C", "14%"], ["D", "16%"]], "ans": "A", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "113年第1次（Hard） 投資學筆記　第21題", "ex": "CAPM模型：E(Ri) = Rf + β × [E(Rm) − Rf]\n\n其中 [E(Rm) − Rf] 這一項就是「市場風險溢酬」，題目已知的是甲股票的預期報酬 E(Ri)=18%，要反推市場風險溢酬，只要把公式移項：\n\n市場風險溢酬 = [E(Ri) − Rf] / β = (18% − 6%) / 1.2 = 12% / 1.2 = 10%\n\n答案為 (A)。"}, {"id": "902cd1c3a1be", "head": "某股票在除權交易日前一天收盤價為90元，若盈餘轉增資配股率15%，資本公積轉增資配股率10%，則除權參考價為：", "opts": [["A", "64元"], ["B", "72元"], ["C", "69.5元"], ["D", "80元"]], "ans": "B", "tag": "證券市場結構與交易實務", "srcTxt": "113年第1次（Hard） 投資學筆記　第22題", "ex": "盈餘轉增資和資本公積轉增資都屬於「無償配股」（用公司的盈餘或資本公積轉換成股票分給股東，股東不用額外出錢），效果都是讓在外流通股數增加，所以除權時股價要依配股比例往下調整，公式是：\n\n除權參考價 = 除權前收盤價 / (1 + 配股率)\n\n這裡的配股率要把兩種來源加總：15%（盈餘轉增資）+ 10%（資本公積轉增資）= 25%\n\n除權參考價 = 90 / (1 + 25%) = 90 / 1.25 = 72元\n\n答案為 (B)。"}, {"id": "793cd5a0a095", "head": "某企業可用以支付債息之盈餘為600萬元，其目前流通在外之負債計有抵押公司債1,500萬元，票面利率6%，無抵押公司債500萬元，票面利率8%，其全體債息保障係數為：", "opts": [["A", "3.346"], ["B", "3.846"], ["C", "4.426"], ["D", "4.615"]], "ans": "D", "tag": "債券評價與價格利率關係", "srcTxt": "113年第2次（Hard） 投資學筆記　第1題", "ex": "債息保障倍數（Times Interest Earned）= 可用以支付債息之盈餘（EBIT）／全部應付利息總額。\n\n全部利息 = 抵押公司債利息 + 無抵押公司債利息 = 1,500萬 × 6% + 500萬 × 8% = 90萬 + 40萬 = 130萬元\n\n債息保障係數 = 600萬 ÷ 130萬 ≈ 4.615\n\n答案為 (D)。"}, {"id": "497ce98da4ae", "head": "公司減資有三種類型，包括有庫藏股減資、現金減資與虧損減資，試問在公司沒有虧損的情況之下，三種減資對公司影響的效果，下列何者正確？ I、均會使公司流通在外股數減少； II、均會使公司每股淨值增加； III、均會使公司股票價格上漲； IV、均會使公司每股盈餘上升", "opts": [["A", "I、II、III、IV"], ["B", "僅I、II、IV"], ["C", "僅II、III"], ["D", "僅I、IV"]], "ans": "D", "tag": "財務報表與財務比率分析（跨科）", "srcTxt": "113年第2次（Hard） 投資學筆記　第2題", "ex": "三種減資方式（庫藏股減資、現金減資、虧損減資）逐一檢視每個敘述：\n\nI、流通在外股數減少：庫藏股減資是註銷已買回股票；現金減資多採等比例收回股份並註銷；虧損減資則是減少股數以彌補累積虧損。三者皆會減少在外流通股數，成立。\n\nII、每股淨值增加：不一定成立。庫藏股減資的每股淨值變化取決於買回價格高於或低於原每股淨值；現金減資通常是股東權益與股數等比例縮減，每股淨值理論上不變（甚至若退還金額高於帳面價值還會下降）；只有虧損減資（總權益不變，僅科目重分類、股數減少）才會使每股淨值確定增加。因此「均會」不成立，此項不可全選。\n\nIII、股票價格上漲：股價是市場交易決定的結果，減資本身（不論何種類型）並不保證股價上漲，此為市場反應而非會計必然結果，不成立。\n\nIV、每股盈餘上升：三種減資皆使流通在外股數減少，而短期內公司淨利並未因減資而改變，故EPS＝淨利／股數，分母變小，EPS會上升，三者皆成立。\n\n綜合以上，僅 I、IV 均成立，答案為 (D)。![[treasury_stock_accounting_logic.svg|652]]"}, {"id": "3d5f429cee24", "head": "以VR值研判股市超買超賣區時，下列敘述何者正確？", "opts": [["A", "VR是基本面分析工具"], ["B", "VR值為0到100之間"], ["C", "VR值越小，代表進入超賣區"], ["D", "VR是價的技術指標"]], "ans": "C", "tag": "其他", "srcTxt": "113年第2次（Hard） 投資學筆記　第3題", "ex": "VR（Volume Ratio，成交量比率）是以成交量為基礎計算的技術指標，用來衡量一段期間內上漲日成交量與下跌日成交量的相對強弱，藉此判斷多空力道與買賣氣勢。\n\nVR值偏低，代表下跌日的成交量明顯大於上漲日，賣壓沉重，市場可能已過度下跌，故視為進入超賣區；VR值偏高則代表買氣過熱，視為超買區。一般以100為中軸（多空力道均等），實務上VR並非侷限在0至100之間，數值可遠高於100（例如超過150甚至350視為超買）。\n\n逐一檢視選項： (A) 錯，VR屬於「量」的技術分析工具，非基本面分析工具。 (B) 錯，VR值範圍不侷限於0–100，可高於100。 (C) 正確，VR值越小表示賣方力道相對強，市場進入超賣區。 (D) 錯，VR是以「成交量」為基礎的指標，並非以「價格」為基礎。\n\n答案為 (C)。"}, {"id": "0873c80681db", "head": "假設期望殖利率固定不變，債券愈趨近到期日時，下列敘述何者正確？甲.折價債券價格會趨近債券面額；乙.溢價債券價格會趨近債券面額；丙.溢價債券價格會遠離債券面額", "opts": [["A", "僅甲、乙"], ["B", "僅甲、丙"], ["C", "僅乙、丙"], ["D", "甲、乙、丙"]], "ans": "A", "tag": "債券評價與價格利率關係", "srcTxt": "113年第2次（Hard） 投資學筆記　第4題", "ex": "債券價格＝未來現金流量（票息＋面額）以殖利率折現之現值。在殖利率固定不變的前提下，隨到期日逼近，折現期數縮短，債券價格會逐漸「收斂」至面額，此現象稱為債券的「拉力效應（pull to par）」。\n\n甲、折價債券（票面利率低於殖利率，價格低於面額）：隨到期日接近，價格會逐步上升，趨近面額，正確。\n\n乙、溢價債券（票面利率高於殖利率，價格高於面額）：隨到期日接近，價格會逐步下降，同樣趨近面額，正確。\n\n丙、與乙互斥，溢價債券價格是趨近而非遠離面額，錯誤。\n\n故甲、乙正確，丙錯誤，答案為 (A)。"}, {"id": "d24215d25e98", "head": "若甲股票的標準差為0.25，甲和乙股票的共變異數是0.005，甲和乙股票的相關係數為0.5，則乙股票的標準差為：", "opts": [["A", "0.125"], ["B", "0.04"], ["C", "0.15"], ["D", "0.02"]], "ans": "B", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "113年第2次（Hard） 投資學筆記　第5題", "ex": "兩證券共變異數與相關係數的關係式為：\n\n共變異數（Cov）＝相關係數（ρ）× 甲標準差（σ甲）× 乙標準差（σ乙）\n\n代入已知數值：\n\n0.005 = 0.5 × 0.25 × σ乙 0.005 = 0.125 × σ乙 σ乙 = 0.005 ÷ 0.125 = 0.04\n\n答案為 (B)。"}, {"id": "7429dc08f1d9", "head": "某一標的物市價40元，執行價格43元之賣權價格為5元，則此賣權之內含價值為何？", "opts": [["A", "5元"], ["B", "3元"], ["C", "2元"], ["D", "0元"]], "ans": "B", "tag": "選擇權評價（B-S／二項式／買賣權平價）", "srcTxt": "113年第2次（Hard） 投資學筆記　第6題", "ex": "賣權（Put Option）為持有人有權以執行價格「賣出」標的物，因此賣權的內含價值計算式為：\n\n內含價值 = Max（執行價格 − 標的物市價，0）\n\n代入已知數值：\n\n執行價格43元 − 市價40元 = 3元，且3元大於0，故該賣權為價內（in the money）。\n\n內含價值 = 3元\n\n注意：題目給定之「賣權價格5元」為權利金（市場價格），並非內含價值；5元中扣除內含價值3元後，剩餘2元為時間價值，兩者不可混淆。\n\n答案為 (B)。"}, {"id": "c15717ab51f0", "head": "由兩種股票組成的投資組合圖形中，當其報酬率相關係數等於多少時，其各組合點為一直線？", "opts": [["A", "0"], ["B", "0.5"], ["C", "1"], ["D", "-1"]], "ans": "C", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "113年第2次（Hard） 投資學筆記　第7題", "ex": "兩資產組成投資組合時，組合的標準差為：\n\nσp = √(w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂)\n\n當相關係數ρ＝1（兩資產報酬率完全正相關）時，上式可化簡為完全平方式：\n\nσp = √(w₁σ₁ + w₂σ₂)² = w₁σ₁ + w₂σ₂\n\n此時組合標準差為兩資產標準差的加權平均，屬線性關係，故在風險（標準差）－報酬率平面上，所有可行組合點會落在連接兩資產的一條直線上。\n\n其他選項檢視： (A) ρ＝0：組合曲線向左彎曲（具風險分散效果），非直線。 (B) ρ＝0.5：同樣呈彎曲曲線，分散效果較ρ＝0時弱。 (D) ρ＝－1：組合會呈現兩段折線（可組合出風險為零的組合點），並非單一直線。\n\n答案為 (C)。"}, {"id": "02336c19bf6e", "head": "假設資本資產定價模式成立，若市場投資組合之期望報酬率與變異數分別為12%與0.04，投資組合P為一個效率投資組合，其變異數為0.16。當無風險利率為2%，則投資組合P之期望報酬率應為：", "opts": [["A", "22%"], ["B", "24%"], ["C", "36%"], ["D", "16%"]], "ans": "A", "tag": "效率前緣與最適投資組合", "srcTxt": "113年第2次（Hard） 投資學筆記　第8題", "ex": "由於投資組合P為效率投資組合（落在資本市場線CML上），代表P是市場投資組合與無風險資產的組合，兩者報酬率完全正相關（ρ=1）。此情況下，P的Beta係數可直接以兩者標準差之比計算，而不需個別求共變異數：\n\n市場投資組合標準差 σM = √0.04 = 0.2 投資組合P標準差 σP = √0.16 = 0.4\n\nBeta係數 = σP ÷ σM = 0.4 ÷ 0.2 = 2\n\n依資本資產定價模型（CAPM）：\n\nE(Rp) = 無風險利率 + Beta × [市場期望報酬率 − 無風險利率] = 2% + 2 × (12% − 2%) = 2% + 20% = 22%\n\n答案為 (A)。"}, {"id": "cc8051c790b2", "head": "甲公司決定於明年起發放股利，首發股利為每股$0.60，預期每年股利金額成長4%。假設折現率為12%，請問三年後的今天，該公司股票價格為：", "opts": [["A", "$7.50"], ["B", "$7.72"], ["C", "$8.23"], ["D", "$8.44"]], "ans": "D", "tag": "其他", "srcTxt": "113年第2次（Hard） 投資學筆記　第9題", "ex": "本題屬股利固定成長模式（Gordon Growth Model），股價等於「下一期股利」除以「折現率與成長率之差」：\n\nPₜ = D(t+1) ÷ (r − g)\n\n首發股利D₁＝0.60元（於第1年發放），每年成長率g＝4%，折現率r＝12%。\n\n站在「三年後的今天」（時點3）評價股價，所需的「下一期股利」是第4年發放的股利D₄：\n\nD₄ = D₁ × (1+g)³ = 0.60 × (1.04)³ = 0.60 × 1.124864 = 0.674918\n\nP₃ = D₄ ÷ (r − g) = 0.674918 ÷ (0.12 − 0.04) = 0.674918 ÷ 0.08 ≈ 8.436\n\n四捨五入後約為8.44元。\n\n（注意：若題目問的是「今天」的股價P₀，則應為D₁/(r-g)=0.60/0.08=7.5元，即選項A，但本題問的是三年後，需多成長三期股利，故非7.5。）\n\n答案為 (D)。"}, {"id": "79c5011fd404", "head": "計算淨現值（NPV）時應考慮哪些資訊？甲.現金流量；乙.風險；丙.利率", "opts": [["A", "僅甲、乙"], ["B", "僅甲、丙"], ["C", "僅乙、丙"], ["D", "甲、乙、丙"]], "ans": "D", "tag": "其他", "srcTxt": "113年第2次（Hard） 投資學筆記　第10題", "ex": "NPV的計算方式為：將專案未來各期預期現金流量，以能反映該投資風險程度的折現率（利率）逐一折現後加總，再減去期初投入成本。\n\n甲、現金流量：NPV的計算基礎即為各期現金流入與流出，必要，成立。\n\n乙、風險：折現率須反映該現金流量的風險程度（風險愈高，要求報酬率／折現率愈高），若忽略風險，折現率將失真，成立。\n\n丙、利率（折現率）：現金流量須透過折現率換算為現值才能加總比較，缺少利率即無法進行折現，成立。\n\n三者皆為計算NPV不可或缺的資訊，缺一不可，故甲、乙、丙皆須考慮。\n\n答案為 (D)。"}, {"id": "a1284a0289b5", "head": "在趨向指標DMI實務中，計算±DI線時一般採用幾日的±DI線？", "opts": [["A", "9"], ["B", "12"], ["C", "14"], ["D", "26"]], "ans": "C", "tag": "技術分析", "srcTxt": "113年第2次（Hard） 投資學筆記　第11題", "ex": "DMI（動向指標，Directional Movement Index）由技術分析大師J. Welles Wilder所提出，與RSI、ATR等指標同屬其經典著作中的技術工具，Wilder原始設計之標準參數即為14日，計算+DI、-DI及其後續的ADX時，實務上多沿用此14日為基準參數。\n\n其他選項檢視： (A) 9日：屬於較短週期參數，訊號較敏感但雜訊亦較多，非DMI標準設定。 (B) 12日：非DMI主流慣用參數。 (D) 26日：屬偏長週期參數，反應較遲緩，常見於MACD、EMA等指標，而非DMI標準參數。\n\n答案為 (C)。"}, {"id": "df40897f4d03", "head": "甲公司發行一永續債券，票面利率為6%，每張面額10萬元，若目前同類型債券可提供7%，請問其發行價格應為：", "opts": [["A", "85,714元"], ["B", "70,000元"], ["C", "80,000元"], ["D", "75,000元"]], "ans": "A", "tag": "債券評價與價格利率關係", "srcTxt": "113年第2次（Hard） 投資學筆記　第12題", "ex": "永續債券（Perpetuity Bond）沒有到期日，會永久發放固定利息，其發行價格（現值）計算式為：\n\n發行價格 = 每年利息 ÷ 市場要求殖利率\n\n每年利息 = 面額 × 票面利率 = 100,000 × 6% = 6,000元\n\n發行價格 = 6,000 ÷ 7% = 85,714.28元（四捨五入為85,714元）\n\n由於市場要求殖利率（7%）高於票面利率（6%），該債券須以折價方式發行，發行價格低於面額10萬元，此結果亦與折價邏輯相符。\n\n答案為 (A)。"}, {"id": "73e685717d5c", "head": "下列何者不屬於領先指標？", "opts": [["A", "實質海關出口值"], ["B", "實質半導體設備進口值"], ["C", "外銷訂單動向指數"], ["D", "實質貨幣總計數M1B"]], "ans": "A", "tag": "總體經濟、貨幣政策與利率", "srcTxt": "113年第2次（Hard） 投資學筆記　第13題", "ex": "我國景氣對策信號區分為領先指標、同時指標與落後指標三類，用以分別預示、反映及確認景氣循環階段。\n\n領先指標（用於預測未來景氣走向）之組成項目包括：外銷訂單動向指數、實質貨幣總計數M1B、股價指數、實質半導體設備進口值、製造業營業氣候測驗點、工業及服務業受僱員工淨進入率、核發建照面積（住宅、商辦及工業用）等。\n\n同時指標（反映當前景氣狀況）之組成項目則包括：實質海關出口值、工業生產指數、電力（企業）總用電量、製造業銷售量指數、批發、零售及餐飲業營業額、非農業部門就業人數、實質機械及電機設備進口值等。\n\n由上可知，(B)實質半導體設備進口值、(C)外銷訂單動向指數、(D)實質貨幣總計數M1B均屬領先指標；而(A)實質海關出口值則屬於同時指標，並非領先指標。\n\n答案為 (A)。"}, {"id": "e53da2d4f675", "head": "保本型商品的特色為：甲.投資人在可預知最大風險之下，享有獲得高報酬的機會；乙.保證一定百分比的本金發還", "opts": [["A", "僅甲"], ["B", "僅乙"], ["C", "甲、乙皆正確"], ["D", "甲、乙皆不正確"]], "ans": "C", "tag": "共同基金與 ETF", "srcTxt": "113年第2次（Hard） 投資學筆記　第14題", "ex": "保本型商品（Principal Guaranteed Note）之典型結構，是將大部分資金投入固定收益工具（如零息債券），利用到期本息回補本金保證部位；剩餘小部分資金則投入衍生性金融商品（如選擇權），以參與標的市場的上漲潛力，藉此爭取額外報酬。\n\n甲、由於架構中最大損失部位（即用於衍生商品的資金比例）在發行時即已確定，投資人可事先預知最大風險上限，同時又保留參與市場獲取較高報酬的機會，敘述正確。\n\n乙、保本型商品的核心設計即在於到期時保證返還一定比例的本金（常見為100%或90%等，視保本率設定而定），此為此類商品區別於一般結構型商品的關鍵特徵，敘述正確。\n\n甲、乙二者皆正確地描述了保本型商品「風險可預知」與「本金保障」的核心特色，二者並不衝突而是互為補充。\n\n答案為 (C)。"}, {"id": "3fdcea4b433c", "head": "執行認購權證之權利時，在現金給付之情形下，需交付：甲.手續費；乙.認購股款；丙.證券交易稅", "opts": [["A", "僅乙"], ["B", "僅甲、乙"], ["C", "僅甲、丙"], ["D", "甲、乙、丙"]], "ans": "D", "tag": "認購（售）權證", "srcTxt": "113年第2次（Hard） 投資學筆記　第15題", "ex": "認購權證持有人於履約（執行認購權利）時，即使結算方式採「現金給付」（依標的證券收盤價與履約價之差額以現金結算，而非直接交付標的證券），程序上仍須依「先足額認購、再依差價結算」的方式辦理：\n\n甲、手續費：投資人辦理履約申請時，需支付相關手續費用，成立。\n\n乙、認購股款：履約時投資人仍須依履約價格繳交足額認購股款（即視同實際買進標的證券所需價金），作為計算履約損益之基礎，成立。\n\n丙、證券交易稅：履約過程涉及標的證券之視同買賣，依規定仍須課徵證券交易稅，成立。\n\n因此即便最終以現金差價方式結算損益，投資人於執行認購權證之權利時，手續費、認購股款、證券交易稅三項費用均須一併繳交，僅係最終依差價結算多退少補。\n\n答案為 (D)。"}, {"id": "3e28b5121556", "head": "公司的營運槓桿越大，表示何種資產所占的比重越大？", "opts": [["A", "固定資產"], ["B", "流動資產"], ["C", "長期負債"], ["D", "短期負債"]], "ans": "A", "tag": "其他", "srcTxt": "113年第2次（Hard） 投資學筆記　第16題", "ex": "營運槓桿（Operating Leverage）衡量的是公司營運成本結構中，固定成本相對於變動成本的比重。營運槓桿越大，代表固定成本占營業成本的比重越高，當銷售量變動時，營業利益（EBIT）的波動幅度會被放大。\n\n固定成本主要來自於固定資產投資，例如廠房、機器設備等，其成本以折舊、維護費等形式反映，不隨產銷量增減而變動。因此，公司固定資產占總資產的比重越高，通常代表其固定成本比重也越高，營運槓桿因而越大。\n\n其他選項檢視： (B) 流動資產：屬短期週轉性資產（如存貨、應收帳款），其相關成本多為變動成本，與營運槓桿關聯性低。 (C) 長期負債、(D) 短期負債：兩者皆屬於資金來源（融資面），影響的是「財務槓桿」而非「營運槓桿」，不應與資產結構之營運槓桿混淆。\n\n答案為 (A)。"}, {"id": "afe6d62f482d", "head": "一個剛發行 5 年期債券，面額$100,000，票面利率 10%，每半年付息一次，發行時殖利率為8%，發行價格為$108,111，若殖利率維持不變，試計算該債券半年後的價格約為多少？", "opts": [["A", "$106,760"], ["B", "$107,435"], ["C", "$111,760"], ["D", "$112,435"]], "ans": "B", "tag": "債券評價與價格利率關係", "srcTxt": "113年第2次（Hard） 投資學筆記　第17題", "ex": "每期利息：100,000 × 10% × 0.5 = 5,000 每期殖利率：8% × 0.5 = 4%\n\n發行價 $108,111 是未來 10 期利息與到期本金按 4% 折現後的總現值。半年後每筆未來現金流都少折現一期，等同全部乘以 1.04：\n\n108,111 × 1.04 = 112,435（此為含息價格，因為此時剛好要領的那筆 5,000 利息還算在裡面）\n\n半年後這筆 5,000 利息已實際領取，需扣除，才是債券本身的價格：\n\n112,435 − 5,000 = 107,435\n\n答案為 (B) $107,435。"}, {"id": "fb9d41efb739", "head": "何者會改變公司之每股淨值？甲、盈餘轉增資；乙、發放現金股利；丙、依規定提撥法定盈餘公積；丁、股票分割", "opts": [["A", "僅甲、丙"], ["B", "僅乙、丙、丁"], ["C", "僅甲、乙、丁"], ["D", "甲、乙、丙、丁均會"]], "ans": "C", "tag": "財務報表與財務比率分析（跨科）", "srcTxt": "113年第3次（Medium） 投資學筆記　第1題", "ex": "每股淨值＝股東權益總額 ÷ 流通在外股數，凡使此比值發生變動者，即會改變每股淨值。逐一檢視：\n\n甲、盈餘轉增資：屬於權益內部項目重分類（保留盈餘轉為股本），股東權益總額並不改變，但流通在外股數因配發新股而增加，故每股淨值＝不變之權益 ÷ 增加之股數，結果下降，會改變每股淨值。\n\n乙、發放現金股利：公司以現金支付股利，使股東權益（保留盈餘）減少，而流通在外股數不變，故每股淨值下降，會改變每股淨值。\n\n丙、依規定提撥法定盈餘公積：此僅為股東權益內部項目間之重分類（由保留盈餘轉列為法定盈餘公積），股東權益總額與流通在外股數均不變，故不會改變每股淨值。\n\n丁、股票分割：股票分割僅使流通在外股數增加（如1股分割為2股），股東權益總額不變，故每股淨值下降，會改變每股淨值。\n\n綜上，會改變每股淨值者為甲、乙、丁，丙則不影響。"}, {"id": "1057aa19885b", "head": "有關分割債券特性的描述，下列何者正確？甲、利率風險較附息債券低；乙、無再投資風險；丙、Macaulay存續期間剛好為到期年限", "opts": [["A", "甲、乙、丙皆是"], ["B", "僅甲、乙"], ["C", "僅甲、丙"], ["D", "僅乙、丙"]], "ans": "D", "tag": "存續期間與凸性", "srcTxt": "113年第3次（Medium） 投資學筆記　第2題", "ex": "分割債券（Strip Bond，即零息債券形式）係將附息債券之本金與各期利息拆解，分別作為獨立零息證券出售，其特性與一般附息債券有所不同：\n\n甲、利率風險較附息債券低：此敘述錯誤。存續期間（duration）與利率風險呈正相關，分割債券因無票息收入、全部現金流集中於到期日一次取得，其存續期間等於到期年限，相較於同到期年限之附息債券（因中途配發利息，存續期間短於到期年限）為長，故分割債券之利率風險反而較附息債券為高，而非較低。\n\n乙、無再投資風險：此敘述正確。分割債券為零息證券，投資期間不配發利息，故不存在利息收入需再投資之情形，自然不受市場利率變動影響再投資報酬，即無再投資風險。\n\n丙、Macaulay存續期間剛好為到期年限：此敘述正確。由於零息債券之現金流僅於到期日一次發生，未有中途配息造成加權平均年限提前，故其Macaulay存續期間恰等於其到期年限。\n\n綜上，正確敘述為乙、丙，甲敘述有誤。"}, {"id": "c0be2717eef1", "head": "何種經濟指標是用來衡量一個標準家庭所消費勞務和物品之零售價格平均變動倍數？", "opts": [["A", "工業生產指數"], ["B", "躉售物價指數"], ["C", "消費者物價指數"], ["D", "國民生產毛額平減指數"]], "ans": "C", "tag": "總體經濟、貨幣政策與利率", "srcTxt": "113年第3次（Medium） 投資學筆記　第3題", "ex": "消費者物價指數（CPI）係以一組固定之消費籃子（涵蓋標準家庭日常所購買之商品與勞務，如食衣住行育樂等項目）為基礎，衡量該籃子內商品與勞務零售價格水準隨時間變動之平均倍數，用以反映一般家庭實際生活成本與購買力之變化，是最貼近本題所述「標準家庭所消費勞務和物品之零售價格平均變動倍數」定義之經濟指標。\n\n其餘選項則衡量不同層面： 工業生產指數係衡量工業部門之產出數量變動，而非價格。 躉售物價指數（WPI）係反映生產者、批發商等批發交易層級之商品價格變動，非最終消費者所面對之零售價格。 國民生產毛額平減指數（GNP Deflator）係衡量一國整體經濟產出（涵蓋所有商品與勞務，非僅家庭消費部分）之價格水準變動，範圍較CPI廣泛，且非以零售價格為衡量基礎。"}, {"id": "39777277bc98", "head": "下列總體指標中，I、長期利率低於短期利率；II、BB級債券和AAA級債券風險利差擴大；III、M1B成長率大於M2成長率。何者情況反映了景氣可能衰退的現象？", "opts": [["A", "僅II和III"], ["B", "僅I和II"], ["C", "僅I和III"], ["D", "I、II和III都是"]], "ans": "B", "tag": "其他", "srcTxt": "113年第3次（Medium） 投資學筆記　第4題", "ex": "逐一檢視各項總體指標與景氣循環之關係：\n\nI、長期利率低於短期利率：此即所謂「殖利率曲線倒掛」現象。正常情況下，長期利率因需承擔較長期間之通膨與信用風險，應高於短期利率；當長期利率反低於短期利率時，通常反映市場預期未來景氣轉弱、央行可能降息因應，故此現象常被視為景氣衰退之領先指標。\n\nII、BB級債券和AAA級債券風險利差擴大：BB級（投機等級）與AAA級（最高信用等級）債券間之利差，反映市場對信用風險之要求溢酬。當景氣轉弱、企業違約風險升高時，投資人會要求較高之風險溢酬以持有較低信用評等債券，導致利差擴大，故信用利差擴大亦為景氣衰退之徵兆。\n\nIII、M1B成長率大於M2成長率：M1B（涵蓋活期存款、支票存款等高流動性資金）成長率高於M2（涵蓋M1B加上定期存款等準貨幣）成長率，通常反映資金由定存等長期性資產轉向活期性、高流動性資產，顯示資金活動力增強、投資人偏好承擔風險資產，此現象通常出現於景氣擴張、股市熱絡階段，而非景氣衰退之徵兆。\n\n綜上，反映景氣可能衰退之現象為I與II，III則反映景氣擴張之現象。"}, {"id": "7ac3de46ad22", "head": "臺灣期貨交易所之個股選擇權之交易標的敘述何者「正確」？甲、上市櫃公司之普通股；乙、上市櫃公司之特別股；丙、上市櫃公司之受益憑證；丁、原則上契約單位為1,000股的標的證券", "opts": [["A", "僅甲、乙"], ["B", "僅甲、丙"], ["C", "僅甲、丙、丁"], ["D", "甲、乙、丙、丁"]], "ans": "B", "tag": "選擇權基本概念與到期損益", "srcTxt": "113年第3次（Medium） 投資學筆記　第5題", "ex": "逐一檢視各項敘述：\n\n甲、上市櫃公司之普通股：臺灣期貨交易所個股選擇權之標的證券，其中一大類即為上市（櫃）公司之普通股，此敘述正確。\n\n乙、上市櫃公司之特別股：個股選擇權之標的證券範圍並不包含特別股，特別股因股性偏向固定收益、流動性與波動性均與普通股不同，並非期交所選定作為衍生性商品標的之範疇，此敘述錯誤。\n\n丙、上市櫃公司之受益憑證：個股選擇權之標的證券除普通股外，亦包含符合條件之受益憑證（如ETF受益憑證），此類具高流動性、規模達一定門檻之受益憑證亦得作為選擇權標的，此敘述正確。\n\n丁、原則上契約單位為1,000股的標的證券：依臺灣期貨交易所規定，個股選擇權契約之交易單位原則上為2,000股標的證券（而非1,000股），此為題目誤植之敘述，故此敘述錯誤。\n\n綜上，正確之敘述為甲、丙。"}, {"id": "20bd8be359ba", "head": "某投資組合之報酬率為12%，報酬率標準差為12.5%，β係數為1.25，若無風險利率為4%，請問其夏普（Sharpe）指標為何？", "opts": [["A", "7.2%"], ["B", "64%"], ["C", "8.3%"], ["D", "80%"]], "ans": "B", "tag": "績效評估（夏普／崔納／詹森）", "srcTxt": "113年第3次（Medium） 投資學筆記　第6題", "ex": "夏普指標（Sharpe Ratio）之計算公式為：\n\n夏普指標＝（投資組合報酬率－無風險利率）÷ 投資組合報酬率標準差\n\n代入題目數據：\n\n（12% － 4%）÷ 12.5% ＝ 8% ÷ 12.5% ＝ 0.64＝64%\n\n須注意，夏普指標係以報酬率之「標準差」（總風險）作為分母，而非β係數；題目所給之β係數1.25屬於計算「崔納指標（Treynor Ratio）」時所需之分母（（12%－4%）÷1.25＝6.4%），並非夏普指標之計算基礎，此處為干擾選項，計算夏普指標時應予排除不用。"}, {"id": "24385b0f2ce6", "head": "在景氣循環的蕭條期末期，股價總指數一般呈：", "opts": [["A", "上升走勢"], ["B", "下跌走勢"], ["C", "持平狀態"], ["D", "不確定"]], "ans": "A", "tag": "總體經濟、貨幣政策與利率", "srcTxt": "113年第3次（Medium） 投資學筆記　第7題", "ex": "股價指數屬於景氣循環之「領先指標」，其變動通常領先於實質經濟活動（如生產、就業、所得等）約數個月時間，反映市場對未來經濟情勢之預期心理，而非同步反映當下之實際景氣狀況。\n\n當景氣處於蕭條期末期時，實質經濟活動（如生產、消費）雖仍處於低迷狀態，但市場參與者已預期景氣即將觸底、進入復甦階段，投資人基於此預期提前進場布局，使股價指數在實質景氣尚未回升之前，即已開始反映此一預期而轉為上升走勢。此即股市「先行落底、先行反彈」之領先特性。"}, {"id": "d69daf5d2d88", "head": "老王以94,787元買進一張面額100,000元的零息債券，到期期間為一年，請問該投資的預期報酬率為何？（忽略交易成本）", "opts": [["A", "5.2%"], ["B", "5.5%"], ["C", "5.7%"], ["D", "5.9%"]], "ans": "B", "tag": "債券種類與特性（公債／可轉債／附條件）", "srcTxt": "113年第3次（Medium） 投資學筆記　第8題", "ex": "零息債券之預期報酬率（殖利率）計算公式為：\n\n報酬率＝（到期面額－買進價格）÷ 買進價格\n\n代入題目數據：\n\n（100,000 － 94,787）÷ 94,787 ＝ 5,213 ÷ 94,787 ＝ 0.0549 ＝ 5.49% ≈ 5.5%\n\n由於到期期間恰為一年，故此報酬率即為年化預期報酬率，取最接近之選項。"}, {"id": "7a8e9deea2cd", "head": "何者為DMI的買進訊號？", "opts": [["A", "K線由下往上的突破D線"], ["B", "DIF線由下往上突破DEM線"], ["C", "+DI線由下往上突破-DI線"], ["D", "+DI線由上向下跌破-DI線"]], "ans": "C", "tag": "技術分析", "srcTxt": "113年第3次（Medium） 投資學筆記　第9題", "ex": "DMI（動向指標，Directional Movement Index）是由+DI（上升方向指標）與－DI（下降方向指標）兩條線所構成，用以判斷多空力道之相對強弱，並常搭配ADX（平均趨向指標）判斷趨勢強度。\n\n逐一檢視各選項： (A) K線由下往上突破D線：K線、D線屬於KD隨機指標（Stochastic Oscillator）之範疇，並非DMI指標之組成要素，此選項張冠李戴。 (B) DIF線由下往上突破DEM線：DIF、DEM（或稱MACD、Signal線）屬於MACD指標之組成要素，同樣並非DMI指標，此選項亦屬混淆。 (C) +DI線由下往上突破-DI線：當+DI（多方力道）由下往上穿越-DI（空方力道）時，代表多方力道開始轉強、超越空方力道，為DMI指標所定義之標準買進訊號，此選項正確。 (D) +DI線由上向下跌破-DI線：此情形代表多方力道轉弱、空方力道轉強，為DMI指標之賣出（轉空）訊號，而非買進訊號。"}, {"id": "6c502dac29b7", "head": "甲、乙兩種具有相同票面利率、面額及到期殖利率之中央政府債券，目前均屬溢價債券，若甲債券尚餘4年到期，乙債券尚餘2年到期，則：", "opts": [["A", "甲債券溢價額較乙債券溢價額大"], ["B", "甲債券溢價額與乙債券溢價額相等"], ["C", "甲債券溢價額較乙債券溢價額小"], ["D", "無法比較"]], "ans": "A", "tag": "債券評價與價格利率關係", "srcTxt": "113年第3次（Medium） 投資學筆記　第10題", "ex": "當債券之票面利率高於到期殖利率（市場利率）時，該債券即屬於溢價債券，其市價會高於面額。溢價之產生原因在於：投資人每期可領到高於市場利率之票息，此「超額票息」相對於市場利率之現值加總，即構成溢價部分。\n\n由於甲、乙兩債券具有相同之票面利率、面額及到期殖利率，兩者每期產生之「超額票息」金額相同；差異僅在於剩餘到期期間之長短。甲債券尚餘4年到期，表示投資人尚可領取4期（或依付息頻率計）之超額票息；乙債券僅剩2年到期，可領取之超額票息期數較少。\n\n由於溢價金額即為未來各期超額票息之現值加總，剩餘期數越多，可折現回來的超額票息現值加總越大，溢價金額也就越高。因此，剩餘4年到期之甲債券，其溢價額會大於僅剩2年到期之乙債券。"}, {"id": "0e3693b28e66", "head": "下列何者是影響債券存續期間(Duration)的因素？甲.到期期間；乙.票面利率；丙.到期收益率；丁.票面值", "opts": [["A", "僅甲、丙"], ["B", "僅乙、丙、丁"], ["C", "僅甲、乙、丙"], ["D", "甲、乙、丙、丁皆是"]], "ans": "C", "tag": "存續期間與凸性", "srcTxt": "114年第1次（Medium） 投資學筆記　第1題", "ex": "存續期間（Duration）衡量的是債券現金流的加權平均到期時間，其大小取決於各期現金流的「現值權重分佈」，而非現金流的絕對金額大小。\n\n甲、到期期間：期間越長，現金流分佈越分散、越往後延，Duration 越大，會影響。\n\n乙、票面利率：票面利率越高，早期領到的利息越多，現值權重往前移，Duration 越小；票面利率越低（如零息債券）Duration 越接近到期期間。會影響。\n\n丙、到期收益率（殖利率）：殖利率越高，遠期現金流被折現得越重，現值權重往前移，Duration 越小。會影響。\n\n丁、票面值：票面值只是把每期現金流（利息與本金）等比例放大或縮小，並不會改變各期現金流「現值佔總現值的比例」，因此不影響 Duration。\n\n故存續期間的影響因素為甲、乙、丙，答案為 (C)。"}, {"id": "34c186264ca9", "head": "對能量潮指標 OBV 的描述，何者不正確？", "opts": [["A", "OBV 利用成交量的累算，來研判股市內人氣是否匯集或渙散"], ["B", "OBV 為 1963 年葛蘭碧（J. Granville）提出"], ["C", "累積 OBV 線可與大盤指數研判背離現象"], ["D", "當日大盤下跌時，今日 OBV 值要加上今日成交股數"]], "ans": "D", "tag": "技術分析", "srcTxt": "114年第1次（Medium） 投資學筆記　第3題", "ex": "OBV（On Balance Volume，能量潮）的計算邏輯是：以成交量的正負累加來反映買賣氣勢，規則為\n\n當日收盤價（或指數）上漲：今日 OBV ＝ 昨日 OBV ＋ 今日成交量\n\n當日收盤價（或指數）下跌：今日 OBV ＝ 昨日 OBV － 今日成交量\n\n當日持平：今日 OBV ＝ 昨日 OBV（不變）\n\n逐項檢視：\n\n(A) OBV 本質就是透過成交量的累算，觀察資金（人氣）是匯集流入還是渙散流出，敘述正確。\n\n(B) OBV 確實是 1963 年由葛蘭碧（Joseph Granville）所提出的技術指標，敘述正確。\n\n(C) OBV 線與股價（大盤指數）走勢的背離，是這個指標最主要的應用之一（例如股價創新高但 OBV 未創新高，視為背離、警示訊號），敘述正確。\n\n(D) 依 OBV 計算規則，大盤「下跌」時應該是把今日成交量從昨日 OBV 中「扣除」，而不是「加上」；此選項把下跌日的處理方式誤植為上漲日的算法，敘述不正確。\n\n答案為 (D)。"}, {"id": "7dc2fef50181", "head": "設無風險利率為 4%，市場預期報酬率為 10%。證券 X 之貝它係數為 1.3，其報酬率預期為10%，則投資者應：", "opts": [["A", "買入證券 X，因其價格低估"], ["B", "賣出證券 X，因其價格低估"], ["C", "賣出證券 X，因其價格高估"], ["D", "買入證券 X，因其價格高估"]], "ans": "C", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "114年第1次（Medium） 投資學筆記　第4題", "ex": "先用 CAPM（資本資產定價模型）算出證券 X 在承擔 1.3 倍系統性風險下，「應該」要求的合理報酬率：\n\n要求報酬率 ＝ 無風險利率 ＋ β ×（市場預期報酬率 － 無風險利率） ＝ 4% ＋ 1.3 ×（10% － 4%） ＝ 4% ＋ 1.3 × 6% ＝ 4% ＋ 7.8% ＝ 11.8%\n\n也就是說，以證券 X 承擔的風險程度來看，市場理應提供 11.8% 的報酬才合理。但題目給出證券 X「實際預期報酬」只有 10%，低於應得的 11.8%。\n\n當一檔證券承擔了相對應的風險，卻只能提供比合理報酬更低的預期報酬，代表目前的價格被「高估」了（因為投資人付出的價格已經把未來報酬壓低到不合理的水準）；理性投資人應該賣出這種價格過高、報酬過低的證券。\n\n逐項檢視：\n\n(A)(D) 買入：與應該賣出的結論矛盾，排除。\n\n(B) 賣出、低估：操作方向正確，但理由錯誤（應為高估非低估）。\n\n(C) 賣出、高估：操作與理由皆正確。\n\n答案為 (C) 賣出證券 X，因其價格高估。"}, {"id": "75d5c8fae13a", "head": "中央銀行在公開市場上買入國庫券是屬於：", "opts": [["A", "擴張性的貨幣政策"], ["B", "擴張性的財政政策"], ["C", "緊縮性的貨幣政策"], ["D", "緊縮性的財政政策"]], "ans": "A", "tag": "總體經濟、貨幣政策與利率", "srcTxt": "114年第1次（Medium） 投資學筆記　第5題", "ex": "央行透過「公開市場操作」買入國庫券，等於是把資金釋放到銀行體系，會增加銀行的準備金與市場的貨幣供給量，進而壓低利率、刺激借貸與投資，這屬於「擴張性的貨幣政策」。\n\n判斷這類題目的關鍵在於分辨兩個維度：\n\n操作機關：中央銀行的操作屬於「貨幣政策」；政府（財政部）的支出與稅收決策才屬於「財政政策」。\n\n操作方向：買入證券（放錢出去）＝擴張；賣出證券（收錢回來）＝緊縮。\n\n逐項檢視：\n\n(B) 擴張性的財政政策：財政政策指的是政府增加支出或減稅等操作，並非央行行為，主體錯誤。\n\n(C) 緊縮性的貨幣政策：方向相反，緊縮應該是央行「賣出」證券以回收資金、縮減貨幣供給，此處是「買入」，方向錯誤。\n\n(D) 緊縮性的財政政策：指政府減少支出或增稅，同樣主體與方向皆錯誤。\n\n答案為 (A) 擴張性的貨幣政策。"}, {"id": "beab049ed064", "head": "下列敘述何者不是道氏理論的缺點？", "opts": [["A", "技術指標有鈍化的現象"], ["B", "道氏理論的買賣訊號往往落後於大盤約 20% 至 25%"], ["C", "道氏理論只告訴投資人市場趨勢，不能告訴投資人買進何種股票"], ["D", "投資人不能接受指數將反映所有的新聞和統計的基本觀念"]], "ans": "A", "tag": "技術分析", "srcTxt": "114年第1次（Medium） 投資學筆記　第6題", "ex": "道氏理論（Dow Theory）常被提及的缺點主要有三項：\n\n訊號落後：道氏理論須等到趨勢確立（如突破前波高低點）才發出買賣訊號，因此進出場時機往往落後大盤實際轉折約 20% 至 25%，這是道氏理論最常被批評之處，屬於缺點。\n\n僅能判斷大盤趨勢：道氏理論的分析對象是市場整體指數（如道瓊工業指數），只能協助投資人判斷「市場處於多頭或空頭趨勢」，無法據以挑選個股或建議買進何種股票，這也是道氏理論常被提及的限制，屬於缺點。\n\n指數反映一切的基本假設過於絕對：道氏理論的三大前提之一是「指數（股價）已反映所有已知資訊」，但這個假設過於武斷（例如無法反映突發、未預期的事件），投資人若照單全收會有風險，這也是道氏理論常被批評的缺點之一。\n\n反觀 (A)「技術指標有鈍化的現象」，鈍化（Divergence 失靈、指標在極端行情下失去判斷力）是像 RSI、KD 等「其他技術指標」常見的問題，並非道氏理論本身的特性或缺點，道氏理論本身並不涉及這類「指標鈍化」的概念，這句敘述講的是別的技術分析工具的問題，張冠李戴到道氏理論頭上，因此它不是道氏理論的缺點。\n\n答案為 (A)。"}, {"id": "f674c8b7567d", "head": "請問根據下列對於「美元指數(U.S. Dollar Index)」的描述，何者有誤？", "opts": [["A", "衡量美元在國際外匯市場匯率變化的一項綜合指標"], ["B", "美元指數如果跌破 100 點，反應了資金從美國本土撤出的趨勢"], ["C", "該指數是由美元對六個主要國際貨幣（歐元、日元、英鎊、澳幣、瑞典克朗和瑞士法郎）的匯率經過加權幾何平均數計算獲得"], ["D", "美元指數下降，有利於美國出口"]], "ans": "C", "tag": "報酬率計算（幾何／算術／持有期間）", "srcTxt": "114年第1次（Medium） 投資學筆記　第7題", "ex": "美元指數（USDX）的貨幣籃子組成是固定的六種貨幣：歐元、日圓、英鎊、加拿大元、瑞典克朗、瑞士法郎（其中歐元權重最高，約57.6%），並且是以「加權幾何平均數」計算而得。\n\n(C) 選項把貨幣籃子中的「加拿大元」誤植為「澳幣」，屬於構成成分錯誤，因此描述有誤，這正是本題要挑出的答案。\n\n其他選項檢視：\n\n(A) 美元指數確實是衡量美元對一籃子主要貨幣整體強弱變化的綜合性指標，敘述正確。\n\n(B) 美元指數以 100 為基準點（1973年3月為基期），若指數跌破 100，代表美元相對於基期籃子貨幣走弱，也隱含資金可能從美元資產或美國本土流出、轉向其他貨幣或資產，敘述合理正確。\n\n(D) 美元指數（即美元匯率）下降，代表美元相對其他貨幣貶值，以外幣計價的美國商品變得相對便宜，有利於刺激美國出口，敘述正確。\n\n答案為 (C)。"}, {"id": "b610caac3b74", "head": "某基金年化報酬率 12%，年化標準差 8%，beta 係數為 2，無風險利率 2%，則該基金的崔納（Treynor）指標為：", "opts": [["A", "6%"], ["B", "5%"], ["C", "1.5"], ["D", "1.25"]], "ans": "B", "tag": "績效評估（夏普／崔納／詹森）", "srcTxt": "114年第1次（Medium） 投資學筆記　第8題", "ex": "崔納指標（Treynor Ratio）用來衡量基金每承擔一單位「系統性風險（β）」所能獲得的超額報酬，公式為：\n\n崔納指標 ＝（基金報酬率 － 無風險利率）／ β\n\n代入題目數值：\n\n崔納指標 ＝（12% － 2%）／ 2 ＝ 10% ／ 2 ＝ 5%\n\n要注意，題目另外給的「年化標準差 8%」是計算「夏普指標（Sharpe Ratio）」時才會用到的總風險指標（夏普指標＝超額報酬／標準差），並不是崔納指標的分母；崔納指標只用 β（系統性風險）作分母，不是用標準差。這是本題設計來混淆考生的地方。\n\n答案為 (B) 5%。"}, {"id": "418ee9246fea", "head": "某一證券與市場投資組合相關係數為 0.75，且標準差為 0.20，若市場投資組合之平均報酬為15%，而標準差為 25%，無風險利率為 10%，此資產之期望報酬為何？", "opts": [["A", "13%"], ["B", "13.75%"], ["C", "16%"], ["D", "15%"]], "ans": "A", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "114年第1次（Medium） 投資學筆記　第9題", "ex": "本題須先用相關係數與標準差求出證券的 β 係數，再代入 CAPM 公式求期望報酬。\n\n第一步，計算 β：\n\nβ ＝ ρ ×（σ_i ／ σ_M）\n\n其中 ρ（相關係數）＝ 0.75，σ_i（個別證券標準差）＝ 0.20，σ_M（市場標準差）＝ 0.25：\n\nβ ＝ 0.75 ×（0.20 ／ 0.25）＝ 0.75 × 0.8 ＝ 0.6\n\n第二步，代入 CAPM 公式：\n\nE(R_i) ＝ R_f ＋ β ×［E(R_M) － R_f］\n\n＝ 10% ＋ 0.6 ×（15% － 10%）\n\n＝ 10% ＋ 0.6 × 5%\n\n＝ 10% ＋ 3%\n\n＝ 13%\n\n答案為 (A) 13%。\n\n$β 的原始定義是衡量個別證券報酬相對於市場報酬的敏感度，公式為：$\n\n$β ＝ Cov(R_i, R_M) ／ Var(R_M) ＝ Cov(R_i, R_M) ／ σ_M²$\n\n$統計學上，相關係數的定義本來就是：$\n\n$ρ ＝ Cov(R_i, R_M) ／（σ_i × σ_M）$\n\n$把這個式子移項，反過來表示共變異數：$\n\n$Cov(R_i, R_M) ＝ ρ × σ_i × σ_M$\n\n$現在把這個「共變異數」代回 β 的原始定義式：$\n\n$β ＝ Cov(R_i, R_M) ／ σ_M²$  \n$＝（ρ × σ_i × σ_M）／ σ_M²$\n\n$分子分母同時有一個 σ_M，可以消掉一個：$\n\n$β ＝ ρ × σ_i ／ σ_M$\n\n$也就是題目公式 β ＝ ρ ×（σ_i／σ_M）的由來。$"}, {"id": "85da23515e81", "head": "公司採權益法評價之長期股權投資，若獲配發現金股利，則對認列該現金股利之當年度報表，下列敘述何者正確？", "opts": [["A", "流動比率增加"], ["B", "流動比率減少"], ["C", "流動比率不變"], ["D", "無法判斷"]], "ans": "A", "tag": "財務報表與財務比率分析（跨科）", "srcTxt": "114年第1次（Medium） 投資學筆記　第10題", "ex": "在權益法下，長期股權投資的帳面價值會隨被投資公司的損益按持股比例增減（認列投資收益／損失），因此當被投資公司宣告並發放現金股利時，這筆現金股利在權益法下並不視為「收益」，而是視為「投資成本的收回」，會計分錄為：\n\n借：現金（流動資產） 　貸：長期股權投資（非流動資產）\n\n這筆分錄的效果是：流動資產（現金）增加，同時非流動資產（長期股權投資）等額減少；流動負債完全不受影響。\n\n流動比率＝流動資產／流動負債。分子（流動資產）增加、分母（流動負債）不變，因此流動比率會上升，也就是增加。\n\n逐項檢視：\n\n(B) 流動比率減少：與實際方向相反，流動資產是增加而非減少，錯誤。\n\n(C) 流動比率不變：忽略了現金（流動資產）確實增加了，非流動資產的減少不影響流動比率，錯誤。\n\n(D) 無法判斷：由於分錄效果明確（流動資產增、流動負債不變），是可以判斷的，錯誤。\n\n答案為 (A) 流動比率增加。"}, {"id": "92c3e8c27ed6", "head": "有關公司債的敘述，何者「不正確」？", "opts": [["A", "收益債券是指發行公司有盈餘才會支付利息給投資人"], ["B", "指數債券是指其債券利率依通貨膨脹指數而定"], ["C", "可轉換債券是指投資人可依轉換價格，將其轉換為其他債券"], ["D", "信用債券是一種無擔保的債券"]], "ans": "C", "tag": "債券種類與特性（公債／可轉債／附條件）", "srcTxt": "114年第1次（Medium） 投資學筆記　第11題", "ex": "逐項檢視公司債各類型的定義：\n\n(A) 收益債券（Income Bond）：其特性是發行公司必須有盈餘時才需支付利息，若公司無盈餘則可不支付（或遞延），敘述正確。\n\n(B) 指數債券（Indexed Bond）：其票面利率（或本金）會隨通貨膨脹指數（如 CPI）等指標調整，以維持實質購買力，敘述正確。\n\n(C) 可轉換債券（Convertible Bond）：其設計是讓投資人可以在約定的轉換價格下，將手中的公司債轉換為「發行公司的普通股股票」，藉此參與公司股價上漲的利益，而不是轉換成「其他債券」。此選項把轉換標的講成「其他債券」，與可轉債的本質（債轉股）不符，因此敘述不正確。\n\n(D) 信用債券（Debenture）：又稱信用債券或無擔保公司債，僅憑發行公司的信用發行、無特定資產作為擔保品，敘述正確。\n\n答案為 (C)。"}, {"id": "142cd8cce782", "head": "動量指標（Momentum，簡稱 MTM）是運用股價變動的何種觀念來測量股價變動的趨勢？", "opts": [["A", "相對速度"], ["B", "加速度"], ["C", "絕對速度"], ["D", "靜態觀念"]], "ans": "B", "tag": "其他", "srcTxt": "114年第1次（Medium） 投資學筆記　第12題", "ex": "動量指標（MTM）的計算方式是取「當日收盤價」與「N 日前收盤價」的差值（MTM = 今日收盤價 − N 日前收盤價），衡量的是股價在固定期間內的變動速率。\n\n這個概念類比物理學中的「加速度」：加速度是速度的變化率，反映的不是「目前移動有多快」（那是速度本身），而是「移動快慢的變化趨勢」（正在加快還是減慢）。同樣地，MTM 衡量的不是股價本身的漲跌位置，而是股價變動力道正在增強還是減弱，藉此提前捕捉價格趨勢即將反轉或持續的訊號。\n\n逐項排除：\n\n(A) 相對速度：MTM 並非比較兩個標的間的相對移動關係，而是同一標的自身前後期的變化，非此概念。\n\n(C) 絕對速度：若是「速度」本身，衡量的會是價格變動的單純快慢（如漲跌幅度），但 MTM 更著重的是「變化的變化」（漲勢是否加速或減速），比速度更進一步，故非絕對速度。\n\n(D) 靜態觀念：MTM 本質是動態、逐期比較的觀念，並非靜態。\n\n答案為 (B) 加速度。"}, {"id": "8eae0a535ca7", "head": "當利率有下跌趨勢時，下列哪一種證券投資較有利？", "opts": [["A", "票券"], ["B", "二十年後到期之公債"], ["C", "一年期可轉換定存單"], ["D", "十年後到期之公債"]], "ans": "B", "tag": "債券種類與特性（公債／可轉債／附條件）", "srcTxt": "114年第2次 投資學筆記　第1題", "ex": "正確答案為(B) 二十年後到期之公債。\n\n債券價格與市場利率呈反向關係：當市場利率下跌時，既有債券（票面利率固定）相對於新發行、較低票面利率之債券更具吸引力，其價格因而上漲；此漲幅大小取決於債券的存續期間（duration）／到期期限，期限越長，價格對利率變動的敏感度越高，利率下跌時價格上漲幅度也越大。此關係可由債券評價公式（將各期現金流以市場利率折現）理解：折現期數越多，利率變動對現值的影響會被複利放大，故長天期債券的價格波動幅度遠大於短天期工具。\n\n因此，在四個選項中，存續期間最長的「二十年後到期之公債」，於利率下跌趨勢下，價格漲幅最大，投資最為有利。\n\n其餘選項：\n\n(A) 票券屬於短期貨幣市場工具（如國庫券、商業本票，通常一年以內到期），存續期間短，利率敏感度低，價格波動幅度有限，受惠程度最小。\n\n(C) 一年期可轉換定存單同樣屬於短期金融工具，期限僅一年，價格對利率變動不敏感，受惠有限。\n\n(D) 十年後到期之公債雖同屬長期債券、亦受惠於利率下跌，但其存續期間（十年）短於二十年期公債，故價格漲幅小於二十年期公債，相對較不利。"}, {"id": "1d1776a4f59e", "head": "某公司的預期權益報酬率是5%，若該公司的股利政策為發放40%之現金股利，則在無外部融資假設下，其預期盈餘成長率是：", "opts": [["A", "8.33%"], ["B", "2%"], ["C", "3%"], ["D", "10%"]], "ans": "C", "tag": "證券市場結構與交易實務", "srcTxt": "114年第2次 投資學筆記　第2題", "ex": "正確答案為(C) 3%。\n\n在無外部融資（僅依賴內部保留盈餘再投資）的假設下，公司的可持續成長率（Sustainable Growth Rate）計算公式為：g＝ROE×留存率（Retention Ratio）。\n\n留存率＝1－股利發放率＝1－40%＝0.6（即60%）。\n\n代入公式：g＝ROE×留存率＝5%×0.6＝3%。\n\n此公式的邏輯在於：公司的權益（淨值）成長，完全來自於未分配出去、保留下來再投資的盈餘部分；ROE衡量每一元權益能創造多少報酬，留存率則決定這些報酬中有多少比例被保留、轉化為新增權益，兩者相乘即為權益（進而帶動盈餘）的成長率。"}, {"id": "c0a7bafa4f3e", "head": "下列何種債券有可能出現到期期間越長，而存續期間反而縮短情況？", "opts": [["A", "平價債券"], ["B", "深度溢價債券"], ["C", "深度折價債券"], ["D", "以上皆非"]], "ans": "C", "tag": "存續期間與凸性", "srcTxt": "114年第2次 投資學筆記　第3題", "ex": "正確答案為(C) 深度折價債券。\n\n一般而言，債券的存續期間（Duration）會隨到期期間（Maturity）的增加而增加，但這個關係並非在所有情況下都成立。對於「深度折價債券」（即票面利率遠低於市場殖利率、導致債券價格遠低於面額的長期、低息債券，極端情況如零息債券），存續期間與到期期間之間會出現非單調關係：當到期期間拉長超過某一臨界點後，存續期間反而會隨到期期間的增加而縮短，並隨到期期間趨近無限大時，收斂至一個固定值（(1＋y)/y，y為殖利率），此為固定收益理論中一個著名的特殊現象。\n\n其原因在於：深度折價債券的到期價值（本金部分）在債券總現值中占極大比重，當到期期間非常長時，遙遠未來才發生的本金償還，其現值權重會因高殖利率折現而變得極小，使得存續期間的計算（現金流時點以現值加權平均）反而受到早期利息現金流影響更大，導致存續期間不再隨到期期間單調遞增，甚至可能縮短。\n\n其餘選項：\n\n(A) 平價債券（票面利率等於殖利率）之存續期間會隨到期期間的增加而單調遞增，不會出現縮短情況。\n\n(B) 深度溢價債券（票面利率遠高於殖利率）同樣呈現存續期間隨到期期間單調遞增的正常關係，不會出現此特殊反轉現象。\n\n(D) 錯誤，因為深度折價債券確實可能出現此情況，故答案應為(C)而非「以上皆非」。"}, {"id": "04fa96329a74", "head": "下列有關指數投資證券(ETN)的敘述何者正確？", "opts": [["A", "無到期日"], ["B", "由投信公司發行"], ["C", "為主動型投資"], ["D", "ETN不得從事當沖交易"]], "ans": "D", "tag": "共同基金與 ETF", "srcTxt": "114年第2次 投資學筆記　第8題", "ex": "正確答案為(D) ETN不得從事當沖交易。\n\n指數投資證券（Exchange Traded Note, ETN）在我國證券市場的相關規定中，明文限制不得從事現股當日沖銷交易（當沖），此為ETN在交易制度上與一般股票、ETF較為不同之處，投資人須留意此項交易限制。\n\n其餘選項：\n\n(A) 錯誤。ETN具有明確的存續期間及到期日，發行人於到期時需依約定方式（通常參考標的指數表現）結算兌付，這也是ETN與ETF（無到期日，屬開放式、可持續發行贖回之基金型態）的核心差異之一。\n\n(B) 錯誤。ETN係由「證券商」發行，屬於證券商所發行之無擔保、無分本金保證之追蹤指數之債務憑證性質商品，而非由「投信公司」發行；投信公司發行的是ETF（指數股票型基金）。\n\n(C) 錯誤。ETN屬於被動式（passive）追蹤特定標的指數表現之商品，其設計目的在於使報酬儘量貼近所追蹤指數之表現，並非主動選股、由經理人主動調整持股的主動型投資工具。"}, {"id": "dbfe20f533d3", "head": "有關次級信用債券（Subordinated Debentures）之敘述，何者「正確」？甲.有資產作擔保品；乙.清算時，清償順序在高級債券之後；丙.通常可以轉換為公司之普通股", "opts": [["A", "僅甲、乙"], ["B", "僅乙"], ["C", "僅乙、丙"], ["D", "甲、乙、丙"]], "ans": "C", "tag": "其他", "srcTxt": "114年第2次 投資學筆記　第9題", "ex": "正確答案為(C) 僅乙、丙。\n\n乙：正確。次級信用債券之「次級」（subordinated）即指其清償順位劣後於一般（高級／優先）債券，公司於清算或破產時，須先清償優先債券持有人之債權後，次級債券持有人才能就剩餘資產受償，此為次級債券的核心定義特性。\n\n丙：正確。次級信用債券通常伴隨可轉換為普通股之設計（即發行為「次順位可轉換公司債」的常見型態），此設計是為了在債券本身無擔保、清償順位較低、風險相對較高的情況下，透過附加轉換權利吸引投資人認購，作為對承擔較高風險的補償機制。\n\n甲：錯誤。「信用債券」（Debenture）依定義即為無擔保品之債券，僅憑發行公司之整體信用作為償債保證，並無特定資產作為擔保品；若有資產擔保，則應歸類為「擔保債券」（Secured Bond），與「信用債券」之定義相互矛盾，故甲之敘述不成立。\n\n因此正確組合僅乙、丙成立，選項(D)「甲、乙、丙」錯在甲並不成立。"}, {"id": "d86478fb395c", "head": "下列有關風險分散之敘述，何者正確？", "opts": [["A", "一個完全分散的投資組合，由於風險均已分散，其報酬率應等於無風險利率"], ["B", "完全分散風險的投資組合，並未能將所有風險消除"], ["C", "完全分散風險的投資組合，其報酬率應較無風險利率為低"], ["D", "系統風險和非系統風險皆可經由投資組合完全分散"]], "ans": "B", "tag": "投資組合理論（分散、共變異數、相關係數）", "srcTxt": "114年第3次 投資學筆記　第1題", "ex": "投資組合的風險可拆解為「系統風險」（又稱市場風險，如景氣、利率、戰爭等影響整體市場之因素）與「非系統風險」（又稱可分散風險，如個別公司或產業特有之因素）。透過投資組合分散（增加持股種類、跨產業、跨公司），只能消除「非系統風險」，因為個別公司或產業的特有事件彼此獨立、可透過分散相互抵銷；然而「系統風險」係影響整體市場之共同因素，無論投資組合如何分散，均無法透過分散予以消除。因此，一個「完全分散」的投資組合，指的是已將非系統風險降至最低（甚至趨近於零），但其仍保留系統風險，並非「所有」風險皆已消除。\n\n逐項檢視： (A) 若完全分散即代表「所有」風險消除，則投資組合僅承擔無風險利率之報酬，但實際上完全分散僅消除非系統風險，系統風險依然存在，故其報酬率不應等於無風險利率，敘述有誤。 (B) 完全分散風險的投資組合僅能消除非系統風險，系統風險仍無法透過分散消除，因此「並未能將所有風險消除」之敘述正確。 (C) 由於系統風險依然存在，投資人仍須承擔對應之風險溢酬，故其預期報酬率應高於（而非低於）無風險利率，敘述有誤。 (D) 系統風險屬於全市場共同承擔之風險，無法透過投資組合分散予以消除，僅非系統風險可被分散消除，故「系統風險和非系統風險皆可完全分散」之敘述有誤。"}, {"id": "73eb28c538cd", "head": "已知一最適風險投資組合，其期望報酬率為12%，標準差為26%，若無風險利率為5%，請問其最適（feasible）資本市場線的斜率約為？", "opts": [["A", "0.64"], ["B", "0.27"], ["C", "0.33"], ["D", "0.36"]], "ans": "B", "tag": "CAPM、貝它係數與證券市場線", "srcTxt": "114年第3次 投資學筆記　第2題", "ex": "資本市場線（Capital Market Line, CML）表示由無風險資產與最適風險投資組合所構成之投資機會集合，其斜率即代表「每承擔一單位標準差（風險），可換得多少超額報酬」，也就是風險的報酬對價，公式為：\n\n資本市場線斜率 =（最適風險投資組合期望報酬率 − 無風險利率）／最適風險投資組合標準差\n\n將題目數據代入： =（12% − 5%）／26% = 7% ／ 26% ≈ 0.2692\n\n四捨五入後約為 0.27。\n\n逐項檢視： (A) 0.64：數值明顯過大，與計算結果不符，錯誤。 (B) 0.27：與計算結果 0.269 四捨五入後相符，正確。 (C) 0.33：與計算結果不符，錯誤。 (D) 0.36：與計算結果不符，錯誤。"}], "財務分析": [{"id": "1e9806cb5148", "head": "下列關於可轉換公司債的敘述，何者正確？", "opts": [["A", "票面利率通常高於發行日市場利率"], ["B", "轉換價格通常高於發行日普通股股票之公允價值"], ["C", "轉換價格在發行日後不能調整"], ["D", "票面利率不得設定為0"]], "ans": "B", "tag": "公司債發行與溢折價攤銷", "srcTxt": "113年第1次 財務分析筆記　第1題", "ex": "正確答案為(B)。可轉換公司債發行時，轉換價格通常設定高於發行日普通股的公允價值，形成「轉換溢價」，其作用有二：一是反映債券附帶的轉換權利之價值（轉換權本身有價值，故轉換價格需高於現價才合理，否則投資人可立即轉換套利）；二是降低發行時對既有股東股權的即時稀釋效果。\n\n其餘選項：\n\n(A) 錯誤。可轉換公司債的票面利率通常「低於」同等風險、同天期的一般公司債市場利率，因為投資人額外取得了轉換為普通股的權利，願意接受較低的票面利息作為交換。\n\n(C) 錯誤。多數可轉換公司債契約都訂有反稀釋條款（anti-dilution provisions），當公司發生現金增資、股票分割、無償配股（增資）等情況時，轉換價格會依約定公式向下調整，以保障可轉債持有人的權益不被稀釋。\n\n(D) 錯誤。可轉換公司債可以發行為零息（zero-coupon）形式，此時投資人的報酬完全來自轉換權利的價值與到期贖回價差，票面利率設為0在實務與理論上均無不可。"}, {"id": "78b1a4f1931b", "head": "股票發行溢價列為：", "opts": [["A", "負債"], ["B", "資產之減項"], ["C", "權益"], ["D", "利益"]], "ans": "C", "tag": "其他", "srcTxt": "113年第1次 財務分析筆記　第3題", "ex": "正確答案為(C)權益。股票發行溢價（發行價格超過股票面額之部分）屬於股東權益項下的資本公積，列示於資產負債表的權益區塊，而非損益表科目。其性質屬於「資本交易」（股東與公司之間的資本投入），並非公司經營所產生的收益，因此不能認列為當期損益中的利益。\n\n其餘選項：\n\n(A) 錯誤。發行溢價不是負債，公司對股東並無需償還此筆款項的義務，它是股東永久性投入公司的資本，不具負債的「清償義務」特性。\n\n(B) 錯誤。發行溢價不是資產的減項，它是權益的增加項，與資產面完全無關；資產之減項通常指如備抵壞帳、累計折舊等科目。\n\n(D) 錯誤。發行溢價非利益，不會計入當期損益表，因為它源自資本交易（股東出資），依會計原則，資本交易不得產生已實現損益。"}, {"id": "140fb246cb6d", "head": "X1年底發生嚴重地震導致廠房毀損，其會計處理及表達為何？", "opts": [["A", "於附註中表達為非常損失"], ["B", "於綜合損益表中表達為非常損失"], ["C", "與一般廠房的會計處理方式相同，於報導期間結束日評估減損"], ["D", "如經判斷該災害性質特殊且不常發生，始須於附註中表達為非常損失，反之則無須於附註中揭露"]], "ans": "C", "tag": "無形資產與減損", "srcTxt": "113年第1次 財務分析筆記　第5題", "ex": "正確答案為第三個選項：與一般廠房的會計處理方式相同，於報導期間結束日評估減損。\n\n我國採用之IFRS/IFRSs（TIFRS）已明文禁止將任何損益項目單獨列示或標示為「非常損失（extraordinary item）」，不論該事件多麼特殊、罕見或非經常發生。此規定源自國際會計準則對財務報表表達一致性與可比性的要求，避免企業以「非常項目」名義任意排除特定損益、扭曲經常性營運績效的評估。\n\n因此，地震造成的廠房毀損，其會計處理應與一般不動產、廠房及設備的減損評估程序完全相同：於報導期間結束日，依IAS 36（資產減損）之規定，評估該資產是否存在減損跡象，並將可回收金額低於帳面金額之差額認列減損損失，計入當期損益，僅需在附註中依其性質與金額適當揭露，但不得標示或表達為「非常損失」。\n\n其餘選項：\n\n(A)(B) 均錯誤，因為無論在附註或綜合損益表中，均禁止使用「非常損失」之表達方式，此為TIFRS明確禁止的分類方式。\n\n(D) 錯誤，其邏輯前提（「性質特殊且不常發生」才能列為非常損失）本身已不成立，因為现行準則已全面禁止非常損失之表達，並非取決於災害是否特殊或罕見來決定是否適用此分類。"}, {"id": "4634cec1659f", "head": "下列敘述何者正確？", "opts": [["A", "使用價值屬於變現價值"], ["B", "履約價值是指企業預期於其履行負債時，有義務移轉的現金或其他經濟資源的現值，包含承擔負債所發生的交易成本"], ["C", "公允價值是指於衡量日市場參與者間，在有秩序之交易中出售某一資產所能收取或移轉某一負債所需支付之價格"], ["D", "公允價值屬於現時價值的一種，履約價值屬於歷史成本的一種"]], "ans": "C", "tag": "外幣換算與金融工具", "srcTxt": "113年第1次 財務分析筆記　第6題", "ex": "正確答案為第三個選項。此為公允價值（Fair Value）之標準定義：於衡量日（measurement date），市場參與者之間進行有秩序交易（非強迫清算或急迫出售）時，出售某一資產所能收取、或移轉某一負債所需支付的價格。其核心特徵是以「市場參與者觀點」與「當前市場條件」為基礎，屬於現時價值（current value）的一種衡量基礎。\n\n其餘選項：\n\n(A) 錯誤。使用價值（value in use）是指資產於持續使用及最終處分所產生之未來現金流量的現值，反映企業本身對該資產的主觀使用效益，屬於現時價值的一種，並非變現價值（變現價值/公平價值減處分成本，是以市場出售為基礎，兩者概念不同）。\n\n(B) 錯誤。履約價值（fulfilment value）是指企業預期於履行負債時，將移轉之現金或其他經濟資源的現值，其反映的是「履行負債本身所需支付的成本」；依IASB觀念架構，履約價值並不包含承擔負債時所發生的交易成本，此為干擾敘述。\n\n(D) 錯誤。公允價值屬於現時價值無誤，但履約價值同樣屬於現時價值的一種衡量基礎（而非歷史成本），此敘述誤將履約價值歸類為歷史成本，兩者性質不同：歷史成本反映取得或承擔時的原始交易金額，履約價值則反映衡量日當下履行負債所需之現值。"}, {"id": "2cfcd047feb0", "head": "嘉義公司X1年間投入成本$525,000的原材料生產產品，尚須投入$420,000完工為製成品，製成品估計售價及估計銷售費用分別為$980,000及$17,500。若X1年底原材料重置成本降至$500,000，請問：原材料應提列多少「存貨跌價損失」？", "opts": [["A", "$0"], ["B", "$17,500"], ["C", "$35,000"], ["D", "$70,000"]], "ans": "A", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "113年第1次 財務分析筆記　第8題", "ex": "正確答案為(A) $0。\n\n判斷原材料是否需要提列跌價損失，關鍵不在於原材料本身的重置成本是否下跌，而在於以該原材料完工後製成品的可變現淨值（NRV），是否仍能覆蓋製成品的總成本。此為存貨成本與淨變現價值孰低法（LCNRV）下，原料類存貨的特殊判斷原則：若製成品的淨變現價值不低於其成本，則用於生產該製成品的原材料，即使市價（重置成本）下跌，也不需要認列跌價損失，因為該原材料仍能在製成品中回收其全部成本。\n\n計算如下：製成品之淨變現價值（NRV）＝估計售價－估計銷售費用＝$980,000－$17,500＝$962,500。製成品之總成本＝原材料已投入成本＋尚須投入之完工成本＝$525,000＋$420,000＝$945,000。\n\n由於製成品NRV（$962,500）≥ 製成品總成本（$945,000），代表原材料仍可透過完工後的產品全數回收成本，故原材料不需要因重置成本下降而提列跌價損失。\n\n另可用原材料本身之隱含NRV驗證：原材料之NRV＝製成品NRV－尚須投入之完工成本＝$962,500－$420,000＝$542,500，仍高於原材料成本$525,000，同樣得出不需提列跌價損失之結論。\n\n其餘選項：\n\n(B) $17,500為估計銷售費用金額，屬於計算NRV過程中的一個中間數字，並非跌價損失。\n\n(C) $35,000為未扣除銷售費用前的毛利差額（$980,000－$945,000），並非正確的跌價依據，因為判斷跌價與否應以扣除銷售費用後的NRV為準。\n\n(D) $70,000為計算過程錯誤所得之數字，不具會計意義。"}, {"id": "27dce5df92f1", "head": "立力公司有35,000股普通股流通在外，發行面額為$10。另有按面額$100發行之5%累積特別股5,000股流通在外。立力公司過去四年及今年皆未發放股利，若本年度預告發放$100,000之股利，則今年底分配給特別股之股利是多少？", "opts": [["A", "$150,000"], ["B", "$125,000"], ["C", "$360,000"], ["D", "$100,000"]], "ans": "D", "tag": "其他", "srcTxt": "113年第1次 財務分析筆記　第9題", "ex": "正確答案為(D) $100,000。\n\n特別股每年應分配之股利＝5%×$100×5,000股＝$25,000。由於是累積特別股，過去四年未發放的股利會累積至本年度一併請求，故累積未付股利（含本年度）共5年＝$25,000×5＝$125,000，此為特別股本年度應優先分得的股利上限。\n\n依累積特別股之法律及會計原則，特別股股東對累積未付股利享有優先分配權，須先足額補發給特別股，剩餘部分才輪到普通股分配。\n\n本年度公司實際宣告發放的股利總額僅為$100,000，小於特別股累積應得之$125,000，因此依「特別股優先」原則，此$100,000全數分配給特別股股東，普通股股東本年度分文未取（分得$0）。\n\n其餘選項：\n\n(A) $150,000與(B) $125,000皆超過或等於特別股完整累積應得金額，但公司本年度實際宣告股利僅$100,000，並未達到可完整補發累積股利的水準，故特別股實際分得金額仍受限於公司實際宣告之股利總額，不可能分得超過$100,000。\n\n(C) $360,000明顯超過公司本年度宣告的股利總額$100,000，不合理。"}, {"id": "171558b0d332", "head": "豪景公司X1年底之流動比率為1.3，負債比率為0.375。流動資產為$1,000,000，總資產為$4,000,000。若該公司X1年之淨利為$750,000並曾宣告$250,000之現金股利、$250,000之股票股利，且無其他影響權益之交易，則該公司X1年初之權益金額為：", "opts": [["A", "$1,750,000"], ["B", "$2,000,000"], ["C", "$2,250,000"], ["D", "$2,500,000"]], "ans": "B", "tag": "股利政策與股利會計處理", "srcTxt": "113年第1次 財務分析筆記　第10題", "ex": "正確答案為(B) $2,000,000。\n\n先求年底權益：負債比率＝負債／總資產＝0.375，總資產＝$4,000,000，故負債＝0.375×$4,000,000＝$1,500,000。年底權益＝總資產－負債＝$4,000,000－$1,500,000＝$2,500,000。\n\n接著求年度權益變動：淨利會增加權益，現金股利會減少權益（因現金流出、保留盈餘減少），而股票股利僅將保留盈餘轉列為股本及資本公積，屬權益內部科目重分類，不影響權益總額，故不列入計算。年度權益變動＝淨利$750,000－現金股利$250,000＝＋$500,000。\n\n最後推算年初權益：年初權益＝年底權益－本期權益淨增加額＝$2,500,000－$500,000＝$2,000,000。\n\n題目所給之流動比率1.3與流動資產$1,000,000為多餘（干擾）資訊，與本題所問之年初權益金額計算無關。"}, {"id": "6dd37efa7061", "head": "宏碁乙是一種：", "opts": [["A", "特別股"], ["B", "普通股"], ["C", "可轉換公司債"], ["D", "可轉換公司債轉換股票之權證"]], "ans": "D", "tag": "公司債發行與溢折價攤銷", "srcTxt": "113年第1次 財務分析筆記　第11題", "ex": "正確答案為(D) 可轉換公司債轉換股票之權證（即「可轉換公司債轉換股票權利證書」）。\n\n在台灣證券市場的命名慣例中，個股簡稱後方加註「甲」、「乙」等字樣，通常代表該股票並非普通股本身，而是與現金增資、公司債轉換等特定股權變動程序相關的「權利證書」，屬於過渡性、短期上市買賣的憑證，待相關程序完成後即會下市並轉換為正式股票。其中「乙」字樣，慣例上多指「可轉換公司債持有人申請轉換為普通股後、正式股票尚未發放前」所核發的暫時性權利證書，即「可轉換公司債轉換股票權利證書」，代表投資人已行使轉換權、等待新股撥發過渡期間所持有的權利憑證。\n\n其餘選項：\n\n(A) 錯誤。特別股為獨立發行之股份類別，並非透過「乙」字命名慣例表示，其股票代碼與簡稱另有專屬標示方式（如「XX特」）。\n\n(B) 錯誤。普通股即為公司股票簡稱本身，不會額外加註「乙」字，加註「乙」代表其屬於特殊過渡性質的權利憑證，而非正式已發行的普通股。\n\n(C) 錯誤。可轉換公司債本身為債券性質商品，其交易代碼與簡稱另有專屬格式（通常代碼含「02」等公司債專屬編碼），與「乙」字命名之權利證書為不同性質、不同階段的商品：前者是尚未轉換的債券，後者則是已申請轉換、等待換發股票的過渡憑證。"}, {"id": "c70465a25b54", "head": "甲公司 X3 年出售土地獲得現金$360,000，出售設備獲得現金$400,000，發行普通股獲得現金$280,000，購買設備支付現金$210,000，支付現金股利$240,000，請問該公司 X3 年度投資活動現金流量為多少？", "opts": [["A", "$550,000"], ["B", "$590,000"], ["C", "$830,000"], ["D", "$310,000"]], "ans": "A", "tag": "股利政策與股利會計處理", "srcTxt": "113年第2次 財務分析筆記　第1題", "ex": "投資活動現金流量＝出售土地$360,000＋出售設備$400,000－購買設備$210,000＝$550,000。發行普通股與支付現金股利屬融資活動，不列入投資活動。"}, {"id": "74be2c20d3fd", "head": "高知公司 X1 年度平均總資產$160,000，銷貨$50,000，其稅後淨利$25,000，稅率25%，平均財務槓桿比率為2，則該公司權益報酬率為何？", "opts": [["A", "18.75%"], ["B", "31.25%"], ["C", "12.5%"], ["D", "25%"]], "ans": "B", "tag": "財務槓桿與資本結構", "srcTxt": "113年第2次 財務分析筆記　第2題", "ex": "權益報酬率（ROE）可用杜邦公式拆解：ROE＝純益率×總資產週轉率×財務槓桿比率。\n\n純益率＝稅後淨利$25,000÷銷貨$50,000＝50% \n總資產週轉率＝銷貨$50,000÷平均總資產$160,000＝31.25% \n財務槓桿比率＝2\n\nROE＝50%×31.25%×2＝31.25%。"}, {"id": "7404209bdde8", "head": "下列哪一項作法的淨現值不大於0？", "opts": [["A", "採用產品差異化的策略以滿足不同客戶之需求"], ["B", "產品屬完全競爭市場"], ["C", "阻止別人進入市場"], ["D", "採取成本領導的策略"]], "ans": "B", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "113年第2次 財務分析筆記　第3題", "ex": "淨現值（NPV）是否大於0，取決於該作法能否為公司創造超額利潤（高於資金成本的報酬）。完全競爭市場的特徵是廠商為價格接受者、進入障礙低，長期而言超額利潤會被競爭者進入市場所侵蝕，使長期經濟利潤趨於零，因此投資案的淨現值不大於0，即(B)為正確答案。\n\n其餘選項則相反，皆為能創造或維持超額利潤、使淨現值大於0的策略：(A)產品差異化可建立市場力（訂價能力），(C)阻止競爭者進入可維持超額利潤，(D)成本領導可透過成本優勢擴大利潤空間，三者預期淨現值皆>0。"}, {"id": "f097a79f4d3f", "head": "取得轉投資事業之資本公積配股時，應如何列帳？", "opts": [["A", "按市價入帳"], ["B", "按平均成本入帳"], ["C", "按面額入帳"], ["D", "不入帳，僅註記股數增加"]], "ans": "D", "tag": "股東權益、股票股利與庫藏股", "srcTxt": "113年第2次 財務分析筆記　第4題", "ex": "資本公積配股屬權益內部移轉，係盈餘或資本公積轉增資的一種形式，對投資公司而言僅代表持股數增加，投資帳面總金額並未改變，故不認列任何收益，也不需另立分錄入帳，只需註記股數增加，並據以重新調整每股平均成本（即原帳面金額除以增加後的股數）。因此正確答案為(D) 不入帳，僅註記股數增加。\n\n其他選項之所以錯誤：(A)按市價入帳，因配股非市場交易，不應以市價認列；(B)按平均成本入帳，此說法會誤導為需要另立分錄，實際上僅是調整每股成本而不另立分錄；(C)按面額入帳，同樣不涉及以面額認列成本的做法。"}, {"id": "a83c734b5f04", "head": "甲公司 X1 年底有關資料如下：10%累積特別股，每股面額$10；總面額$900,000；普通股，每股面額$10；總面額$1,000,000；稅前淨利$600,000；所得稅率25%。若甲公司當年度流通在外股數無變動，則每股盈餘為多少？", "opts": [["A", "$3.6"], ["B", "$4.5"], ["C", "$5.1"], ["D", "$6.3"]], "ans": "A", "tag": "每股盈餘與稀釋 EPS", "srcTxt": "113年第2次 財務分析筆記　第7題", "ex": "稅後淨利＝稅前淨利$600,000×(1－25%)＝$450,000。\n\n累積特別股股利＝10%×特別股總面額$900,000＝$90,000（無論當年度是否宣告，累積特別股皆須自淨利中扣除本期應計股利）。\n\n普通股可分配盈餘＝稅後淨利$450,000－特別股股利$90,000＝$360,000。\n\n普通股股數＝普通股總面額$1,000,000÷每股面額$10＝100,000股。\n\n每股盈餘＝普通股可分配盈餘$360,000÷普通股股數100,000股＝$3.6。"}, {"id": "bccad821e9d1", "head": "某公司相關資料如下：流動負債20億元、長期負債30億元、不動產、廠房及設備50億元、長期資金占不動產、廠房及設備比率為1.6，求公司的流動資產總額？", "opts": [["A", "50億元"], ["B", "60億元"], ["C", "70億元"], ["D", "80億元"]], "ans": "A", "tag": "負債比與長期償債能力", "srcTxt": "113年第2次 財務分析筆記　第8題", "ex": "第一步，理解「長期資金」的定義。長期資金是指公司資金來源中屬於長期性質的部分，包含長期負債與股東權益（即非流動負債＋業主權益），也可以視為「非流動負債＋權益」的加總，用來與短期（流動）資金來源做區分。本題並未直接給出股東權益數字，而是透過「長期資金占不動產、廠房及設備比率」這個財務比率間接推算長期資金的總額，不需要另外拆解出負債與權益各自的金額。\n\n第二步，利用題目給定的比率求出長期資金總額。題目說「長期資金占不動產、廠房及設備比率為1.6」，也就是： 長期資金 ÷ 不動產、廠房及設備 = 1.6 已知不動產、廠房及設備 = 50億元，代入： 長期資金 = 1.6 × 50億元 = 80億元\n\n第三步，理解「淨營運資金」與長期資金、固定資產之間的恆等關係。資產負債表存在一個基本恆等式： 資產總額 = 負債總額 + 權益總額 可以拆分為流動與非流動兩部分： （流動資產＋非流動資產）=（流動負債＋非流動負債）＋權益 移項後可得： 流動資產－流動負債 = （非流動負債＋權益）－非流動資產 右式的「非流動負債＋權益」就是「長期資金」，而本題中公司的非流動資產僅列出「不動產、廠房及設備」一項，故： 流動資產－流動負債 = 長期資金－不動產、廠房及設備 這個差額（流動資產－流動負債）即財務管理上所稱的「淨營運資金」（Net Working Capital），代表公司以長期資金支應短期營運週轉的部分。\n\n第四步，代入數字計算淨營運資金： 淨營運資金 = 長期資金80億元－不動產、廠房\n及設備50億元 = 30億元\n\n第五步，利用淨營運資金反推流動資產總額。由於： 淨營運資金 = 流動資產－流動負債 已知流動負債 = 20億元，代入： 30億元 = 流動資產－20億元 流動資產 = 30億元＋20億元 = 50億元\n\n第六步，檢查此題中的干擾項：選項(D) 80億元其實是「長期資金」的數值，而非流動資產，容易讓人誤以為長期資金就是答案而誤選；本題特別設計此陷阱，須留意題目問的是「流動資產總額」而非「長期資金」。\n\n最終答案為(A) 50億元。"}, {"id": "0b2d53054554", "head": "根據淨現值法則，何種情形下應該投資？", "opts": [["A", "淨現值除以投資成本大於資金成本率"], ["B", "淨現值大於投資之成本"], ["C", "淨現值大於0"], ["D", "淨現值的風險為0"]], "ans": "C", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "113年第2次 財務分析筆記　第9題", "ex": "淨現值法則（NPV Rule）的判斷標準很單純：只要投資案以資金成本（即要求報酬率）折現後計算出的淨現值大於0，代表該投資案能為公司創造正的經濟價值，就應該投資；淨現值小於0則不應投資。因此正確答案為(C) 淨現值大於0。\n\n其他選項之所以錯誤：(A)淨現值除以投資成本屬於單位不一致的比較，並非NPV法則的判斷標準，若要用比率型指標判斷，應使用獲利指數（PI＝現值/成本＞1）或內部報酬率（IRR＞資金成本率），而非「NPV/成本」與「資金成本率」直接比較；(B)淨現值與投資成本是性質不同的兩個金額，不應直接比較大小，NPV法則只要求NPV＞0即可，不需要NPV大於成本；(D)NPV法則並未要求風險為0，任何投資案本身皆存在風險，判斷是否投資的重點在於折現後的淨現值是否為正，而非風險是否消除。"}, {"id": "8be79b94f1e2", "head": "比較兩家營業規模差距甚大之公司時，下列何種方法最佳？", "opts": [["A", "趨勢分析"], ["B", "比較分析"], ["C", "水平分析"], ["D", "共同比財務報表分析"]], "ans": "D", "tag": "共同比報表與趨勢分析", "srcTxt": "113年第2次 財務分析筆記　第10題", "ex": "共同比財務報表分析（Common-Size Analysis）是將財務報表各項目換算成百分比呈現，例如損益表以銷貨收入為基準、資產負債表以總資產為基準，將金額轉換為結構性比率後再比較。這種方式可以消除公司間營業規模大小的差異，讓不同規模的公司在同一基礎上比較各項目所占比重，因此最適合用來比較營業規模差距甚大的兩家公司。正確答案為(D) 共同比財務報表分析。\n\n其他選項之所以較不適合：(A)趨勢分析著重於同一公司歷年數據的變化趨勢，用於觀察該公司自身的成長或衰退情形，並非設計來跨公司比較；(B)比較分析若未經標準化（例如未轉換為比率或百分比），直接比較金額容易受到公司規模差異的影響而失真；(C)水平分析是比較同一公司不同期間金額的變動幅度與百分比，本質上仍以金額變動為基礎，同樣會受到規模差異的干擾，不適合用於規模差距懸殊的公司間比較。"}, {"id": "7fd24f753957", "head": "一企業對於固定生產成本投入之程度稱為：", "opts": [["A", "固定產能利用率"], ["B", "財務槓桿"], ["C", "邊際產能利用率"], ["D", "營業槓桿"]], "ans": "D", "tag": "財務槓桿與資本結構", "srcTxt": "113年第2次 財務分析筆記　第11題", "ex": "營業槓桿（Operating Leverage）指企業在成本結構中採用固定生產成本（如固定製造費用、折舊等）的程度。當企業固定成本佔總成本比重越高，營業槓桿程度越大，代表銷售量些微變動時，營業利益（盈餘）的變動幅度會被放大，對銷售量變化越敏感。正確答案為(D) 營業槓桿。\n\n其他選項之所以錯誤：(A)固定產能利用率指的是實際產能被使用的程度（產出與最大產能之比），是產能運用面的概念，而非成本結構中固定成本投入程度的概念；(B)財務槓桿指企業運用負債（固定利息支出）進行融資的程度，屬於資本結構面的概念，與生產成本無關；(C)邊際產能利用率並非財務管理常用術語，且與「固定成本投入程度」無直接對應關係。"}, {"id": "8c81ad85463b", "head": "累積特別股5%面額$100（核准發行1,000股），帳面上特別股折價為$3,000、積欠股利$7,000，普通股每股面額$40，核准發行10,000股，已發行8,000股，普通股溢價為$68,000，累積盈餘為$30,000，特別股收回價格為$110，則普通股每股帳面金額為：", "opts": [["A", "$49.50"], ["B", "$50.125"], ["C", "$49.75"], ["D", "$63.25"]], "ans": "C", "tag": "其他", "srcTxt": "113年第2次 財務分析筆記　第12題", "ex": "第一步，計算股東權益總額。特別股帳面價值＝面額總額－折價＝(1,000股×$100)－$3,000＝$100,000－$3,000＝$97,000；普通股面額總額＝已發行股數×每股面額＝8,000股×$40＝$320,000；加上普通股溢價$68,000、累積盈餘$30,000。\n\n股東權益總額＝$97,000＋$320,000＋$68,000＋$30,000＝$515,000。\n\n第二步，計算應分配給特別股股東的金額。由於特別股為可收回（callable）特別股，計算普通股帳面價值時，應分配給特別股的金額須以收回價格（而非面額）為準，並加上積欠（累積未發）股利：\n\n特別股應分配金額＝收回價格×股數＋積欠股利＝($110×1,000股)＋$7,000＝$110,000＋$7,000＝$117,000。\n\n第三步，計算普通股可分配之權益與每股帳面金額。\n\n普通股可分配權益＝股東權益總額－特別股應分配金額＝$515,000－$117,000＝$398,000。\n\n普通股每股帳面金額＝$398,000÷已發行股數8,000股＝$49.75。"}, {"id": "467fd5da4332", "head": "在採用零售價法評估期末存貨價值時，下列哪一項目會同時影響進貨的成本與零售價?", "opts": [["A", "進貨折扣"], ["B", "進貨運費"], ["C", "進貨退回"], ["D", "正常損耗"]], "ans": "C", "tag": "存貨評價方法（先進先出／加權平均／成本市價孰低）", "srcTxt": "113年第3次 財務分析筆記　第1題", "ex": "零售價法將存貨同時以「成本」與「零售價」兩個欄位平行記錄。進貨退回代表商品實體退出可供銷售存貨，因此必須同時從成本欄位減除該商品的進貨成本、並從零售價欄位減除其原訂零售價，兩者同步調整。\n\n其餘選項僅影響單一欄位：進貨折扣只降低成本欄位（不改變零售價）；進貨運費只增加成本欄位（不影響零售價）；正常損耗（如自然縮水、蒸發）依零售價法慣例只從零售價欄位扣除、不調整成本欄位，藉此讓毛利率反映損耗的影響。"}, {"id": "211496a2e693", "head": "泰山公司於111年第一季末發現110年底存貨低列了$500,000，已知該公司適用的稅率均為20%，則：", "opts": [["A", "110年度損益表應予重編，增加銷貨成本$500,000及減少所得稅費用$100,000"], ["B", "110年度損益表應予重編，直接調整淨利$400,000"], ["C", "111年第一季的期初保留盈餘金額應調整增加$400,000"], ["D", "110年度的錯誤會在111年度自動抵銷，故不需任何調整"]], "ans": "C", "tag": "所得稅與遞延所得稅", "srcTxt": "113年第3次 財務分析筆記　第2題", "ex": "110年底存貨低列$500,000，代表110年度銷貨成本被高估$500,000，稅前淨利因而被低估$500,000。以20%稅率計算，所得稅費用同時被低估$500,000×20%=$100,000，稅後淨利實際被低估的金額為$500,000×(1-20%)=$400,000。\n\n此屬於「前期損益調整（前期錯誤）」，且是在110年度財務報表已對外發布之後才發現，依會計原則應採追溯重編法（retrospective restatement）處理：不重新發布已公告的110年度財務報表，而是在後續期間（111年第一季）財務報表中，直接調整最早列報期間的期初保留盈餘，並於比較報表中重編110年度數字供對照。因此正確做法是將111年第一季的期初保留盈餘調增$400,000。\n\n(A) 錯誤在於「重編」不是指重新發布110年度損益表，而是調整保留盈餘；(B) 同樣誤將調整項目放在110年度損益表而非保留盈餘；(D) 錯誤，因為存貨錯誤雖具有自動抵銷（self-correcting）特性（110年低估的存貨會使111年損益方向相反地被高估獲利），但在跨期比較報表未重編前，保留盈餘仍須調整，並非「不需任何調整」。"}, {"id": "1e3f3c7c03a8", "head": "若期初與期末不動產、廠房及設備之帳面金額分別為$38,500與$43,750，當年度提列折舊$6,750，且未出售或報廢任何不動產、廠房及設備，則當年度購入不動產、廠房及設備的成本為何？", "opts": [["A", "$1,500"], ["B", "$12,000"], ["C", "$5,250"], ["D", "$13,500"]], "ans": "B", "tag": "固定資產與折舊方法", "srcTxt": "113年第3次 財務分析筆記　第3題", "ex": "不動產、廠房及設備（PP&E）帳面價值的期初期末勾稽關係為：\n\n期末帳面金額 ＝ 期初帳面金額 ＋ 當年度購置成本 － 當年度折舊 － 處分之帳面金額\n\n題目已知未出售或報廢任何資產，故處分項為零，公式簡化為：\n\n期末帳面金額 ＝ 期初帳面金額 ＋ 購置成本 － 折舊\n\n移項求購置成本：\n\n購置成本 ＝ 期末帳面金額 － 期初帳面金額 ＋ 折舊 　　　　＝ $43,750 － $38,500 ＋ $6,750 　　　　＝ $5,250 ＋ $6,750 　　　　＝ $12,000\n\n其餘選項之常見誤算： (A) $1,500：僅取期末減期初之淨增額（$5,250），再誤與折舊相抵（$5,250－$6,750的概念混淆），屬淨增額與折舊誤算之結果。 (C) $5,250：僅計算帳面淨增額（期末－期初），忽略折舊需加回。 (D) $13,500：誤將折舊乘以2或重複加計所致。"}, {"id": "be2d7d3ad704", "head": "以帳面金額$2,000,000、公允價值$3,000,000之房屋交換一公允價值$1,600,000之較小房屋（與舊屋同作為辦公室用），並向對方收取現金$1,400,000，若此項交易不具商業實質，則此交換交易將產生利益若干？", "opts": [["A", "$0"], ["B", "$600,000"], ["C", "$800,000"], ["D", "$1,000,000"]], "ans": "A", "tag": "外幣換算與金融工具", "srcTxt": "113年第3次 財務分析筆記　第4題", "ex": "依非貨幣性資產交換之會計處理原則，若交換交易「不具商業實質」（即交換前後企業未來現金流量之風險、時點或金額未產生重大改變），則該項交換應以「換出資產之帳面金額」作為衡量基礎，不論公允價值高於或低於帳面金額，均不認列任何交換利益（或損失），僅在收付現金時調整換入資產之入帳成本。\n\n第一步，判斷交易性質：題目已明確說明此項交易「不具商業實質」，故不得比照具商業實質之交換以公允價值衡量並認列利益，應改以帳面金額為衡量基礎。\n\n第二步，計算換入新資產（較小房屋）之入帳成本： 不具商業實質時，換入資產成本 ＝ 換出資產帳面金額 － 收取之現金 　　　　　　　　＝ $2,000,000 － $1,400,000 　　　　　　　　＝ $600,000\n\n第三步，判斷應認列之利益： 由於整筆交易係以帳面金額為衡量基礎進行結轉，並非以公允價值衡量，故不產生任何損益，本次交換交易應認列之利益為： $0\n\n其餘選項之常見誤算： (B) $600,000：誤將依帳面金額計算出的「換入新資產成本」（$600,000）本身當作交易利益，混淆了「資產入帳成本」與「認列利益」兩個不同概念。 (C) $800,000：可能係誤將收取之現金與錯算之新資產成本相減所得（如$1,400,000－$600,000＝$800,000），屬於在錯誤前提下進行的二次誤算，並非正確之會計處理結果。 (D) $1,000,000：誤將此交易視為「具商業實質」處理，以公允價值衡量認列全額利益，即換出資產公允價值減帳面金額（$3,000,000－$2,000,000＝$1,000,000），忽略題目已明確表明交易不具商業實質、不應以公允價值認列利益之前提。"}, {"id": "4bce0591843d", "head": "甲公司本期之權益報酬率(ROE)高於資產報酬率(ROA)，顯示甲公司：", "opts": [["A", "使用財務槓桿有利"], ["B", "使用財務槓桿不利"], ["C", "使用營業槓桿有利"], ["D", "使用營業槓桿不利"]], "ans": "A", "tag": "財務槓桿與資本結構", "srcTxt": "113年第3次 財務分析筆記　第5題", "ex": "本題核心概念在於區分「財務槓桿」與「營業槓桿」對報酬率的不同影響層次，並理解ROE與ROA之間的關係式：\n\nROE ＝ ROA ＋ (ROA － i) × (D／E)\n\n其中i為負債利率，D／E為負債與權益比率。此公式顯示，ROE與ROA之間的差距，完全來自「財務槓桿效果」，即企業運用負債（借款）融資所產生的槓桿放大作用，與營業槓桿（固定營業成本結構所致之經營風險放大效果）並無直接關聯，因為營業槓桿影響的是銷售量變動對EBIT（息前稅前淨利）的放大程度，屬於營運面，並不直接反映在ROE相對於ROA的差異上。\n\n判斷邏輯： 當ROE ＞ ROA時，依上述公式可知(ROA － i) × (D／E) ＞ 0，亦即ROA大於借款利率i。這表示公司運用資產所賺取的報酬率，高於舉債所需支付的資金成本，因此透過負債融資（財務槓桿）反而能將這項超額報酬，進一步放大並歸屬於股東，使股東所享有的權益報酬率高於整體資產報酬率。此即「財務槓桿使用有利」的具體意涵。\n\n其餘選項之辨析： (B) 使用財務槓桿不利：此情形應發生於ROE ＜ ROA時，亦即ROA低於借款利率i，此時舉債反而侵蝕股東報酬，與本題ROE ＞ ROA之條件相反，故不適用。 (C) 使用營業槓桿有利：營業槓桿程度（DOL）與固定營業成本結構相關，衡量的是銷售量變動對EBIT的放大效果，屬於營運面議題，與ROE是否高於ROA（屬融資面／財務槓桿議題）並無直接因果關聯，此選項混淆了營運槓桿與財務槓桿兩個不同層次的概念。 (D) 使用營業槓桿不利：理由同(C)，同樣與本題所欲檢測之財務槓桿概念無關，並非本題重點。"}, {"id": "9bb8b14900e1", "head": "某企業流通在外普通股共20,000股，原始發行價格為每股15元，目前普通股每股帳面金額為25元，每股市價為40元，今年度宣告的普通股股利共有80,000元，請問該公司股票的收益率（Dividend Yield）為多少？", "opts": [["A", "7.5%"], ["B", "10%"], ["C", "8.0%"], ["D", "13.3%"]], "ans": "B", "tag": "股票評價（本益比、股利支付率、成長率）", "srcTxt": "113年第3次 財務分析筆記　第6題", "ex": "股利收益率（Dividend Yield）之定義為：投資人以目前市價買入股票後，所能領取之每股股利占其投入成本（市價）之比率，公式為：\n\n股利收益率 ＝ 每股股利 ／ 每股市價\n\n需特別注意，股票的「原始發行價格」（$15）與「每股帳面金額」（$25，即每股淨值／帳面淨值）皆與股利收益率之計算無關，因為股利收益率衡量的是「投資人以目前市場成本取得該股票，所能獲得的現金報酬率」，其分母必須採用「目前市價」，而非帳面上的歷史發行價或會計帳面淨值。\n\n第一步，計算每股股利： 每股股利 ＝ 普通股股利總額 ／ 流通在外股數 　　　　\n＝ $80,000 ／ 20,000股 ＝ $4 ／股\n\n第二步，代入市價計算股利收益率： 股利收益率 ＝ 每股股利 ／ 每股市價 　　　　　\n＝ $4 ／ $40  ＝ 10%\n\n其餘選項之常見誤算，多源於誤用了題目中干擾性的價格資訊（原始發行價$15或帳面金額$25）作為分母，而非正確採用市價$40： (A) 7.5%與(C) 8.0%：可能係誤將帳面金額或其他錯置基準（如將每股股利或股數計算錯誤）代入分母所致的誤算結果。 (D) 13.3%：數值上接近以「原始發行價格」之倍數（如2×$15＝$30）作為分母之誤算（$4／$30≈13.3%），屬於誤用原始發行價格而非目前市價之典型錯誤。\n\n由於股利收益率之定義明確要求以「目前市價」為衡量基礎，"}, {"id": "259aaf35952c", "head": "若一計畫的內部報酬率大於其資金成本率，則表示該計畫之淨現值：", "opts": [["A", "大於0"], ["B", "小於0"], ["C", "等於0"], ["D", "不一定大於或小於0"]], "ans": "D", "tag": "資本預算（NPV／IRR／回收期）", "srcTxt": "113年第3次 財務分析筆記　第7題", "ex": "本題屬於資本預算中，內部報酬率法（IRR）與淨現值法（NPV）兩種評估方法間關係的定義型論證，關鍵在於「IRR ＞ 資金成本率 ⇒ NPV ＞ 0」此一常見結論，其成立是有前提條件的，並非在任何情況下皆必然成立。\n\n在「傳統（正常）現金流量型態」的投資計畫下（即計畫初期為現金流出，其後各期皆為現金流入，現金流量正負號僅變換一次），NPV為折現率的遞減函數，此時IRR即為使NPV＝0的唯一折現率，且當實際採用之折現率（資金成本率）低於IRR時，NPV確實會大於0，此時(A)之結論方能成立。\n\n然而，題目僅泛稱「一計畫」，並未限定其現金流量型態為傳統型。若該計畫屬於「非傳統現金流量型態」（現金流量正負號變換兩次以上，例如初期流出、中期流入、後期又需大筆流出，如採礦計畫後續之環境復原成本），則可能產生「多重內部報酬率」的情形，此時NPV並非折現率的單調遞減函數，IRR與NPV之間不再具有穩定的、一致的對應關係；即便IRR大於資金成本率，NPV仍可能小於0，甚至無法明確判斷。\n\n因此，在題目未特別限定現金流量型態（未言明為傳統型）的一般情況下，僅憑「IRR大於資金成本率」此一條件，尚不足以保證NPV必然大於0，須視該計畫實際之現金流量型態而定。\n\n其餘選項之辨析： (A) 大於0：僅在傳統現金流量型態之計畫下成立，屬於特殊情況而非一般情況下的必然結論，題目未限定此前提，故不能一概而論。 (B) 小於0：與傳統型態下的一般結論方向相反，除非為非傳統現金流量型態下的特殊情形，否則通常不成立。 (C) 等於0：僅在資金成本率恰好等於IRR時才會發生（此時NPV＝0），但題目條件為IRR大於資金成本率，故此選項與題目條件不符。"}, {"id": "1b0f814314ab", "head": "企業提前清償公司債所造成的損益，在綜合損益表中的報導方式為：", "opts": [["A", "列為營業費用的調整項目，因為這是營業活動之一"], ["B", "列為營業外損益，因為這不是主要營業項目"], ["C", "列為營業淨利的調整項目，因為會計原則的規定如此"], ["D", "因為其性質特殊且不常發生，應以稅後淨額表達，列於停業單位損益之下"]], "ans": "B", "tag": "現金流量表（三大活動分類與判讀）", "srcTxt": "113年第3次 財務分析筆記　第8題", "ex": "判斷一項損益應如何於綜合損益表中報導，關鍵在於界定該交易事項的「性質」究竟屬於企業的「主要營業活動（operating activities）」，抑或屬於「非主要營業之融資／投資活動」。企業「提前清償公司債」屬於償還借款資金來源之行為，本質上是一項「融資活動（financing activity）」，而非企業日常銷售商品、提供勞務等主要營業活動之一環，因此因提前清償公司債所產生之損益（例如清償金額與債券帳面金額之差額），依會計原則應歸屬於與主要營業無關之損益項目，於綜合損益表中列報為「營業外損益」。\n\n其餘選項之辨析： (A) 列為營業費用的調整項目，因為這是營業活動之一：此敘述錯誤。提前清償公司債屬於資金籌措（融資）層面的決策，與企業銷售商品、提供勞務等核心營業活動無關，不應歸類為營業費用或營業活動之調整項目。 (C) 列為營業淨利的調整項目，因為會計原則的規定如此：此敘述錯誤。現行會計原則並未規定將此類與主要營業無關之損益，混入營業淨利之計算範圍內調整；營業淨利應僅反映企業核心營業活動之經營成果，提前清償公司債之損益應獨立列於營業外損益，而非併入營業淨利中調整。 (D) 因為其性質特殊且不常發生，應以稅後淨額表達，列於停業單位損益之下：此敘述錯誤。「停業單位損益」係適用於企業處分或終止某一可明確區隔之營業部門或事業單位時之列報方式，提前清償公司債純屬一般融資活動下的損益事項，並不符合「停業單位」之定義與適用條件，不應比照此方式以稅後淨額列報。"}, {"id": "108b11c9a809", "head": "功能性貨幣財務報表換算表達貨幣時，通常保留盈餘期末餘額之計算不包括：", "opts": [["A", "上期換算後保留盈餘之期末餘額"], ["B", "按宣告日匯率換算之股利金額"], ["C", "以歷史匯率換算之當期損益"], ["D", "以上均包含於保留盈餘之計算"]], "ans": "C", "tag": "股東權益、股票股利與庫藏股", "srcTxt": "113年第3次 財務分析筆記　第9題", "ex": "本題涉及「功能性貨幣（functional currency）財務報表換算為表達貨幣（presentation currency）」時，保留盈餘期末餘額之換算方法，其計算邏輯為：\n\n保留盈餘期末餘額（換算後）＝ 保留盈餘期初餘額（即上期換算後之期末餘額）＋ 當期損益（換算後）－ 當期宣告發放之股利（換算後）\n\n此公式中，各項目所應採用之換算匯率有嚴格區分：\n\n第一，保留盈餘期初餘額，直接沿用「上期換算後之期末餘額」，此為銜接期初期末之基礎，屬於保留盈餘計算的一環。\n\n第二，當期股利，於宣告發放時即已按當時之即期匯率（宣告日匯率）認列並換算為表達貨幣金額，此換算後之股利金額於保留盈餘計算中予以減除，同樣屬於保留盈餘計算的一環。\n\n第三，當期損益（本期淨利／損失）併入保留盈餘之部分，依功能性貨幣換算為表達貨幣之規定，損益表項目通常係以「當期平均匯率」換算，而非採用「歷史匯率」換算。所謂「歷史匯率」通常適用於權益項目中股本等以歷史成本衡量、於發生時即已入帳之項目，而非用於當期損益之換算。因此，「以歷史匯率換算之當期損益」此一敘述本身即不符合功能性貨幣換算之實際作法，當期損益應以平均匯率換算，而非歷史匯率，故此項不包括於（依題目所描述方式計算之）保留盈餘期末餘額計算中。\n\n其餘選項之辨析： (A) 上期換算後保留盈餘之期末餘額：屬於保留盈餘期末餘額計算之基礎起點，包含在計算範圍內。 (B) 按宣告日匯率換算之股利金額：屬於保留盈餘計算中應予減除之項目，同樣包含在計算範圍內。 (D) 以上均包含於保留盈餘之計算：此敘述錯誤，因(C)所述「以歷史匯率換算之當期損益」並不符合正確換算方法（當期損益應以平均匯率換算），故並非均包含在內。"}, {"id": "b93b0641a146", "head": "計算基本每股盈餘之分子時，下列項目何者是無論公司當期是否宣告發放股利，都必須自本期純益減除者？", "opts": [["A", "可轉換公司債之利息"], ["B", "參加特別股之股利"], ["C", "所有特別股之股利"], ["D", "累積特別股之股利"]], "ans": "D", "tag": "每股盈餘與稀釋 EPS", "srcTxt": "114年第1次 財務分析筆記　第1題", "ex": "計算基本每股盈餘（Basic EPS）之分子時，其計算式為：\n\n基本每股盈餘之分子 ＝ 本期歸屬於普通股股東之淨利 ＝ 本期純益 － 特別股股利\n\n其中，「特別股股利」之減除方式，須依特別股是否具有「累積（cumulative）」性質而有所不同，此為本題判斷之關鍵：\n\n若特別股屬於「累積特別股（Cumulative Preferred Stock）」，代表該特別股股東對於當期股利享有優先分配權，即便公司當期並未宣告發放股利，該累積特別股之當期股利權利仍會持續累積，未來仍須優先支付；因此在計算基本每股盈餘之分子時，無論公司當期是否實際宣告發放股利，均須將該期「應計」之累積特別股股利，自本期純益中減除，以正確反映歸屬於普通股股東之實際可分配盈餘。\n\n反之，若特別股屬於「非累積特別股（Non-cumulative Preferred Stock）」，其股利權利並不會因公司未宣告發放而累積至未來期間，因此僅於公司當期「實際宣告發放」股利時，才須自本期純益中減除；若當期未宣告發放，則非累積特別股當期不減除股利。\n\n其餘選項之辨析： (A) 可轉換公司債之利息：屬於計算「稀釋每股盈餘（Diluted EPS）」時，因假設可轉換公司債轉換為普通股，而須加回（而非減除）之稅後利息費用調整項目，與基本每股盈餘之特別股股利減除無關，且其加回與否取決於是否計算稀釋EPS，並非本題所問之情境。 (B) 參加特別股之股利：參加特別股股東除固定股利外，尚可能參與普通股股利之超額分配，其股利之減除仍須視當期是否實際宣告發放而定（除非同時具有累積性質），並非「無論是否宣告皆須減除」之項目，本身之減除與否主要仍取決於宣告與否及參加特性之計算，與累積特別股「不論宣告與否皆減除」之特性不同。 (C) 所有特別股之股利：此敘述過於籠統，未區分累積與非累積特別股之差異，非累積特別股股利僅於宣告發放時才減除，並非所有特別股股利皆無論宣告與否都必須減除，故此選項不正確。"}, {"id": "3375afa32403", "head": "根據國際財務報導準則第7號「金融工具：揭露」之規定，對於以交付現金或其他金融資產清償之金融負債，企業履行與其相關之義務將面臨困難之風險為：", "opts": [["A", "信用風險"], ["B", "定價風險"], ["C", "流動性風險"], ["D", "市場風險"]], "ans": "C", "tag": "會計原則、IFRS 與財報品質", "srcTxt": "114年第1次 財務分析筆記　第2題", "ex": "本題屬於定義型論證，關鍵在於精確界定IFRS 7「金融工具：揭露」準則下所規範之各類金融風險的定義邊界，並將題目所描述之情境（以現金或其他金融資產清償金融負債時，履行相關義務面臨困難）與正確之風險類別對應。\n\n依IFRS 7之規定，「流動性風險（Liquidity Risk）」之定義為：企業於履行與金融負債相關之義務（即須以交付現金或其他金融資產方式清償該負債）時，將面臨困難之風險。此定義聚焦於企業「自身」在負債到期或須清償時，是否有足夠之現金或流動性資產可供動用以履行清償義務，若企業資金調度困難、無法及時取得足夠現金或流動性資產，即構成流動性風險，此與題目所描述之情境完全相符。\n\n其餘選項之辨析： (A) 信用風險：依IFRS 7定義，信用風險係指金融工具之交易對手未能履行其契約義務，致使企業（另一方）發生財務損失之風險，其著眼點在於「對方」（交易對手）違約不履約所導致企業資產面之損失風險，而非企業「自身」在清償負債時面臨的資金調度困難，故與題目所述情境（企業自身履行清償義務之困難）不符。 (B) 定價風險：此非IFRS 7所定義之正式風險分類名稱。IFRS 7下之風險分類主要為信用風險、流動性風險、市場風險三大類，市場風險下再細分為貨幣風險、利率風險及其他價格風險，「定價風險」並非準則中獨立定義之風險類別，屬於混淆性選項。 (D) 市場風險：依IFRS 7定義，市場風險係指金融工具之公允價值或未來現金流量，因市場價格（如匯率、利率、其他商品或權益價格）變動而產生波動之風險，其核心在於「價格波動」對金融工具價值的影響，而非企業於清償負債時是否具備足夠流動性以履行義務，故與題目情境不符。"}, {"id": "71a5114613e8", "head": "下列敘述何者錯誤？", "opts": [["A", "資產的除列通常於企業喪失對已認列資產的控制時發生"], ["B", "負債帳面金額增加可能與費損的認列同時發生"], ["C", "收益的認列可能與資產的原始認列同時發生"], ["D", "收益的除列通常於企業認列負債時發生"]], "ans": "D", "tag": "其他", "srcTxt": "114年第1次 財務分析筆記　第3題", "ex": "本題屬於定義型論證，考察《財務報導觀念架構》中，資產、負債之「認列」與「除列」，與收益、費損之認列之間的對應關係，須逐項檢視各敘述是否符合觀念架構所定義之邏輯關係。\n\n先逐一檢視(A)至(C)之正確性：\n\n(A) 資產的除列通常於企業喪失對已認列資產的控制時發生：此敘述正確。依觀念架構，資產除列（derecognition）之核心判斷基準，即為企業是否喪失對該項已認列資產之控制；當企業不再對該資產具有控制力（例如出售並移轉控制權）時，即應將該資產自財務報表中除列。\n\n(B) 負債帳面金額增加可能與費損的認列同時發生：此敘述正確。例如企業提列應付利息或應付費用時，會同時增加負債之帳面金額，並認列相對應之費損（利息費用），兩者確實可能同時發生。\n\n(C) 收益的認列可能與資產的原始認列同時發生：此敘述正確。例如企業以賒銷方式銷售商品時，會同時認列收益（銷貨收入），並原始認列一項新資產（應收帳款），兩者確實可能同時發生。\n\n再檢視(D)：\n\n(D) 收益的除列通常於企業認列負債時發生：此敘述錯誤。依觀念架構之邏輯，「認列負債」通常係與「費損（費用）之認列」同時發生（如(B)所述之應付利息、應付費用等情形），而非與「收益之除列」同時發生；收益之除列（例如銷貨退回沖銷已認列之收益）通常有其自身獨立之觸發原因（如商品退回、合約取消等），與企業是否認列負債並無通常性、必然性之對應關係。此敘述將「負債認列」錯誤地與「收益除列」建立不存在的因果連結，故為錯誤敘述。\n\n由於題目要求找出「錯誤」之敘述，"}, {"id": "8786ce8d5c67", "head": "佳山公司擁有一超級市場，最近因應營業需要，將此超級市場的舊有房屋結構拆除，並在原地蓋一新的超級市場建築，則佳山公司應將此舊有房屋結構帳面金額作何處理？", "opts": [["A", "納入土地成本"], ["B", "以其他損失處理"], ["C", "以舊屋之處分損益處理"], ["D", "納入新的超級市場之建築成本"]], "ans": "C", "tag": "其他", "srcTxt": "114年第2次 財務分析筆記　第1題", "ex": "本題屬資產處分之會計處理判斷。舊有房屋結構遭拆除，即構成該資產之除列（derecognition）事件，依一般公認會計原則，處分（含毀損、拆除）固定資產時，應將該資產帳面金額自帳上除列，並將「處分價款（若有）與帳面金額之差額」認列為處分損益（列入當期損益）。\n\n逐項檢視： (A) 納入土地成本——僅適用於「購地時即已預知須拆除舊屋以整地」之情形，此時舊屋成本因屬取得土地所必要之犧牲，才併入土地成本。本題房屋是超市既有資產，因營業需要才拆除重建，並非購地當下即預定拆除，故不適用。 (B) 以其他損失處理——「其他損失」為財務報表中歸類較模糊之科目，處分資產所生之損益應明確列為「處分資產損益」，而非籠統歸為其他損失，故不正確。 (C) 以舊屋之處分損益處理——正確。舊屋拆除即為資產處分行為，應將其帳面金額除列，並認列處分損益（帳面金額全數轉為處分損失，因無殘值可回收）。 (D) 納入新建築成本——舊屋帳面金額與新建物之建造無直接因果關係，不可混入新資產之取得成本，否則將使新建築成本虛增、失真。"}, {"id": "12eb1c099511", "head": "若武當山公司每年銷貨成本為$285,000，營業費用為$100,000（非現金費用為$20,000），其速動資產為$7,000，試問該公司短期涵蓋比率為何（假設一年為365天）？", "opts": [["A", "6"], ["B", "8"], ["C", "7"], ["D", "5"]], "ans": "C", "tag": "損益表項目與收入認列", "srcTxt": "114年第2次 財務分析筆記　第2題", "ex": "短期涵蓋比率（又稱防禦間隔天數，defensive interval ratio）衡量企業僅憑目前速動資產，在不依賴額外營收之情況下，可支應多少天的日常現金營運支出，公式為：\n\n短期涵蓋比率 = 速動資產 ÷ 平均每日現金營運支出\n\n其中「平均每日現金營運支出」須先將現金基礎之營運支出年度總額換算為日均值，計算時應扣除非現金費用（因非現金費用不影響現金流出）：\n\n平均每日現金營運支出 = (銷貨成本 + 營業費用 − 非現金費用) ÷ 365 = (285,000 + 100,000 − 20,000) ÷ 365 = 365,000 ÷ 365 = 1,000（元/日）\n\n短期涵蓋比率 = 速動資產 ÷ 平均每日現金營運支出 = 7,000 ÷ 1,000 = 7（天）"}, {"id": "cabaacb579f1", "head": "大方公司20X4年度稅後淨利為$100,000，股東權益包含：8%不可轉換特別股50,000股、每股面額$10，以及普通股100,000股、每股面額$30，兩種股票均全年流通在外。當普通股每股市價為$60時，則該公司20X4年度的本益比為多少？", "opts": [["A", "50"], ["B", "100"], ["C", "0.01"], ["
