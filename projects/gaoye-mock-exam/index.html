const PER_SUBJECT_SEC = 60 * 60;

const S = {
  paper: DATA.papers[0].id,
  subj: DATA.subjects[0],
  order: {},
  ans: {},
  left: {},
  started: {},
  done: {},
  view: 'exam'
};
const key = (p, s) => p + '|' + s;
const paperOf = id => DATA.papers.find(p => p.id === id);
const qsOf = (p, s) => paperOf(p).subjects[s];

function initState() {
  for (const p of DATA.papers) {
    for (const s of DATA.subjects) {
      const k = key(p.id, s);
      S.ans[k] = {};
      S.left[k] = PER_SUBJECT_SEC;
      S.started[k] = false;
      shuffleSubject(p.id, s);
    }
  }
}

function shuffleSubject(p, s) {
  const n = qsOf(p, s).length;
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  S.order[key(p, s)] = a;
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}

function mmss(sec) {
  sec = Math.max(0, sec);
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' +
         String(sec % 60).padStart(2, '0');
}

function renderTabs() {
  document.getElementById('paperTabs').innerHTML = DATA.papers.map(function (p) {
    return '<button class="tab' + (S.view === 'exam' && p.id === S.paper ? ' on' : '') +
           '" data-p="' + p.id + '" type="button">' + esc(p.name) + '</button>';
  }).join('') +
    '<button class="tab' + (S.view === 'review' ? ' on' : '') +
    '" data-view="review" type="button">錯題本</button>';

  const examMode = S.view === 'exam';
  document.getElementById('subjTabs').classList.toggle('hide', !examMode);
  document.querySelector('.bar').classList.toggle('hide', !examMode);
  document.getElementById('review').classList.toggle('hide', examMode);
  if (!examMode) {
    document.getElementById('quiz').classList.add('hide');
    document.getElementById('result').classList.add('hide');
    return;
  }

  document.getElementById('subjTabs').innerHTML = DATA.subjects.map(function (s) {
    const k = key(S.paper, s);
    const done = Object.keys(S.ans[k]).length;
    const tot = qsOf(S.paper, s).length;
    return '<button class="stab' + (s === S.subj ? ' on' : '') +
           '" data-s="' + esc(s) + '" type="button">' + esc(s) +
           '<span class="mini">' + done + '/' + tot + '</span></button>';
  }).join('');

  document.getElementById('paperNote').innerHTML =
    '<b>' + esc(paperOf(S.paper).name) + '</b>　' + esc(paperOf(S.paper).note);
}

function renderQuiz() {
  if (S.done[S.paper]) { renderResult(); return; }
  document.getElementById('result').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');

  const k = key(S.paper, S.subj);
  const qs = qsOf(S.paper, S.subj);
  const ord = S.order[k];
  const locked = S.left[k] <= 0;

  if (!S.started[k]) {
    document.getElementById('quiz').innerHTML =
      '<div class="card start"><div class="stitle">' + esc(S.subj) + '</div>' +
      '<div class="sinfo">' + qs.length + ' 題　｜　作答時間 ' +
      Math.round(PER_SUBJECT_SEC / 60) + ' 分鐘　｜　每題 2 分，70 分及格</div>' +
      '<div class="sinfo">按下開始後計時才啟動；切換到其他科目時，本科計時會暫停。</div>' +
      '<button class="btn" id="btnStart" type="button">開始作答</button></div>';
    updateProg();
    return;
  }

  document.getElementById('quiz').innerHTML = ord.map(function (qi, pos) {
    const q = qs[qi];
    const picked = S.ans[k][qi];
    const opts = q.opts.map(function (o) {
      return '<label class="opt"><input type="radio" name="q' + qi + '" value="' + o[0] + '"' +
             (picked === o[0] ? ' checked' : '') + (locked ? ' disabled' : '') +
             ' data-qi="' + qi + '"><span class="L">(' + o[0] + ')</span>' + esc(o[1]) + '</label>';
    }).join('');
    return '<div class="q' + (locked ? ' locked' : '') + '">' +
           '<div class="qh"><span class="qn">' + (pos + 1) + '.</span>' +
           '<span class="qt">' + esc(q.head) +
           '<div class="tagline">' + esc(q.tag) + '</div></span></div>' + opts + '</div>';
  }).join('');
  updateProg();
}

function updateProg() {
  const k = key(S.paper, S.subj);
  const done = Object.keys(S.ans[k]).length;
  const tot = qsOf(S.paper, S.subj).length;
  let all = 0, allTot = 0;
  for (const s of DATA.subjects) {
    all += Object.keys(S.ans[key(S.paper, s)]).length;
    allTot += qsOf(S.paper, s).length;
  }
  document.getElementById('prog').textContent =
    '本科 ' + done + '/' + tot + '　全卷 ' + all + '/' + allTot +
    (!S.started[k] ? '　（本科尚未開始）'
      : S.left[k] <= 0 ? '　（本科時間已到，已鎖定）' : '');

  const c = document.getElementById('clock');
  c.textContent = mmss(S.left[k]);
  c.className = 'clock' + (S.left[k] <= 0 ? ' over' : (S.left[k] <= 300 ? ' warn' : ''));
}

function grade() {
  const res = {subjects: {}, byTag: {}};
  for (const s of DATA.subjects) {
    const k = key(S.paper, s);
    const qs = qsOf(S.paper, s);
    let right = 0, blank = 0;
    qs.forEach(function (q, qi) {
      const a = S.ans[k][qi];
      const ok = a === q.ans;
      if (!a) { blank++; } else if (ok) { right++; }
      const tk = s + ' ｜ ' + q.tag;
      const t = res.byTag[tk] || (res.byTag[tk] = {subj: s, name: q.tag, right: 0, tot: 0});
      t.tot++;
      if (ok) { t.right++; }
    });
    res.subjects[s] = {right: right, blank: blank, tot: qs.length,
                       score: qs.length ? Math.round(right / qs.length * 100) : null};
  }
  S.done[S.paper] = res;
  postAttempt(res);
}

// ---------- 紀錄上傳（離線先排隊，下次連線補傳）----------
const QKEY = 'gaoye_pending_attempts';

function loadQueue() {
  try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {}
}
function setSync(msg, bad) {
  const el = document.getElementById('sync');
  if (el) { el.textContent = msg; el.className = 'sync' + (bad ? ' bad' : ''); }
}

function buildPayload(res) {
  const p = paperOf(S.paper);
  const answers = [];
  const subjects = {};
  for (const s of DATA.subjects) {
    const k = key(S.paper, s);
    const r = res.subjects[s];
    if (!r.tot) { continue; }   // 重練卷可能某科 0 題，別送假的 0 分上去
    subjects[s] = {score: r.score, right: r.right, blank: r.blank, tot: r.tot,
                   secs: PER_SUBJECT_SEC - S.left[k]};
    qsOf(S.paper, s).forEach(function (q, qi) {
      const a = S.ans[k][qi] || null;
      answers.push({subject: s, qid: q.id, head: q.head, tag: q.tag,
                    chosen: a, correct: q.ans, ok: a === q.ans});
    });
  }
  return {paper: S.paper, paperName: p.name, subjects: subjects, answers: answers};
}

function send(payload) {
  return fetch('api/attempt', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(function (r) {
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.json();
  });
}

function postAttempt(res) {
  const payload = buildPayload(res);
  setSync('紀錄上傳中…');
  send(payload).then(function () {
    setSync('紀錄已儲存');
    flushQueue();
  }).catch(function () {
    const q = loadQueue();
    q.push(payload);
    saveQueue(q);
    setSync('離線：已暫存本機，連線後自動補傳（待傳 ' + q.length + ' 份）', true);
  });
}

function flushQueue() {
  const q = loadQueue();
  if (!q.length) { return Promise.resolve(); }
  return send(q[0]).then(function () {
    const rest = loadQueue().slice(1);
    saveQueue(rest);
    if (rest.length) { return flushQueue(); }
    setSync('離線暫存的紀錄已補傳完成');
  }).catch(function () {});
}

function renderResult() {
  const res = S.done[S.paper];
  document.getElementById('quiz').classList.add('hide');
  const box = document.getElementById('result');
  box.classList.remove('hide');

  const cards = DATA.subjects.map(function (s) {
    const r = res.subjects[s];
    if (!r.tot) {
      return '<div class="res"><div class="nm">' + esc(s) + '</div>' +
             '<div class="sc" style="color:#aaa">—</div>' +
             '<div class="vd">本卷無此科題目</div></div>';
    }
    const pass = r.score >= 70;
    return '<div class="res"><div class="nm">' + esc(s) + '</div>' +
           '<div class="sc ' + (pass ? 'pass' : 'fail') + '">' + r.score + '</div>' +
           '<div class="vd">答對 ' + r.right + '／' + r.tot + '　未作答 ' + r.blank +
           '<span class="badge ' + (pass ? 'ok' : 'ng') + '">' +
           (pass ? '及格' : '不及格') + '</span></div></div>';
  }).join('');

  const tags = Object.keys(res.byTag).map(function (tk) { return res.byTag[tk]; })
    .filter(function (v) { return v.subj === S.subj; })
    .sort(function (a, b) {
      return (a.right / a.tot) - (b.right / b.tot) || b.tot - a.tot;
    });

  const tagRows = tags.map(function (v) {
    const pct = Math.round(v.right / v.tot * 100);
    return '<tr><td' + (pct < 60 ? ' class="wk"' : '') + '>' + esc(v.name) + '</td>' +
           '<td class="n">' + v.right + '/' + v.tot + '</td>' +
           '<td class="n' + (pct < 60 ? ' wk' : '') + '">' + pct + '%</td></tr>';
  }).join('');

  const k = key(S.paper, S.subj);
  const qs = qsOf(S.paper, S.subj);
  const ord = S.order[k];
  const review = ord.map(function (qi, pos) {
    const q = qs[qi];
    const a = S.ans[k][qi];
    const cls = !a ? 'blank' : (a === q.ans ? 'right' : 'wrong');
    const badge = !a ? '<span class="badge">未作答</span>'
      : (a === q.ans ? '<span class="badge ok">答對</span>'
                     : '<span class="badge ng">答錯</span>');
    const opts = q.opts.map(function (o) {
      let c = 'opt';
      if (o[0] === q.ans) { c += ' ans'; } else if (o[0] === a) { c += ' you'; }
      return '<div class="' + c + '"><span class="L">(' + o[0] + ')</span>' + esc(o[1]) + '</div>';
    }).join('');
    return '<div class="q ' + cls + '">' +
           '<div class="qh"><span class="qn">' + (pos + 1) + '.</span>' +
           '<span class="qt">' + esc(q.head) + badge +
           '<div class="tagline">' + esc(q.tag) + '</div></span></div>' + opts +
           '<div class="src">正解 (' + q.ans + ')　｜　' + esc(q.srcTxt) + '</div></div>';
  }).join('');

  box.innerHTML = '<div class="res-row">' + cards + '</div>' +
    '<div class="card"><b>' + esc(S.subj) + '</b> 各觀念得分（正確率低於 60% 以紅字標示）' +
    '<table style="margin-top:12px"><thead><tr><th>觀念</th>' +
    '<th class="n">答對/題數</th><th class="n">正確率</th></tr></thead><tbody>' +
    tagRows + '</tbody></table>' +
    '<div style="margin-top:12px;font-size:13px;color:#666">' +
    '切換上方科目分頁可看另外兩科的觀念統計與逐題檢討。</div></div>' +
    '<h2 style="font-size:19px;margin:26px 0 14px">' + esc(S.subj) + ' 逐題檢討</h2>' + review;

  document.getElementById('prog').textContent = '已交卷';
  document.getElementById('btnSubmit').disabled = true;
}

document.getElementById('paperTabs').onclick = function (e) {
  if (e.target.closest('[data-view]')) {
    S.view = 'review';
    renderTabs();
    renderReview();
    return;
  }
  const b = e.target.closest('[data-p]');
  if (!b) { return; }
  S.view = 'exam';
  S.paper = b.dataset.p;
  S.subj = DATA.subjects[0];
  document.getElementById('btnSubmit').disabled = !!S.done[S.paper];
  renderTabs(); renderQuiz(); updateProg();
};

document.getElementById('subjTabs').onclick = function (e) {
  const b = e.target.closest('[data-s]');
  if (!b) { return; }
  S.subj = b.dataset.s;
  renderTabs(); renderQuiz(); updateProg();
};

document.getElementById('quiz').onclick = function (e) {
  if (!e.target.closest('#btnStart')) { return; }
  S.started[key(S.paper, S.subj)] = true;
  renderQuiz();
};

document.getElementById('quiz').onchange = function (e) {
  const inp = e.target.closest('input[type=radio]');
  if (!inp) { return; }
  S.ans[key(S.paper, S.subj)][inp.dataset.qi] = inp.value;
  renderTabs(); updateProg();
};

document.getElementById('btnShuffle').onclick = function () {
  if (S.done[S.paper]) { return; }
  const k = key(S.paper, S.subj);
  if (Object.keys(S.ans[k]).length &&
      !confirm('重新洗題會清掉本科已作答的答案，確定嗎？')) { return; }
  S.ans[k] = {};
  shuffleSubject(S.paper, S.subj);
  renderTabs(); renderQuiz(); updateProg();
};

document.getElementById('btnSubmit').onclick = function () {
  let blank = 0;
  for (const s of DATA.subjects) {
    const k = key(S.paper, s);
    blank += qsOf(S.paper, s).length - Object.keys(S.ans[k]).length;
  }
  if (blank && !confirm('三科合計還有 ' + blank + ' 題未作答，確定要交卷嗎？')) { return; }
  grade(); renderTabs(); renderResult();
};

setInterval(function () {
  if (S.done[S.paper]) { return; }
  const k = key(S.paper, S.subj);
  if (S.started[k] && S.left[k] > 0) {
    S.left[k]--;
    if (S.left[k] === 0) { renderQuiz(); }
    updateProg();
  }
}, 1000);

// ---------- 錯題本 ----------
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

function lineChart(rows) {
  // 進步曲線：零依賴的內嵌 SVG。x = 第幾次交卷，y = 分數 0-100，三科各一條線。
  if (!rows.length) { return '<div class="empty">還沒有任何交卷紀錄。</div>'; }
  const byTs = {};
  rows.forEach(function (r) { (byTs[r.ts] = byTs[r.ts] || {})[r.subject] = r; });
  const stamps = Object.keys(byTs).sort();
  const W = Math.max(560, 90 + stamps.length * 66), H = 260;
  const L = 46, R = 16, T = 16, B = 46;
  const x = function (i) {
    return L + (stamps.length < 2 ? 0 : i * (W - L - R) / (stamps.length - 1));
  };
  const y = function (v) { return T + (100 - v) * (H - T - B) / 100; };
  const colors = {'投資學': '#1d4ed8', '財務分析': '#15803d', '法規': '#b45309'};
  let g = '';
  for (let v = 0; v <= 100; v += 25) {
    g += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v) +
         '" stroke="' + (v === 70 ? '#b91c1c' : '#eee') + '"' +
         (v === 70 ? ' stroke-dasharray="4 3"' : '') + '/>' +
         '<text x="' + (L - 8) + '" y="' + (y(v) + 4) +
         '" font-size="11" fill="#888" text-anchor="end">' + v + '</text>';
  }
  DATA.subjects.forEach(function (s) {
    const pts = [];
    stamps.forEach(function (t, i) {
      const r = byTs[t][s];
      if (r) { pts.push([x(i), y(r.score)]); }
    });
    if (!pts.length) { return; }
    g += '<polyline fill="none" stroke="' + colors[s] + '" stroke-width="2" points="' +
         pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>';
    g += pts.map(function (q) {
      return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) +
             '" r="3.2" fill="' + colors[s] + '"/>';
    }).join('');
  });
  stamps.forEach(function (t, i) {
    const d = new Date(t);
    g += '<text x="' + x(i) + '" y="' + (H - B + 18) +
         '" font-size="10" fill="#888" text-anchor="middle">' +
         (d.getMonth() + 1) + '/' + d.getDate() + '</text>';
  });
  const legend = DATA.subjects.map(function (s) {
    return '<span style="margin-right:16px;font-size:13px">' +
           '<span style="display:inline-block;width:11px;height:3px;background:' + colors[s] +
           ';vertical-align:middle;margin-right:5px"></span>' + esc(s) + '</span>';
  }).join('') + '<span style="font-size:13px;color:#b91c1c">— — 70 分及格線</span>';
  return '<div class="chart"><svg width="' + W + '" height="' + H + '" role="img">' + g +
         '</svg></div><div style="margin-top:6px">' + legend + '</div>';
}

function renderReview() {
  const box = document.getElementById('review');
  box.innerHTML = '<div class="empty">載入紀錄中…</div>';
  const get = function (u) {
    return fetch(u).then(function (r) { return r.json(); })
                   .catch(function () { return {items: []}; });
  };
  Promise.all([get('api/history'), get('api/stats'), get('api/wrong?limit=200')])
    .then(function (out) {
      const hist = out[0].items || [], stats = out[1].items || [], wrong = out[2].items || [];
      const pend = loadQueue().length;

      const statRows = stats.map(function (v) {
        const p = pct(v.nright, v.nanswered);
        return '<tr><td>' + esc(v.subject) + '</td><td' + (p < 60 ? ' class="wk"' : '') + '>' +
               esc(v.tag) + '</td><td class="n">' + v.nright + '/' + v.nanswered +
               '</td><td class="n' + (p < 60 ? ' wk' : '') + '">' + p + '%</td></tr>';
      }).join('');

      const wrongCards = wrong.map(function (w) {
        return '<div class="wq"><div class="wh">' + esc(w.head) + '</div>' +
               '<div class="wm"><span class="pill">錯 ' + w.nwrong + ' 次</span>' +
               esc(w.subject) + '｜' + esc(w.tag) + '｜作答 ' + w.nseen + ' 次' +
               (w.wrongPicks ? '｜錯選 ' + esc(w.wrongPicks) : '') + '</div></div>';
      }).join('');

      box.innerHTML =
        (pend ? '<div class="note">尚有 <b>' + pend +
                '</b> 份離線紀錄待補傳，連上線後會自動送出。</div>' : '') +
        '<h2>進步曲線</h2>' + lineChart(hist) +
        '<h2>觀念弱點（正確率低於 60% 標紅）</h2>' +
        (stats.length
          ? '<div class="card"><table><thead><tr><th>科目</th><th>觀念</th>' +
            '<th class="n">答對/作答</th><th class="n">正確率</th></tr></thead><tbody>' +
            statRows + '</tbody></table></div>'
          : '<div class="empty">還沒有作答紀錄。</div>') +
        '<h2>錯題清單（' + wrong.length + ' 題）' +
        (wrong.length
          ? ' <button class="btn" id="btnRetry" type="button" ' +
            'style="font-size:14px;padding:6px 14px;margin-left:8px">用這些題組一份重練卷</button>'
          : '') +
        '</h2>' + (wrong.length ? wrongCards : '<div class="empty">目前沒有錯題。</div>');

      const rb = document.getElementById('btnRetry');
      if (rb) { rb.onclick = function () { buildRetry(wrong); }; }
    });
}

// 用錯題組重練卷：題目本來就內嵌在本頁，依 qid 撈回來即可，不必再跟伺服器要題目。
function buildRetry(wrong) {
  const want = {};
  wrong.forEach(function (w) { want[w.qid] = true; });
  const seen = {}, subjects = {};
  DATA.papers.forEach(function (p) {
    if (p.id === 'retry') { return; }
    DATA.subjects.forEach(function (s) {
      (p.subjects[s] || []).forEach(function (q) {
        if (want[q.id] && !seen[q.id]) {
          seen[q.id] = true;
          (subjects[s] = subjects[s] || []).push(q);
        }
      });
    });
  });
  DATA.subjects.forEach(function (s) { subjects[s] = subjects[s] || []; });
  const n = DATA.subjects.reduce(function (a, s) { return a + subjects[s].length; }, 0);
  if (!n) { alert('這些錯題不在目前這兩份卷裡，無法組卷。'); return; }

  const paper = {id: 'retry', name: '錯題重練卷', subjects: subjects,
                 note: '由歷次答錯的題目組成，共 ' + n + ' 題。每次重組都會依最新錯題名單產生。'};
  const at = DATA.papers.findIndex(function (p) { return p.id === 'retry'; });
  if (at >= 0) { DATA.papers.splice(at, 1, paper); } else { DATA.papers.push(paper); }

  DATA.subjects.forEach(function (s) {
    const k = key('retry', s);
    S.ans[k] = {};
    S.left[k] = PER_SUBJECT_SEC;
    S.started[k] = false;
    shuffleSubject('retry', s);
  });
  delete S.done['retry'];
  S.view = 'exam';
  S.paper = 'retry';
  S.subj = DATA.subjects.find(function (s) { return subjects[s].length; }) || DATA.subjects[0];
  document.getElementById('btnSubmit').disabled = false;
  renderTabs(); renderQuiz(); updateProg();
}

flushQueue();
initState();
renderTabs();
renderQuiz();
updateProg();
</script>
