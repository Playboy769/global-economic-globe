<div style="max-width:900px;margin:0 auto;background:#fff;border:1px solid #e2e4ea;border-radius:8px;padding:10px;">
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:'Noto Serif TC',serif;">
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#161616">圖：Tirzepatide 雙重 GIP／GLP-1 受體促效劑作用機轉</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b6b6b">進食後腸道分泌兩種腸泌素，Tirzepatide 同時模擬並強化兩者的訊號</text>

  <!-- Column 1: Gut -->
  <rect x="40" y="120" width="170" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="125" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">腸道（進食後）</text>
  <text x="125" y="175" text-anchor="middle" font-size="11" fill="#4338ca">L細胞／K細胞</text>
  <text x="125" y="192" text-anchor="middle" font-size="10.5" fill="#6b6b6b">分泌內生性腸泌素</text>

  <!-- Two hormone arrows -->
  <line x1="210" y1="145" x2="300" y2="90" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <line x1="210" y1="185" x2="300" y2="240" stroke="#c2600a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="300" y="55" width="150" height="60" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="375" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">GLP-1</text>
  <text x="375" y="98" text-anchor="middle" font-size="10" fill="#0e7490">類升糖素胜肽-1</text>

  <rect x="300" y="215" width="150" height="60" rx="8" fill="#fff7ed" stroke="#c2600a" stroke-width="1.5"/>
  <text x="375" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">GIP</text>
  <text x="375" y="258" text-anchor="middle" font-size="10" fill="#9a3412">葡萄糖依賴性胰島素釋放肽</text>

  <!-- Tirzepatide binds both -->
  <line x1="450" y1="85" x2="540" y2="150" stroke="#0891b2" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowTeal)"/>
  <line x1="450" y1="245" x2="540" y2="180" stroke="#c2600a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="540" y="130" width="180" height="70" rx="12" fill="#15181a"/>
  <text x="630" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Tirzepatide</text>
  <text x="630" y="180" text-anchor="middle" font-size="10.5" fill="#c9cdce">單一分子同時活化雙受體</text>

  <!-- Down to pancreas -->
  <line x1="630" y1="200" x2="630" y2="250" stroke="#111111" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <rect x="540" y="250" width="180" height="60" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="630" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">胰臟 β 細胞</text>
  <text x="630" y="293" text-anchor="middle" font-size="10" fill="#9d174d">GLP-1受體＋GIP受體共同表現</text>

  <!-- Effects branching out, generous spacing to avoid overlap -->
  <line x1="630" y1="310" x2="630" y2="345" stroke="#111111" stroke-width="1.5"/>
  <line x1="630" y1="345" x2="180" y2="345" stroke="#111111" stroke-width="1.5"/>
  <line x1="630" y1="345" x2="630" y2="345" stroke="#111111" stroke-width="1.5"/>
  <line x1="630" y1="345" x2="1080" y2="345" stroke="#111111" stroke-width="0"/>

  <!-- Effect nodes: 4 boxes evenly spaced with wide gaps to prevent text collision -->
  <line x1="180" y1="345" x2="180" y2="375" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="410" y1="345" x2="410" y2="375" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="630" y1="345" x2="630" y2="375" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="850" y1="345" x2="850" y2="375" stroke="#111111" stroke-width="0"/>
  <line x1="410" y1="345" x2="180" y2="345" stroke="#111111" stroke-width="1.5"/>

  <rect x="70" y="378" width="220" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">葡萄糖依賴性</text>
  <text x="180" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">胰島素分泌↑</text>
  <text x="180" y="443" text-anchor="middle" font-size="10" fill="#166534">改善餐後血糖</text>
  <text x="180" y="458" text-anchor="middle" font-size="10" fill="#166534">低血糖風險較低</text>

  <rect x="300" y="378" width="220" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">升糖素分泌↓</text>
  <text x="410" y="426" text-anchor="middle" font-size="10" fill="#166534">抑制肝臟葡萄糖</text>
  <text x="410" y="443" text-anchor="middle" font-size="10" fill="#166534">釋放，降低空腹血糖</text>

  <rect x="520" y="378" width="220" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">胃排空延緩</text>
  <text x="630" y="426" text-anchor="middle" font-size="10" fill="#1e40af">延長飽足感</text>
  <text x="630" y="443" text-anchor="middle" font-size="10" fill="#1e40af">降低餐後血糖高峰</text>

  <line x1="740" y1="345" x2="850" y2="345" stroke="#111111" stroke-width="1.5"/>
  <line x1="850" y1="345" x2="850" y2="375" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <rect x="740" y="378" width="140" height="88" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="810" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">下視丘</text>
  <text x="810" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">食慾中樞</text>
  <text x="810" y="443" text-anchor="middle" font-size="10" fill="#6b21a8">抑制食慾</text>
  <text x="810" y="458" text-anchor="middle" font-size="10" fill="#6b21a8">增加飽足訊號</text>

  <text x="450" y="500" text-anchor="middle" font-size="11.5" fill="#333333">GLP-1 與 GIP 協同作用（synergistic effect），實測胰島素反應顯著大於單獨給予任一激素</text>
  <text x="450" y="520" text-anchor="middle" font-size="10.5" fill="#8a8a8a">資料來源：作者依 Frías JP et al., Lancet 2021 與 tirzepatide 藥理學文獻繪製示意圖，非原始論文插圖</text>

  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0891b2"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2600a"/></marker>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#111111"/></marker>
  </defs>
</svg>
</div>
